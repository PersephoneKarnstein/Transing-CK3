l_english:
 tm_flyting_interaction:0 "Challenge to a Flyting"
 tm_flyting_interaction_desc:0 "Stand up and battle [recipient.GetFirstName] with words: three rounds of charge and answer, until one of you falls silent. In the hall the whole court hears it. At the thing in June, the stakes double."

 tm_flyting.0001.t:0 "Wound-Words"
 tm_flyting.0001.desc.challenged:0 "[tm_flyter.GetFirstName] has stood up at the drinking and asked, loud enough for everyone, who my father is and what I think I am. That is how a flyting starts. Whoever falls silent first has lost."
 tm_flyting.0001.desc.challenger:0 "I have stood up and named [tm_flyter.GetFirstName] before the benches. A flyting has no weapons but words, and whoever falls silent first has lost."
 tm_flyting.0001.desc.alone:0 "\n\nNo one else is here to hear it. The law says that words with no witnesses are paid with words, and nothing more."
 tm_flyting.0001.desc.hall:0 "\n\nThe hall has gone quiet to listen. Whatever is said tonight will be repeated tomorrow."
 tm_flyting.0001.desc.thing:0 "\n\nThis is the thing, and half the district is listening. Words spoken at the assembly count double."
 tm_flyting.0001.a:0 "Answer."
 tm_flyting.0001.b:0 "Say nothing, and let the hall decide what that means."
 tm_flyting.0001.c:0 "Think better of it."

 tm_flyting.0010.t:0 "Charge and Answer"
 tm_flyting.0010.desc.score:0 "Round [ROOT.Char.MakeScope.Var('tm_flyt_round').GetValue|0] of three. The hall reckons it [ROOT.Char.MakeScope.Var('tm_flyt_me').GetValue|0] to me, [ROOT.Char.MakeScope.Var('tm_flyt_them').GetValue|0] to [tm_flyter.GetFirstName].\n\n"
 tm_flyting.0010.desc.ragr:0 "[tm_flyter.GetFirstName] says the old word. "Ragr. Everyone in this hall knows what you are." It is the word the law makes the speaker answer for."
 tm_flyting.0010.desc.daughter:0 "[tm_flyter.GetFirstName] laughs. "While the rest of us were out at sea, you sat at home like your father's daughter.""
 tm_flyting.0010.desc.craven:0 "[tm_flyter.GetFirstName] says I ran when the shields closed, and that everyone saw it."
 tm_flyting.0010.desc.kin:0 "[tm_flyter.GetFirstName] says I have my own kin's blood on my hands, and no one has paid for it."
 tm_flyting.0010.desc.idle:0 "[tm_flyter.GetFirstName] says I have never done anything worth a verse: I sleep late, eat well, and let others do the work."
 tm_flyting.0010.own:0 "Own the word."
 tm_flyting.0010.own.tt:0 "I take the word and leave its contempt on the floor. "Seiðr is women's art. I am a woman, and I do it." [tm_flyter.GetHerHis|U] point is taken back, and the hall's goes to me: most of all if I am a daughter of the High Seat already."
 tm_flyting.0010.concede:0 ""That may be. But hear what I did with it.""
 tm_flyting.0010.concede.tt:0 "The charge is true; I do not deny the fact, I fight over what it means. [tm_flyter.GetHerHis|U] point is taken back. Learning and diplomacy together make the turn sharper."
 tm_flyting.0010.false:0 ""Not a word of that is true, and everyone here knows it.""
 tm_flyting.0010.false.tt:0 "An untrue charge rebounds on the one who made it. [tm_flyter.GetHerHis|U] point is taken back, and [tm_flyter.GetSheHe] loses another."
 tm_flyting.0010.charge.tt:0 "A true charge lands hard, and a good speaker drives it home. An untrue one rebounds on me. Look at what [tm_flyter.GetFirstName] really is before I say it."
 tm_flyting.0010.craven:0 "Name [tm_flyter.GetFirstName] a coward."
 tm_flyting.0010.oath:0 "Name [tm_flyter.GetFirstName] an oath-breaker."
 tm_flyting.0010.kin:0 "Name the kin [tm_flyter.GetFirstName] wronged."
 tm_flyting.0010.drink:0 "Name [tm_flyter.GetFirstName] a drunkard and a glutton."
 tm_flyting.0010.curse:0 "Wish [tm_flyter.GetFirstName] to Hel's hall."
 tm_flyting.0010.silent:0 "I have nothing more to say."

 tm_flyting.0020.t:0 "The Last Word"
 tm_flyting.0020.desc.win:0 "[tm_flyter.GetFirstName] opened their mouth, and nothing came. The hall knows who had the last word."
 tm_flyting.0020.desc.lose:0 "I opened my mouth, and nothing came. The hall knows who had the last word."
 tm_flyting.0020.desc.draw:0 "Neither of us has fallen silent, and neither will."
 tm_flyting.0020.desc.cup:0 "\n\n[tm_cup_lady.GetFirstName] has come forward from the benches with the cup, as the lady of the hall does when a flyting has gone far enough."
 tm_flyting.0020.desc.nocup:0 ""
 tm_flyting.0020.win:0 "I had the last word."
 tm_flyting.0020.lose:0 "I fell silent."
 tm_flyting.0020.draw:0 "Let it stand."
 tm_flyting.0020.cup:0 "Take the cup from [tm_cup_lady.GetFirstName], and let it end there."
 tm_flyting.0020.cup.tt:0 "The flyting ends with no winner and no one silenced. Both of us think better of the one who poured."
 tm_flyting.0020.thing.tt:0 "It was said at the thing: the whole district will repeat it."

 tm_last_word_modifier:0 "Had the Last Word"
 tm_last_word_modifier_desc:0 "This character won a flyting. The hall still repeats what was said."
 tm_fell_silent_modifier:0 "Fell Silent"
 tm_fell_silent_modifier_desc:0 "This character lost a flyting, and has been quieter since."
