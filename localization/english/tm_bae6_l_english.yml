l_english:
 # Bædling, wave 15: raising a níð-pole oneself, the Níð of the Land, vows over the cup (events/tm_bae6_events.txt)

 # Raise the Níð-Pole (scheme)
 tm_bae6_raise_pole:0 "Raise the Níð-Pole"
 tm_bae6_raise_pole_action:0 "Raise the Níð-Pole"
 tm_bae6_raise_pole_desc:0 "I will have a pole raised on [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]'s coast, turned toward his hall."
 tm_bae6_raise_pole_desc_general:0 "The $tm_bae6_raise_pole$ [scheme|E] is a [hostile_scheme|E] against someone whose house owes yours a wrong in the Account, or against your rival. It is a [secret_scheme|E] based on [intrigue|E]. You pay; a man of your court carves the figures and the runes, and night-men set it up facing his hall.\n\nThe pole is public: he will know who paid for it. What the scheme keeps secret is the carver's name. If it comes out, the carver may answer for it at law where the law knows carved níð."
 TM_BAE6_RAISE_POLE_SUCCESS_DESC:0 "A níð-pole stands facing [TARGET_CHARACTER.GetShortUIName]'s hall. It enters the Account between your houses, and where his house owed yours it pays off two wrongs, not one."
 TM_BAE6_RAISE_POLE_DISCOVERY_DESC:0 "[TARGET_CHARACTER.GetShortUIName] does not learn whose hand carved it"
 tm_bae6_raise_pole_interaction:0 "Raise the Níð-Pole #weak (Scheme)#!"
 tm_bae6_raise_pole_interaction_desc:0 "[recipient.GetShortUIName|U] has wronged my house, or stands as my rival. A man of my court can carve a pole for me, and the whole coast will read it."
 tm_bae6_raise_pole_notification:0 "Raise the Níð-Pole"
 tm_bae6_raise_pole_invalidated_title:0 "@scheme_icon! Raise the Níð-Pole Ends"
 tm_bae6_raise_pole_invalidated_tt:0 "The pole will not go up: the one it names is gone, or out of reach."
 tm_bae6_raise_pole_no_carver:0 "A grown man of your court, free and not a ruler, must carve it"
 tm_bae6_agent_join_faith:0 "Of the Bædling rite"
 tm_bae6_agent_join_rival:0 "Hates the one it names"
 tm_bae6_pole_open_ground:0 "A headland is open ground"
 tm_bae6_agent_carver:0 "Carver"
 tm_bae6_agent_carver_i:0 "[success_chance_i]"
 tm_bae6_agent_carver_desc:0 "#WEAK A man of your court who cuts the figures and the runes. If his name comes out, the charge at law is his.#!\n$EFFECT_LIST_BULLET$ Provides [success_chance_i] [success_chance|E]\n$EFFECT_LIST_BULLET$ Must be a grown man of your court, not a ruler\n$EFFECT_LIST_BULLET$ Requires [learning_i] [learning|E] & [intrigue_i] [intrigue|E]\n$EFFECT_LIST_BULLET$ #P Best#! if a poet"
 tm_bae6_agent_poet:0 "A poet knows how a verse cuts"
 tm_bae6_agent_nightman:0 "Night-Man"
 tm_bae6_agent_nightman_i:0 "[secrecy_i]"
 tm_bae6_agent_nightman_desc:0 "#WEAK Someone who carries the pole to the headland and sets it up unseen.#!\n$EFFECT_LIST_BULLET$ Provides [secrecy_i] [secrecy|E]\n$EFFECT_LIST_BULLET$ Must live at your court or at the target's\n$EFFECT_LIST_BULLET$ Requires [intrigue_i] [intrigue|E] & [prowess_i] [prowess|E]\n$EFFECT_LIST_BULLET$ #P Best#! if of the target's own household"
 tm_bae6_agent_his_household:0 "Knows his coast and the hour"

 tm_bae6.0001.t:0 "A Night for the Pole"
 tm_bae6.0001.desc:0 "[tm_bae6_carver.GetFirstName] has finished the pole. He cut the figures as the old poles have them, and the runes along the shaft name [tm_bae6_target.GetShortUINameNotMe] so that no one on that coast can mistake it.\n\nThe sea is quiet tonight and the moon is down. We could take it across now, or wait for a night with less light and fewer eyes."
 tm_bae6.0001.a:0 "Tonight."
 tm_bae6.0001.a.tt:0 "Roll the scheme's [scheme_success_chance|E]. Whether the carver is named depends on its [secrecy|E]."
 tm_bae6.0001.b:0 "Wait for a darker night."
 tm_bae6.0001.b.tt:0 "The scheme goes on."

 tm_bae6.0010.t:0 "The Pole Stands"
 tm_bae6.0010.desc:0 "At first light the pole was standing on the headland, turned toward [tm_bae6_target.GetFirstNamePossessive] hall. By noon the whole coast knew whose it was and whom it named.\n\nIt says the worst thing the North knows how to say of a man: that he is like a woman. I know what that is worth. So, now, does he. A gift like this one wants repaying, and my house has been waiting for its repayment long enough."
 tm_bae6.0010.desc.known:0 "\n\nBut someone saw [tm_bae6_carver.GetFirstName] on the shore. His name is going round with the pole."
 tm_bae6.0010.desc.unknown:0 "\n\nNo one saw who carved it, or who carried it. They know only who paid."
 tm_bae6.0010.a:0 "Let him read it."

 tm_bae6.0011.t:0 "A Pole on My Headland"
 tm_bae6.0011.desc:0 "Men of [tm_bae6_raiser.GetShortUINameNotMe] set up a pole on the headland in the night, turned toward my hall. Two men are carved on it, one bent before the other, and the one in front wears a blue hat. The runes say which of them is meant to be me, and they call me a mare, which is the worst thing they know how to say of a man.\n\n[tm_bae6_raiser.GetSheHe|U] did not carve it. [tm_bae6_raiser.GetSheHe|U] paid for it, and everyone knows it."
 tm_bae6.0011.desc.known:0 "\n\nThe man who carved it was seen: [tm_bae6_carver.GetShortUINameNotMe], of [tm_bae6_raiser.GetHerHis] court."
 tm_bae6.0011.desc.unknown:0 "\n\nNo one will say whose hand carved it."
 tm_bae6.0011.a:0 "Burn it."
 tm_bae6.0011.b:0 "The hat is Óðinn's, and so am I."
 tm_bae6.0011.c:0 "Let it stand. I am a Christian man; a carved stick does not frighten me."
 tm_bae6.0011.c.tt:0 "I answer the pole with humility, not with a feud. Nothing is written in the Account."
 tm_bae6.0011.d:0 "Bring the carver to law."
 tm_bae6.0011.e.tt:0 "The pole is a wrong at law, whoever paid for it. It goes into the Account between our houses."
 tm_bae6.law.tt:0 "Where the Christian law of Norway holds (from 1270), the carver must forfeit his silver and confess, or go into exile. Under the older law of the North, carved níð is a wrong apart from spoken níð, and the carver is sent abroad for three winters as a lesser outlaw."

 tm_bae6.0020.t:0 "The Pole Does Not Go Up"
 tm_bae6.0020.desc:0 "The night went wrong. The boat was seen before it was beached, or the dogs at [tm_bae6_target.GetFirstNamePossessive] steading woke, and [tm_bae6_carver.GetFirstName] and the others came back with the pole still in the boat."
 tm_bae6.0020.desc.known:0 "\n\nWorse: they knew [tm_bae6_carver.GetFirstName]. He was named on the shore, and the pole with him."
 tm_bae6.0020.desc.unknown:0 "\n\nNo one knows who they were. The pole is still mine to use."
 tm_bae6.0020.a:0 "Let it go."
 tm_bae6.0020.b:0 "Cut another."

 tm_bae6.0021.t:0 "The Carver on the Shore"
 tm_bae6.0021.desc:0 "My men caught [tm_bae6_carver.GetShortUINameNotMe] on the shore with a pole half out of the boat. The runes on it name me, and I can read whose silver paid for them: [tm_bae6_raiser.GetShortUINameNotMe]'s.\n\nThe pole never stood, so there is nothing for the coast to read. But the man who carved it is here, and so are the runes."
 tm_bae6.0021.a:0 "Bring him to law."
 tm_bae6.0021.b:0 "Send him home with a word for [tm_bae6_raiser.GetFirstName]."

 tm_bae6.0030.t:0 "The Law on the Pole"
 tm_bae6.0030.desc:0 "[tm_bae6_law_lord.GetShortUINameNotMe|U] has heard the charge against me. Under the Christian law of the realm, a man who raises a scorn-pole forfeits his silver and makes confession, or he leaves the realm.\n\nI carved what I was paid to carve. That will not help me here."
 tm_bae6.0030.a:0 "I will pay, and confess."
 tm_bae6.0030.b:0 "I will take ship."
 tm_bae6_confessed_modifier:0 "Confessed to the Pole"
 tm_bae6_confessed_modifier_desc:0 "This character carved a níð-pole and confessed it, as the Christian law requires."

 tm_bae6_pole_paid_modifier:0 "Paid for a Níð-Pole"
 tm_bae6_pole_paid_modifier_desc:0 "This character paid for a níð-pole. The pole shames whoever raises it, but a lord who had it carved bears less of that than the carver."
 tm_bae6_carver_caught_opinion:0 "Her carver was caught on my shore"

 # The Níð of the Land (decision)
 tm_bae6_nid_of_land_decision:0 "The Níð of the Land"
 tm_bae6_nid_of_land_decision_desc:0 "A king's house has wronged mine and not answered for it. Níð against a king is not the same as níð against a neighbour: it is sung in every hall of his land, a verse for every nose in it."
 tm_bae6_nid_of_land_decision_tooltip:0 "Have every Bædling ruler in the king's land make a verse against him."
 tm_bae6_nid_of_land_decision_confirm:0 "Let them sing"
 tm_bae6_nid_of_land_king_tt:0 "A king or emperor not of the Bædling rite, your own top liege or a neighbour, whose house owes yours a wrong in the Account, and who has not been sung against in ten years"
 tm_bae6_nid_of_land_decision.tt:0 "Every grown Bædling ruler in his realm, and each of your Bædling vassals, makes a verse and loses a little [prestige|E]. The king loses [prestige|E] and [legitimacy|E] by the number of verses, and is mocked in his halls for ten years. If you are his vassal, he may count it a crime against the crown."

 tm_bae6.0100.t:0 "The Níð of the Land"
 tm_bae6.0100.desc:0 "[tm_bae6_king.GetShortUINameNotMe|U] has never answered for what his house did to mine, and he never will while he wears a crown and I do not.\n\nThe old ones say that when a Danish king took a ship of the Icelanders, the Icelanders made a verse against him for every nose in their land. A king cannot outlaw a whole country. So it will be here: every one of us in his land will make a verse, and pay a little for it, and the verses will go from hall to hall until his own cupbearers know them."
 tm_bae6.0100.a:0 "Let it go from hall to hall."
 tm_bae6.0100.a.tt:0 "The verses reach [tm_bae6_king.GetShortUINameNoTooltip] within the month."

 tm_bae6.0101.t:0 "A Verse for Every Nose"
 tm_bae6.0101.desc:0 "There are verses about me in every hall of my land. My stewards hear them at the tables and pretend they have not. They are about the king's manhood, which the verses say he does not have, and about the king's crown, which they say sits on a mare. They are not clever. They do not need to be: there are a great many of them, and they all name me.\n\nThey began with [tm_bae6_poet.GetShortUINameNotMe], whose house says mine owes it."
 tm_bae6.0101.desc.vassal:0 "\n\n[tm_bae6_poet.GetSheHe|U] is my own vassal. Níð against a king is a crime of its own, apart from níð against any other man."
 tm_bae6.0101.desc.neighbour:0 "\n\n[tm_bae6_poet.GetSheHe|U] is no vassal of mine, but [tm_bae6_poet.GetHerHis] people live in my land, and they sing."
 tm_bae6.0101.a:0 "Let them sing. A Christian king can bear a little scorn."
 tm_bae6.0101.a.tt:0 "Humility answers the verses better than the sword: they lose their bite, and nothing is written in the Account."
 tm_bae6.0101.b:0 "This is a crime against the crown."
 tm_bae6.0101.b.tt:0 "If [tm_bae6_poet.GetSheHe] is my vassal, I may lawfully imprison her or take back her titles. Either way, it goes into the Account between our houses."
 tm_bae6.0101.c:0 "I will bear it."
 tm_bae6_nid_of_land_modifier:0 "The Níð of the Land"
 tm_bae6_nid_of_land_modifier_desc:0 "Verses against this ruler are sung in every hall of the realm, one for every Bædling nose in it."
 tm_bae6_nid_of_land_opinion:0 "Made the Níð of the Land against me"
 house_relation_reason_tm_bae6_land_nid_desc:0 "[char.GetShortUINameNotMe|U] made the Níð of the Land against [target_char.GetShortUINameNotMe]"

 # Vows over the cup
 tm_bae6.0200.t:0 "The Vow over the Cup"
 tm_bae6.0200.desc.bragarfull:0 "The cup is in my hands and the benches are waiting. By the old custom the heir speaks her vow before she drinks, and what is sworn over the bragarfull is sworn before the whole hall."
 tm_bae6.0200.desc.flyting:0 "The cup has ended the flyting. In the old halls, the cup that comes after hard words turns them into a vow: what I boasted of, I may now swear to do."
 tm_bae6.0200.desc:0 "\n\nA vow over the cup is for five winters, not for ever. The hall will remember it. If I keep it, they will say so; if I do not, someone will say that too."
 tm_bae6.0200.a:0 "I swear to answer what [tm_bae6_vow_foe.GetShortUINameNotMe]'s house did to mine."
 tm_bae6.0200.a.tt:0 "Kept if, within five years, that house no longer owes mine a wrong: answered by requital, or settled."
 tm_bae6.0200.b:0 "I swear to raise a Sisters' House."
 tm_bae6.0200.b.tt:0 "Kept if, within five years, I hold a county with a Sisters' House."
 tm_bae6.0200.c:0 "I swear to widen the hall's land."
 tm_bae6.0200.c.tt:0 "Kept if, within five years, my realm holds more counties than it does now."
 tm_bae6.0200.d:0 "I drink, and swear nothing."
 tm_bae6.0200.d.tt:0 "No vow is owed. The cup is still drunk."

 tm_bae6.0210.t:0 "The Vow Kept"
 tm_bae6.0210.desc.requital:0 "I swore over the cup that the wrong done to my house would be answered, and it has been. The benches have not forgotten the vow. Tonight they drink to its keeping."
 tm_bae6.0210.desc.house:0 "I swore over the cup to raise a Sisters' House, and its door is open. The benches remember the vow, and tonight they drink to the House."
 tm_bae6.0210.desc.land:0 "I swore over the cup to widen the hall's land, and it is wider. The benches remember the vow, and tonight they drink to the new land."
 tm_bae6.0210.a:0 "What I swore, I did."
 tm_bae6_vow_kept_opinion:0 "Kept her vow over the cup"
 tm_bae6_vow_kept_witness_opinion:0 "Kept the vow I saw her swear"

 tm_bae6.0211.t:0 "The Vow Broken"
 tm_bae6.0211.desc.requital:0 "Five winters ago I swore over the cup that the wrong done to my house would be answered. It has not been."
 tm_bae6.0211.desc.house:0 "Five winters ago I swore over the cup to raise a Sisters' House. There is none."
 tm_bae6.0211.desc.land:0 "Five winters ago I swore over the cup to widen the hall's land. It is no wider."
 tm_bae6.0211.desc:0 "\n\nThe benches remember. Someone will say so before long, and it is better that I say it first, if I am going to say it at all."
 tm_bae6.0211.a:0 "I say it myself, before the benches."
 tm_bae6.0211.a.tt:0 "No one else will need to say it."
 tm_bae6.0211.b:0 "I say nothing."
 tm_bae6.0211.b.tt:0 "The hall will think less of me, and a man who thinks little of me may open a flyting about the vow."
 tm_bae6_vow_broken_modifier:0 "Broke a Vow over the Cup"
 tm_bae6_vow_broken_modifier_desc:0 "This character swore over the cup and did not do what she swore."
 tm_bae6_vow_broken_opinion:0 "Broke her vow over the cup"
 tm_bae6_vow_broken_witness_opinion:0 "Broke the vow I saw her swear"
