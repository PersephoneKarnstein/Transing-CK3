l_english:
 tm_ml3.0010.t:0 "The Quarter That Dwindled"
 tm_ml3.0010.desc:0 "A quarter of [tm_ml2_share_county.GetName] has emptied. The families who lived there went where the dues were lighter, and the temple's lamps go short of oil and its kitchen of rice. [tm_ml3_settler.GetFirstName] of the Worn Garland asks for one of the empty houses. She would keep the temple's oil and rice, as the quarter once did, if I take no dues from her while it fills again."
 tm_ml3.0010.a:0 "Settle her there, free of the city's dues."
 tm_ml3.0010.a.tt:0 "She holds a share on the temple street, but it pays half until the quarter is resettled (10 years)."
 tm_ml3.0010.b:0 "Let the quarter stand empty."
 tm_ml3.0020.t:0 "Heroes of the Road"
 tm_ml3.0020.desc:0 "A merchant of [employer.GetFirstNamePossessive] markets is taking a caravan of pepper and cloth down to the coast. Out on that road the king's peace is more a word than a guard, and the merchants' guilds hire swords to keep their carts. They have hired us. We walk beside the bullocks, and the sacks are ours to keep whole."
 tm_ml3.0020.a:0 "We take the road."
 tm_ml3.0021.t:0 "Drawn Swords"
 tm_ml3.0021.desc:0 "Halfway to the coast, the caravan rests at a market town with no walls and no garrison. We could set a toll on its gate with our swords drawn, as armed merchants have done on roads like this one. The guild's own rules for the towns it guards forbid exactly that, and the guild has long ears."
 tm_ml3.0021.a:0 "We keep faith with the guild."
 tm_ml3.0021.b:0 "Take the toll."
 tm_ml3.0021.b.tt:0 "The guild may hear of it and dismiss the band before the coast."
 tm_ml3.0022.t:0 "The Coast"
 tm_ml3.0022.desc_success:0 "The caravan has come down to the coast with every sack whole. The merchants have counted their bales on the quay, and [employer.GetFirstName] has paid what was promised. On the road home, the townspeople call us heroes of the road."
 tm_ml3.0022.desc_toll:0 "Word of the toll reached the guild before we reached the coast. The merchants have paid us off at the last market and hired other swords for the rest of the way."
 tm_ml3.0022.desc_road:0 "Armed men came down on the caravan on the last stretch of the road and took two carts before we drove them off. The merchants count their losses, and the loss is ours to answer for."
 tm_ml3.0022.a:0 "The road is kept."
 tm_ml3.0022.b:0 "The next road, then."
 tm_ml3.0030.t:0 "Where the Heroes of the Road Trade"
 tm_ml3.0030.desc:0 "[tm_ml3_band.GetFirstName]'s band has brought three caravans through for the merchants of my markets. Now the merchants ask for a town of their own on the far road, under the band's protection: a place where the heroes of the road conduct trade. [tm_ml3_town.GetName] lies far from my seat, and out there my peace is more a word than a guard."
 tm_ml3.0030.a:0 "Offer the band [tm_ml3_town.GetName]."
 tm_ml3.0030.a.tt:0 "If the band accepts, it settles in [tm_ml3_town.GetName] by a negotiated settlement, and the county becomes a guild town."
 tm_ml3.0030.b:0 "My own officers will keep that road."
 tm_ml3.0031.t:0 "A Town on the Far Road"
 tm_ml3.0031.desc:0 "[tm_ml3_giver.GetFirstName] offers us [tm_ml3_town.GetName], to hold as a vassal and keep as a guild town: its market under our protection, its road under our swords. When a guild took a town under its protection, it freed the people of their dues and gave them twice the privileges they had before. The band has never had a roof that was not a tent."
 tm_ml3.0031.a:0 "We will hold it, and free the town of its dues."
 tm_ml3.0031.b:0 "We will hold it."
 tm_ml3.0031.c:0 "The road is our home."
 tm_ml3.0040.t:0 "The Lord of Vannadu"
 tm_ml3.0040.desc:0 "Merchants on the road tell the story of Valikandapuram. A guild held that town as its own and called it a fortress of trade. Then it took the side of a rebel chief, the lord of Vannadu, against the king. The king sent foreign generals, the chief was put down, and the country's borders were drawn anew. My town is a guild town too, and I have joined a faction against [tm_ml3_liege.GetFirstName]."
 tm_ml3.0040.a:0 "A guild town keeps the road, not the throne. I leave the faction."
 tm_ml3.0040.b:0 "We know our own road."
 tm_ml3_caravan_contract_contract:0 "Heroes of the Road"
 tm_ml3_caravan_contract_desc_title:0 "Swords for the far road,"
 tm_ml3_caravan_contract_desc:0 "A merchant of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] is taking a caravan of pepper and cloth from the inland markets down to the coast, and needs a band to keep the road."
 tm_ml3_caravan_contract_request:0 "This [task_contract|E] is for a band of the Worn Garland. The caravan's journey takes a few months, with one choice on the way."
 tm_ml3_market_lamp_modifier:0 "A Lamp Kept by the Market"
 tm_ml3_market_lamp_modifier_desc:0 "This character placed a gift with a market assembly, which keeps a lamp burning before the god in her name for ever, wherever she goes."
 tm_ml3_erivira_county_modifier:0 "A Guild Town"
 tm_ml3_erivira_county_modifier_desc:0 "A place where the heroes of the road conduct trade. The market grows under the band's protection, and the guild, not the lord, keeps its peace."
 tm_ml3_dues_freed_county_modifier:0 "Freed of Its Dues"
 tm_ml3_dues_freed_county_modifier_desc:0 "The band that guards this town freed its people of their dues and doubled their privileges."
 tm_ml3_nick_heroes_of_the_road:0 "of the Heroes of the Road"
 tm_ml3_nick_heroes_of_the_road_desc:0 "Captain of a band that has kept the merchants' road to the coast."
