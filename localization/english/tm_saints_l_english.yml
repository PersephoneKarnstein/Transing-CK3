l_english:
 # The five foremothers of Adelphai Dorleyaiou (history/characters/tm_saints.txt). Their lives, in the faith's voice.
 Bethania:0 "Bethania"

 tm_nick_the_first_mother:0 "the First Mother"
 tm_nick_the_first_mother_desc:0 "Stephania sold wool in the market at Dorylaion and quarrelled with half the weavers in it. When word came from Medina that a caliph had cut the singers, and that they said they were women now in truth, she went to the knife of her own will. The Sisters say she founded the House at Dorylaion and was the first Mother of Mothers, and that she died still owing the dyers."

 tm_nick_the_bookbearer:0 "the Bookbearer"
 tm_nick_the_bookbearer_desc:0 "Bethania copied the House's books in a slow, proud hand, and would not let anyone else touch her pens. When the governor's men came to Dorylaion to burn the books, she carried them out on her back. She was taken at Ankyra and would not name a single House. She died in his prison that winter, and the Sisters keep her feast with the books open."

 tm_nick_of_kyzikos:0 "of Kyzikos"
 tm_nick_of_kyzikos_desc:0 "Diana kept a huntress's name and said the Mother never minded. Stephania minded, and they argued about it until Stephania died, and stayed friends. Diana founded the first daughter House, at Kyzikos under Dindymon. She took in widows, barren wives and women no one else would house, and called them all sisters."

 tm_nick_the_physician:0 "the Physician"
 tm_nick_the_physician_desc:0 "Christina was a physician, and she cut only as the old canon lets physicians cut, for health. She taught the Houses to keep the knife clean and to sit with a sister through the fever, and she could never keep a kitchen fire alight. She died tending the sick at ruined Pepouza, among the prophetesses' stones."

 tm_nick_who_walked_beside:0 "Who Walked Beside"
 tm_nick_who_walked_beside_desc:0 "Philippa kept the ferry on the Sangarios, and walked the novice years beside more daughters than the Houses can count. Theia Beatrike was one of them, and they did not always get on. Philippa taught that a novice is a sister before the knife, and that the one who walks beside her learns as much as she does."
