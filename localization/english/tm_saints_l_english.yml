l_english:
 # The five foremothers of Adelphai Dorleyaiou (history/characters/tm_saints.txt). Their lives, in the faith's voice.
 Bethania:0 "Bethania"

 tm_nick_the_first_mother:0 "the First Mother"
 tm_nick_the_first_mother_desc:0 "When word came from Medina that a caliph had cut the singers, and that they said they were women now in truth, Stephania went to the knife of her own will. The Sisters say she founded the House at Dorylaion and was the first Mother of Mothers."

 tm_nick_the_bookbearer:0 "the Bookbearer"
 tm_nick_the_bookbearer_desc:0 "When the governor's men came to Dorylaion to burn the House's books, Bethania carried them out on her back. She was taken at Ankyra and would not name a single House. She died in his prison that winter, and the Sisters keep her feast with the books open."

 tm_nick_of_kyzikos:0 "of Kyzikos"
 tm_nick_of_kyzikos_desc:0 "Diana kept a huntress's name and said the Mother never minded. She founded the first daughter House, at Kyzikos under Dindymon. She took in widows, barren wives and women no one else would house, and called them all sisters."

 tm_nick_the_physician:0 "the Physician"
 tm_nick_the_physician_desc:0 "Christina was a physician, and she cut only as the old canon lets physicians cut, for health. She taught the Houses to keep the knife clean and to sit with a sister through the fever. She died tending the sick at ruined Pepouza, among the prophetesses' stones."

 tm_nick_who_walked_beside:0 "Who Walked Beside"
 tm_nick_who_walked_beside_desc:0 "Philippa walked the novice years beside more daughters than the Houses can count, and Theia Beatrike was one of them. She taught that a novice is a sister before the knife, and that the one who walks beside her learns as much as she does."
