l_english:
 tm_palace.0001.t:0 "The Inner Offices Write"
 tm_palace.0001.desc:0 "A letter has come from the palace under a commissioner's seal. The inner offices, the eunuchs' side of the court, offer me a post. Their great houses adopt across names, daughters as well as sons, and they would take me in as one of theirs. Their clerks would enter me in the register of palace eunuchs, since it is the only one they keep for people like me. My sisters have a saying for that: the palace calls us eunuchs so it need not call us women.\n\nThe scholar-officials would rather I stayed in my abbey. The society says what it always says. An office is the throne's to give and the throne's to take back, with everything its holder owns."
 tm_palace.0001.a:0 "Take the seal. Power is power."
 tm_palace.0001.b:0 "Stay with the society. What we hold, we hold together."
 tm_palace.0001.c:0 "Take the seal, and keep the society's books where the clerks cannot read them."
 tm_palace.0001.c.kept:0 "The society's books stayed closed"
 tm_palace.0001.c.found:0 "A clerk found the second ledger"
 tm_palace_estates_tt:0 "My Houses lose the throne's name-panel, and the magistrate will come to count them."
 tm_palace.0002.t:0 "A Memorial Against the Palace"
 tm_palace.0002.desc:0 "A censor has sent up a memorial against the palace's people, and my name is in it. \"The realm is the realm of the founders,\" it says, \"not of the inner offices.\" A censor once wrote nearly those words and was drowned for them. This one expects to fare better, and he may be right."
 tm_palace.0002.a:0 "The commanders will answer for me."
 tm_palace.0002.a.kept:0 "The memorial was left unanswered"
 tm_palace.0002.a.lost:0 "The throne took back the seal, and counted what I hold"
 tm_palace.0002.b:0 "Give back the seal before it is taken."
 tm_palace.0002.c:0 "Pay the censor's clerk to lose a page."
 tm_palace.0003.t:0 "The Palace Emptied"
 tm_palace.0003.desc:0 "The chief minister and the warlord at the gates have turned on the palace. Several hundred of its eunuchs were driven into the Palace Domestic Service and killed there, and the officers have orders to take the palace's people wherever they are found. My seal makes me one of them. Some governors are hiding the army supervisors who served them, and sending other prisoners to die in their place."
 tm_palace.0003.a:0 "Go to the sisters. The society keeps its own."
 tm_palace.0003.b:0 "Ask a governor to hide me."
 tm_palace.0003.c:0 "Keep the seal and wait."
 tm_palace.0003.c.hurt:0 "Soldiers found me first"
 tm_palace.0003.c.spared:0 "They passed my door"
 tm_palace_office_modifier:0 "Seal of the Inner Offices"
 tm_palace_office_modifier_desc:0 "She holds a post in the palace's inner offices. The throne gave it, and the throne can take it back."
