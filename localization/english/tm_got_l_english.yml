l_english:
 # Open Ports (docs/wave4/gotland.md; Dollinger pp. 78-81)
 tm_got_open_ports_decision:0 "Open the Ports"
 tm_got_open_ports_decision_desc:0 "I can open my ports to anyone who will go to sea at their own risk and harm my enemy. I pay them nothing. What they take, they keep, and my harbours will victual them while the war lasts."
 tm_got_open_ports_decision_confirm:0 "Open the ports"
 tm_got_open_ports_decision_tooltip:0 "License the bands near your coast to raid your enemy"
 tm_got_open_ports_decision.tt:0 "Every Bædling band camped within reach of your capital is offered your letters. A band that takes them joins your war on your side. The letters lapse when the war ends."
 tm_got_open_ports_coast_tt:0 "Your capital lies on the sea"
 tm_got_open_ports_band_tt:0 "A Bædling band camps within reach of your capital and is not your enemy"
 tm_got_contract_spawn.t:0 "Open Ports"
 tm_got_contract_spawn.desc:0 "[tm_got_lord.GetName|U] has opened [tm_got_lord.GetHerHis] ports to anyone who will harm [tm_got_lord.GetHerHis] enemy. A contract to join the war is on your board."
 tm_got_licence_taken.t:0 "We Hold the Letters"
 tm_got_licence_taken.tt:0 "While this war lasts, your band sails under [tm_got_lord.GetName]'s licence and may seize an island seat."

 tm_got_seize_island_decision:0 "Seize an Island Seat"
 tm_got_seize_island_decision_desc:0 "We sail under letters, and there is an island in reach with a harbour, a wall and storehouses. A band needs a place to winter its ships."
 tm_got_seize_island_decision_confirm:0 "Take the island"
 tm_got_seize_island_decision_tooltip:0 "Go to war for an island county, under your licence"
 tm_got_seize_island_decision.tt:0 "Gain a pressed [claim|E] on the nearest such island (Gotland first) and declare a [claim|E] war on its holder. If you win, the island is your seat. Once the licence has lapsed, a great power may come to clear it."
 tm_got_seize_island_county_tt:0 "An island county within reach of your camp is held by someone who is not your licensor, in your licensor's realm, or your ally"

 tm_got.0100.t:0 "Open Ports"
 tm_got.0100.desc:0 "[tm_got_lord.GetName|U] has opened [tm_got_lord.GetHerHis] ports to anyone who will go to sea at their own risk and harm [tm_got_lord.GetHerHis] enemies. There is no pay in it. What we take, we keep, and any harbour of [tm_got_lord.GetHerHis] will victual us.\n\nKnights have come for the letters, and townsfolk, and farmers' sons, and men out of the gallows' shadow. The letters are plain. They hold as long as the war does, and not a day longer."
 tm_got.0100.a:0 "We take the letters."
 tm_got.0100.a.tt:0 "Join [tm_got_lord.GetName]'s war on [tm_got_lord.GetHerHis] side. While it lasts, we may seize an island seat."
 tm_got.0100.b:0 "It is not our war."

 tm_got.0110.t:0 "The Licence Lapses"
 tm_got.0110.desc:0 "There is peace, and our letters are worth nothing now. What was taking in war is theft in peace, and every harbour that fed us last month will close its boom to us."
 tm_got.0110.desc.enemy:0 "\n\n[tm_got_enemy.GetName|U] has not forgotten whose ships came to [tm_got_enemy.GetHerHis] coast."
 tm_got.0110.desc.none:0 ""
 tm_got.0110.a:0 "We knew the terms."
 tm_got.0110.a.tt:0 "We can no longer seize an island under licence. An island we already hold may draw a fleet in some years."

 tm_got.0120.t:0 "A Harbour of Our Own"
 tm_got.0120.desc.gotland:0 "Visby is ours: its wall, its harbour and its storehouses. On this island, in this telling, the hall has its seat again."
 tm_got.0120.desc:0 "[tm_got_island.GetName] is ours: a harbour, a wall, and a place to winter the ships."
 tm_got.0120.desc.outro:0 "\n\nThe letters cover it while the war lasts. When peace comes, someone stronger will want the island back."
 tm_got.0120.a:0 "Let them come."
 tm_got.0120.a.tt:0 "Five years or more after we took it, once the licence has lapsed, a great power may come to clear the island."

 tm_got.0130.t:0 "The Fleet Gathers"
 tm_got.0130.desc:0 "[tm_got_power.GetName|U] is gathering ships against [tm_got_island.GetName]. [tm_got_power.GetSheHe|U] calls our harbour a nest of sea-thieves and says [tm_got_power.GetSheHe] will clear it.\n\nWe can hold the island and fight. Or we can pay, keep our heads down, and hope [tm_got_power.GetSheHe] finds other work for the fleet."
 tm_got.0130.a:0 "We hold the island."
 tm_got.0130.a.tt:0 "[tm_got_power.GetName|U] presses a [claim|E] on [tm_got_island.GetName] and goes to war for it."
 tm_got.0130.b:0 "Pay [tm_got_power.GetHerHim] off."

 # The Island Changes Hands (Dollinger pp. 67, 79-80, 291)
 tm_got.0201.t:0 "The Island Changes Hands"
 tm_got.0201.desc.valdemar:0 "The Danish crown has reached across the water for the island, and [tm_got_lord.GetName] holds it for the Danes. Visby will pay what it is told. In the uplands the farmers talk of gathering their own army, as island farmers have before."
 tm_got.0201.desc.brothers:0 "[tm_got_lord.GetName|U] came in from the sea with a band of knights, townsfolk and farmers' sons, as the bands licensed by the Mecklenburg lords have done in these years. The island is their harbour now. Ships come in with other men's cargo and go out armed."
 tm_got.0201.desc.order:0 "A great fleet lies off Visby, and [tm_got_lord.GetName] holds the island in the name of a knightly order. The raiders who used the harbour are gone or hanged, and the order's men are counting the storehouses."
 tm_got.0201.desc.denmark:0 "The island goes back to the Danish crown, handed over by those who held it last. [tm_got_lord.GetName|U] is its lord now, and Visby is told to pay as it paid before."
 tm_got.0201.desc.generic:0 "[tm_got_lord.GetName|U] holds Gotland now. New men walk the quays at Visby, and the island's people wait to see what kind of lord [tm_got_lord.GetSheHe] will be."
 tm_got.0201.desc.voice_cross:0 "\n\n[tm_got_voice.GetName|U] has already spoken at Visby. This island once fitted out ships to carry the cross against the heathens of the east, [tm_got_voice.GetSheHe] says, and it will not keep heathens of its own."
 tm_got.0201.desc.voice:0 "\n\n[tm_got_voice.GetName|U] has already spoken at Visby: the people of the old gods on this island must come to the font."
 tm_got.0201.desc.novoice:0 "\n\nNo one of the new court has spoken against us yet."
 tm_got.0201.desc.outro:0 "\n\nWe who keep the faith on the island must choose how to meet the new lord."
 tm_got.0201.a:0 "We keep quiet in this land."
 tm_got.0201.a.tt:0 "The faith goes unremarked. If Gotland kept the faith, it takes Kept Quiet for 15 years. Ruling daughters on the island choose to Keep Quiet in This Land."
 tm_got.0201.b:0 "Raise the island's levy."
 tm_got.0201.b.tt:0 "The farmers gather against [tm_got_lord.GetName]. They will probably lose. Either way the new lord's hold on the island weakens, the faith's [fervor|E] rises, and [tm_got_lord.GetName] remembers who led them."
 tm_got.0201.c:0 "To the ships."
 tm_got.0201.c.tt:0 "The faith's people on the island who are not rulers leave for the nearest band or court of the faith."

 tm_got.0202.t.won:0 "The Levy Held"
 tm_got.0202.t.lost:0 "The Levy Broken"
 tm_got.0202.desc.won:0 "The farmers held the ford, and the new lord's men went back to Visby. It is not the end of it, but for now the uplands are ours to walk."
 tm_got.0202.desc.lost:0 "The farmers' army broke at the first charge, as such armies do against men in mail. We went home carrying the wounded. The faith held. The island did not."
 tm_got.0202.a:0 "We stood."

 tm_got.0210.t:0 "The Farmers Take Up Arms"
 tm_got.0210.desc.won:0 "The farmers of Gotland gathered against my men, and they held. My bailiffs keep to Visby for now."
 tm_got.0210.desc.lost:0 "The farmers of Gotland gathered against my men and were broken in a morning. They will pay for it in tax and in quiet."
 tm_got.0210.desc.voice_cross:0 "\n\n[tm_got_voice.GetName|U] says the heathens of the island stirred them up, and reminds me that Visby once sent ships against the heathens of the east."
 tm_got.0210.desc.voice:0 "\n\n[tm_got_voice.GetName|U] says the heathens of the island stirred them up."
 tm_got.0210.desc.novoice:0 ""
 tm_got.0210.a:0 "They will remember it."

 # Swear the Peace of the Island (Dollinger pp. 7, 24-25)
 tm_got.0300.t:0 "The Peace of the Island"
 tm_got.0300.desc.henry:0 "In the year 1161 a duke of Saxony made the farmer-traders of Gotland and the German merchants who sailed there swear to keep the peace. In Visby the two peoples came to share one town, one law, and a council chosen from both. Such an oath can be sworn again."
 tm_got.0300.desc.early:0 "Farmers and traders share the island's beaches, and not always in peace. The trading places on the shore belong to several villages at once, and no one rules them alone. An oath sworn before witnesses would bind them all."
 tm_got.0300.desc.own:0 "\n\nOur faith's people are one of the island's peoples. The merchants who winter here keep other gods, and their quarrels with ours are growing."
 tm_got.0300.desc.band:0 "\n\nA Bædling band camps within a few days' sail, and the island's people of other faiths sleep badly."
 tm_got.0300.desc.people:0 "\n\nSome of the island's people keep the Bædling faith, and their neighbours of other faiths watch them."
 tm_got.0300.a:0 "Let them swear the peace."
 tm_got.0300.a.tt:0 "Gotland gains The Peace of the Island for 25 years. The faith's people on the island and the bands camped nearby think better of me, and I of them."
 tm_got.0300.b:0 "Each to their own beach."

 # Modifiers and opinions
 tm_got_quiet_island_modifier:0 "Kept Quiet"
 tm_got_quiet_island_modifier_desc:0 "The faith's people here go about their work and keep their gods to themselves. The new lord has no quarrel to find."
 tm_got_levy_held_modifier:0 "The Farmers' Army Stood"
 tm_got_levy_held_modifier_desc:0 "The farmers took up arms against their new lord and held. The bailiffs keep to the town."
 tm_got_levy_broken_modifier:0 "The Farmers' Army Broken"
 tm_got_levy_broken_modifier_desc:0 "The farmers took up arms against their new lord and were beaten. The fields are short of hands."
 tm_got_island_peace_modifier:0 "The Peace of the Island"
 tm_got_island_peace_modifier_desc:0 "The island's peoples have sworn to keep the peace with one another. They share the town and the harbour, and a council chosen from both."
 tm_got_raided_under_licence_opinion:0 "Raided Under Licence"
 tm_got_raised_levy_opinion:0 "Raised the Island Against Me"
 tm_got_sworn_peace_opinion:0 "Sworn the Peace of the Island"
 tm_got_levy_fervor:0 "The island's levy"
