l_english:
 tm_dl3_work_chamber_decision:0 "Work the Chamber"
 tm_dl3_work_chamber_decision_desc:0 "Use my post in the chamber to move the court between the chamber and the Patriarch's party, or spend what the chamber has won on the Houses."
 tm_dl3_work_chamber_decision_tooltip:0 "Choose how to use my place in the chamber this year."
 tm_dl3_work_chamber_decision_confirm:0 "Go to the chamber"
 tm_dl3_work_chamber_decision_effect_tt:0 "I choose how to use my post: a chrysobull for a House, the empress's audience, the chamber's own staff, or an estate."
 tm_dl3_chamber_tt:0 "The chamber gains ground at this throne."
 tm_dl3_patriarch_tt:0 "The Patriarch's party gains ground at this throne."
 tm_dl3_spend_tt:0 "The chamber spends some of its ground at this throne."
 tm_dl3_registered_tt:0 "The court's clerks enter me in their register as a eunuch."
 tm_dl3_chrysobull_tt:0 "A ruler of the Sisters under this throne who keeps a House receives a chrysobull. For ten years the laws against heretics pass her by."
 tm_dl3_estate_tt:0 "The throne grants me a county from its own hands: one with a Sisters' House if it has one, else one whose people keep our faith, else its poorest. If the Patriarch's party ever has everything at this throne, the grant may be annulled."
 tm_dl3_chamber_modifier:0 "Post in the Chamber"
 tm_dl3_chamber_modifier_desc:0 "She holds a post in the empress's chamber. The throne gave it, and the throne can take it back."
 tm_dl3.0001.t:0 "The Chamber Writes"
 tm_dl3.0001.desc:0 "A letter has come under the seal of [tm_dl3_throne.GetTitledFirstName]'s chamber. The empress's women's quarters keep a staff of their own, mostly eunuchs, and the empresses who ruled made that staff their ministers. The chamber offers me a post.\n\nIts clerks keep three columns: men, women and eunuchs. They would write me in the third. My sisters have a saying for that: the court calls its eunuchs angels, and buys them as boys. The Patriarch's people would rather a woman of the Phrygian heresy stayed in Phrygia. The Houses say what they always say. A post is the throne's to give and the throne's to take back."
 tm_dl3.0001.a:0 "Take the post. Let the clerks write what they write."
 tm_dl3.0001.b:0 "Stay with the House. What we hold, we hold together."
 tm_dl3.0001.c:0 "Take the post, and ask a notary of the empress's to write me among the women."
 tm_dl3.0001.c.written:0 "The notary wrote \"woman\""
 tm_dl3.0001.c.refused:0 "The notary would not, and the chamber heard I had asked"
 tm_dl3.0002.t:0 "A Letter from the Synod"
 tm_dl3.0002.desc:0 "The Patriarch's synod has written to [tm_dl3_throne.GetTitledFirstName], and my name is in the letter. \"The women of the chamber keep the Phrygian error,\" it says, \"Cybele in Christian clothes.\" It asks the throne to put me out of the palace. Patriarchs have sent empresses to convents for less."
 tm_dl3.0002.a:0 "The empress's chamber will answer for me."
 tm_dl3.0002.a.kept:0 "The letter was set aside"
 tm_dl3.0002.a.lost:0 "The throne took back my post"
 tm_dl3.0002.b:0 "Give up the post before it is taken."
 tm_dl3.0002.c:0 "Pay the synod's notary to misplace a page."
 tm_dl3.0003.t:0 "The Chrysobull Annulled"
 tm_dl3.0003.desc:0 "The Patriarch's party has the whole of [tm_dl3_throne.GetTitledFirstName]'s ear, and the throne is going through the grants its chamber won. An emperor once annulled every chrysobull his great-uncle's chamberlain had issued, and made an example of a eunuch who had swallowed a village. The logothete has [tm_dl3_estate.GetName] on his list."
 tm_dl3.0003.a:0 "Give it back. The House will keep my name if the throne does not."
 tm_dl3.0003.b:0 "Pay the logothete to find the chrysobull in order."
 tm_dl3.0003.c:0 "Go before the throne and ask to keep it."
 tm_dl3.0003.c.kept:0 "The throne let the grant stand"
 tm_dl3.0003.c.lost:0 "The throne took the county back"
 tm_dl3.0010.t:0 "The Chamber at Work"
 tm_dl3.0010.desc:0 "My post opens doors in the palace. Behind them the chamber and the Patriarch's party pull at the throne from two sides. What I do this year moves the rope a little.\n\n"
 tm_dl3.0010.desc_chamber:0 "Just now the chamber has the throne's ear. The laws against heretics are not being read aloud, and the synod is counting our gains."
 tm_dl3.0010.desc_patriarch:0 "Just now the Patriarch's party has the throne's ear. Its letters go up the stairs faster than ours."
 tm_dl3.0010.desc_even:0 "Just now neither side has the throne's ear."
 tm_dl3.0010.a:0 "Ask for a chrysobull for one of the Houses."
 tm_dl3.0010.b:0 "Sit in the empress's chamber and keep her company."
 tm_dl3.0010.c:0 "Bring the chamber's own staff over to us."
 tm_dl3.0010.c.quiet:0 "No one marked the gifts"
 tm_dl3.0010.c.noticed:0 "The throne heard of it"
 tm_dl3.0010.d:0 "Ask the throne for an estate of my own."
 tm_dl3.0010.e:0 "Not this year."
