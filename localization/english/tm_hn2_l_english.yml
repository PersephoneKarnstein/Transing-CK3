l_english:
 # Ha-Nehpakhot, stage 2 (events/tm_hn2_events.txt). Dated variants: Rashi from 1105, Maimonides from 1180,
 # Sefer ha-Hinukh from 1300, Even Bohan from 1323 (tm_hn2_triggers.txt).
 # By moonlight. Sarah as aylonit and Rashi's gloss are the faith's voice (bYevamot 64b; Rashi ad loc.).
 tm_hn2.0001.t:0 "By Moonlight"
 tm_hn2.0001.desc:0 "The nights are long, and the women bring their spindles out where the moon gives light. They comb the flax and spin, and they tell stories to one another, as the Touchstone says women do. I sit among them."
 tm_hn2.0001.desc_early:0 "The nights are long, and the women bring their spindles out where the moon gives light. They comb the flax and spin, and they tell stories to one another. I sit among them."
 tm_hn2.0001.a_early:0 "Tell them of Sarah our mother. The sages say she was an aylonit, with no place for a child. Yet she bore Isaac."
 tm_hn2.0001.a:0 "Tell them of Sarah our mother. The sages say she was an aylonit, with no place for a child, and Rashi says a woman's body was made for her."
 tm_hn2.0001.b:0 "Teach [tm_hn2_spinner.GetFirstName] to comb the flax and spin."
 tm_hn2.0001.c:0 "Only listen to their stories."
 # The spindle talks (Mishnah Sotah 6:1). The worthies' lines: the rejoinder to Rashi on Sarah, and Sefer ha-Hinukh 542.
 tm_hn2.0002.t:0 "Talk at the Spindle"
 tm_hn2.0002.desc:0 "What is said at the spindle does not stay there. The Mishnah itself counts the talk of the women who spin by moonlight. The worthies of the street have heard what I said of Sarah, and they have sent for me."
 tm_hn2.0002.desc_rashi:0 " One answers me from the same page of Rashi: a womb was made for Sarah, not a sex."
 tm_hn2.0002.desc_talmud:0 " One answers me from the same page of the Talmud: Sarah was a woman before she bore and a woman after."
 tm_hn2.0002.desc_hinukh:0 " Another quotes the law: even one hair plucked from the beard is a woman's adornment."
 tm_hn2.0002.desc_torah:0 " Another quotes the Torah: a man shall not put on a woman's garment."
 tm_hn2.0002.a_early:0 "Answer from the Talmud: Leah prayed, and the child in her womb was turned into Dinah."
 tm_hn2.0002.a:0 "Answer Rashi with Rashi: the Torah forbade only the dress that leads to abomination."
 tm_hn2.0002.a.win:0 "The worthies have no answer. They let the matter drop."
 tm_hn2.0002.a.lose:0 "The worthies hold to the plain sense. I go home with their displeasure."
 tm_hn2.0002.b:0 "\"As Rashi says of Sarah: a woman's body was made for her.\""
 tm_hn2.0002.b_early:0 "\"The sages say Sarah had no place for a child, and she bore Isaac.\""
 tm_hn2.0002.c:0 "It was only talk at the spindle."
 # The adornment (Even Bohan p. 17; MT Avodah Zarah 12:10).
 tm_hn2.0010.t:0 "Ornaments of Gold"
 tm_hn2.0010.desc:0 "[tm_hn2_bride.GetFirstName] and I are to be married."
 tm_hn2.0010.desc_touchstone:0 " In the Touchstone, Kalonymus wished for a husband who would adorn him with ornaments of gold. The law counts gold bracelets among a woman's adornments, where only women wear them."
 tm_hn2.0010.desc_law:0 " The law counts gold bracelets among a woman's adornments, where only women wear them."
 tm_hn2.0010.desc_rebecca:0 " When Rebecca was found for Isaac, she was given a ring and two bracelets of gold."
 tm_hn2.0010.desc_end:0 " A goldsmith could make her a necklace."
 tm_hn2.0010.a:0 "Have the goldsmith make her a necklace of gold."
 tm_hn2.0010.b:0 "Not now."
 tm_hn2.0011.t:0 "The Adornment"
 tm_hn2.0011.desc:0 "[tm_hn2_giver.GetFirstName] has given me a necklace of gold. The women of the lamp call such a gift the adornment."
 tm_hn2.0011.desc_touchstone:0 " They say it is what Kalonymus asked for and never had."
 tm_hn2.0011.a:0 "Wear it when I light the Sabbath lamp."
 tm_hn2.0011.b:0 "Wear it in the street, where only women wear such things."
 tm_hn2_commission_adornment_decision:0 "Commission the Adornment"
 tm_hn2_commission_adornment_decision_desc:0 "No one has given me the adornment, and I need not wait for someone to. The goldsmith will make it for me in my own name, as for any woman of the street."
 tm_hn2_commission_adornment_decision_tooltip:0 "Have the goldsmith make you the adornment."
 tm_hn2_commission_adornment_decision_confirm:0 "Send for the goldsmith"
 tm_hn2_adornment_name:0 "The Adornment"
 tm_hn2_adornment_desc:0 "A necklace of gold, given at a wedding. The women of the lamp call it the adornment."
 tm_hn2_adornment_modifier:0 "The Adornment"
 tm_hn2_adornment_modifier_desc:0 "A necklace of gold, given at a wedding."
 # The bailiff (Assis 2001, pp. 34-36, 44; Shatzmiller 2023, pp. 321-324).
 tm_hn2.0020.t:0 "Before the [ROOT.Char.Custom('tm_hn4_bailiff_title')]"
 tm_hn2.0020.desc:0 "[tm_hn2_rival.GetFirstName] has carried a complaint about me to [ROOT.Char.Custom('tm_hn4_bailiff')] of [tm_hn2_lord.GetTitledFirstName]: that I go about in a woman's dress and under a woman's name. The lord's court hears such charges, and it fines more often than it punishes. The fines go to the lord."
 tm_hn2.0020.desc_served:0 " But I have served [tm_hn2_lord.GetFirstName], and lords remember those who serve them."
 tm_hn2.0020.desc_fine:0 " [ROOT.Char.Custom('tm_hn4_bailiff_cap')] will name a fine."
 tm_hn2.0020.a:0 "Pay the fine."
 tm_hn2.0020.b:0 "Ask [tm_hn2_lord.GetFirstName], whom I have served, to stand for me."
 tm_hn2.0020.c:0 "Answer the charge before [ROOT.Char.Custom('tm_hn4_bailiff')] myself."
 tm_hn2.0020.c.win:0 "[ROOT.Char.Custom('tm_hn4_bailiff_cap')] finds no law that I have broken, and voids the charge."
 tm_hn2.0020.c.lose:0 "[ROOT.Char.Custom('tm_hn4_bailiff_cap')] is not persuaded. The fine stands."
 # Carnival before Purim (Arles 1433; Hildenfinger, REJ 41: 73, 93-94).
 tm_hn2.0030.t:0 "Carnival Before Purim"
 tm_hn2.0030.desc:0 "It is Carnival, a few weeks before Purim. The town's young men have chosen an abbot of youth, and he and his fellows have come into the Jewish street to take pledges for the pelote. It is a due the youth abbeys take from newly married couples. It was never asked of the Jews. They have taken a cloak and a cup from our houses."
 tm_hn2.0030.desc_served:0 " [tm_hn2_lord.GetFirstName] has had good service from us, and the seneschal sits in [tm_hn2_lord.GetHerHis] name."
 tm_hn2.0030.desc_plain:0 " The seneschal sits in [tm_hn2_lord.GetFirstName]'s name."
 tm_hn2.0030.a:0 "Pay the pelote, and have the pledges back."
 tm_hn2.0030.b:0 "Appeal to the seneschal: no such due was ever asked of us."
 tm_hn2.0030.b.win:0 "The seneschal's lieutenant calls it a novelty never seen, and orders the pledges returned."
 tm_hn2.0030.b.lose:0 "The seneschal will not cross the town's young men this year. They keep the pledges."
 tm_hn2.0030.c:0 "Refuse. Let them keep the pledges."
 # The lord's licence (Shatzmiller 2023, pp. 86-89; Hildenfinger, REJ 41: 67 n. 5, 85-86).
 tm_hn2.0040.t:0 "The Lord's Licence"
 tm_hn2.0040.desc:0 "The judges of the Jewish street have shunned [tm_hn2_shunned.GetFirstName], a daughter of the Turning, and they ask me to confirm the ban."
 tm_hn2.0040.desc_early:0 " The ban is pronounced in my land, so it is mine to license or refuse."
 tm_hn2.0040.desc_1305:0 " A rabbi of Montpellier has written it plainly: no community may ban one of its own without its lord's consent."
 tm_hn2.0040.desc_1405:0 " No community may ban one of its own without its lord's consent. In Provence the lords grant it for a year at a time, and keep absolution for themselves."
 tm_hn2.0040.a:0 "Absolution is mine to give. Lift the ban."
 tm_hn2.0040.b:0 "License it for one year, and no more."
 tm_hn2.0040.c:0 "The judges of the street have ruled."
 tm_hn2_sarah_opinion:0 "Told Us of Sarah"
 tm_hn2_adornment_opinion:0 "Gave Me the Adornment"
 tm_hn2_absolved_opinion:0 "Lifted the Ban on Me"
 tm_hn2_overruled_opinion:0 "Overruled the Street's Judges"
 # A seat below (Arles 1409, 1452; Hildenfinger, REJ 48: 75-76).
 tm_hn2.0050.t:0 "A Seat Below"
 tm_hn2.0050.desc_arles:0 "A widow and her daughter are selling the seats they inherited: two in the men's school above, and one below, in the school of the women. In this street the seats belong to households, and the women of the house sit in them. The one below could be mine, in my own name."
 tm_hn2.0050.desc:0 "A widow and her daughter are selling the seats they inherited in the synagogue, among them one in the women's places. In this street the seats belong to households, and the women of the house sit in them. That one could be mine, in my own name."
 tm_hn2.0050.a:0 "Buy the seat below, in my own name."
 tm_hn2.0050.b:0 "Let someone else have it."
 tm_hn2_women_seat_modifier:0 "A Seat Below"
 tm_hn2_women_seat_modifier_desc:0 "This character owns a seat in the women's synagogue, in her own name."
 # Catalan names of the street (Guerson and Lightfoot 2019; tm_hipukh.0002).
