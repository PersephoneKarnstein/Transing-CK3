l_english:
 # The Patent and the Robe (docs/wave4/bands.md)
 tm_band.0001.t:0 "A Band on My Land"
 tm_band.0001.desc_camped:0 "[tm_band_band.GetName] has kept her band's camp in one place for five years. Her people buy in our markets and sit at our fires. They have not left, and they do not look like leaving.\n\n"
 tm_band.0001.desc_served:0 "[tm_band_band.GetName]'s band fought on my side, and the war is won. Her people did their share of it. They will want something for it, and I would rather they wanted it from me.\n\n"
 tm_band.0001.desc_patient:0 "Some years ago I asked [tm_band_band.GetName] to move her camp off my land, and she went without a quarrel. Her band is near again, and it is no smaller.\n\n"
 tm_band.0001.desc_robe:0 "In these lands a lord who wants such a band for his own sends its leader a patent for a county and a robe of honour. A band that takes them serves him."
 tm_band.0001.desc_township:0 "The magistrates have an old way with a people who keep their own head and their own rites. They are entered on the register in a rallied township, ordinary subjects under the county's law, with the same corvée as everyone else. A camp would become a place on the register."
 tm_band.0001.desc_strumica:0 "Bands like hers have been settled here before, when they cost more to fight than to keep. A treaty once gave a captain the land he already held, and for a time he held it for his lord."
 tm_band.0001.desc_merope:0 "In these hills a lord gives a captain the forts, villages and people of a district, and calls her his ally. It has not always ended well for either of them."
 tm_band.0001.desc_charter:0 "A lord can give such a band a county by charter. They would hold it of me, and serve me for it."
 tm_band.0001.a:0 "Offer her [tm_band_county.GetName]."
 tm_band.0001.a_robe:0 "Send her the patent for [tm_band_county.GetName], and a robe of honour."
 tm_band.0001.a_township:0 "Offer to register her people in [tm_band_county.GetName]."
 tm_band.0001.a.tt:0 "[tm_band_band.GetName] may take [tm_band_county.GetName] as your vassal, as with Negotiate Settlement, or keep to the road."
 tm_band.0001.b:0 "Ask her to move her camp elsewhere."
 tm_band.0001.b.tt:0 "[tm_band_band.GetName] may go, and remember that you asked politely, or she may stay."
 tm_band.0001.c:0 "Let them be."

 tm_band.0010.t:0 "An Offer of Land"
 tm_band.0010.t_robe:0 "The Patent and the Robe"
 tm_band.0010.t_township:0 "The Rallied Township"
 tm_band.0010.desc_robe:0 "A rider from [tm_band_lord.GetName] came to the camp with a sealed patent for [tm_band_county.GetName] and a robe of honour folded over his saddle. The patent names me. If I put on the robe, my band is his."
 tm_band.0010.desc_township:0 "[tm_band_lord.GetName]'s clerk came with the register. He would enter my people at [tm_band_county.GetName] as ordinary subjects, with land, a magistrate and the same corvée as everyone. From an administration of our own to the magistrate's. In the camp we had a head of our own. In the township we would pay what everyone pays."
 tm_band.0010.desc_strumica:0 "[tm_band_lord.GetName] sends terms. He has fought bands like mine and found it costs more than keeping them. He will give me [tm_band_county.GetName], to hold of him, if my band stops being a band."
 tm_band.0010.desc_merope:0 "[tm_band_lord.GetName] would give me [tm_band_county.GetName]: its forts, its villages and its people, to command for him. He calls it an alliance. Captains who took such commands in these hills did not all keep them."
 tm_band.0010.desc_charter:0 "[tm_band_lord.GetName] offers me [tm_band_county.GetName] by charter, to hold of him and serve him for it."
 tm_band.0010.desc_end:0 "\n\nThe companions are talking of roofs and fields. Some of them are talking of the road."
 tm_band.0010.a:0 "We take it. The band settles."
 tm_band.0010.a_township:0 "Enter us on the register."
 tm_band.0010.a.tt:0 "You become [tm_band_lord.GetName]'s vassal in [tm_band_county.GetName], as with Negotiate Settlement. Your camp is broken up. A band of the six faiths that takes land has ten years' grace to hold it."
 tm_band.0010.b:0 "Not yet. The road is still ours."
 tm_band.0010.b.toast:0 "The Band Keeps the Road"

 tm_band.0020.t:0 "Asked to Move On"
 tm_band.0020.desc:0 "[tm_band_lord.GetName] asks that my band move its camp off his land. He does not threaten. He asks as a lord asks.\n\n"
 tm_band.0020.desc_robe:0 "The old soldiers tell of a band that took a city and gave it back when its lord asked. A year later the lord sent its leader a patent and a robe. Patience is not weakness, they say."
 tm_band.0020.desc_township:0 "A people that keeps its own head is a guest, and guests move when asked. Those that move with good grace are remembered at the magistrate's."
 tm_band.0020.desc_other:0 "If we go now, he will remember that we went. If we stay, he will remember that too."
 tm_band.0020.a:0 "We go. Patience costs us nothing."
 tm_band.0020.a.toast:0 "The Band Moved On"
 tm_band.0020.b:0 "We stay."
 tm_band.0020.b.tt:0 "[tm_band_lord.GetName] may try to evict your band by force."
 tm_band.0020.b.toast:0 "The Band Will Not Move"

 # The Companions Choose (docs/wave4/bands.md)
 tm_band.0100.t:0 "The Companions Choose"
 tm_band.0100.desc_incapable:0 "I can no longer ride out as I did, and the band knows it.\n\n"
 tm_band.0100.desc_debt:0 "The camp's purse is empty, and we owe more than we hold.\n\n"
 tm_band.0100.desc_weak:0 "The band has not done well under me, and everyone in the camp knows it.\n\n"
 tm_band.0100.desc:0 "This morning my officers came to my tent together, with [tm_band_companion.GetName] among them saying nothing. One spoke for all of them. The band needs someone who can keep it fed and whole, and they would follow [tm_band_companion.GetName]. They do not ask me to leave. They ask me to stay in her company, as one of them."
 tm_band.0100.a:0 "Then she leads. I ride with her."
 tm_band.0100.a.tt:0 "[tm_band_companion.GetName] leads the band. You stay in her camp, with honour."
 tm_band.0100.a.player_tt:0 "You will play on as [tm_band_companion.GetName]."
 tm_band.0100.a.toast:0 "The Companions Chose"
 tm_band.0100.b:0 "Not yet."
 tm_band_stepped_down_modifier:0 "Stepped Down with Honour"
 tm_band_stepped_down_modifier_desc:0 "She handed her band to a stronger companion and stayed in its company."

 # Opinions
 tm_band_patent_given_opinion:0 "Gave Us a Hall"
 tm_band_left_when_asked_opinion:0 "Moved On When Asked"
 tm_band_asked_to_leave_opinion:0 "Asked Us to Move On"
 tm_band_refused_to_leave_opinion:0 "Would Not Move On"
 tm_band_stepped_down_opinion:0 "Handed Over with Honour"
 tm_band_kept_the_band_opinion:0 "Would Not Make Way"
