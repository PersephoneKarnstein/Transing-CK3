l_english:
 # Yutai Dao, wave 13: the levers, the women's chains and the regency rules (tm_yt4; docs/wave13/yutai.md).
 # Cui Yin's proposal (So 2000, pp. 160-161).
 tm_yt4.0001.t:0 "The Minister's Memorial"
 tm_yt4.0001.desc:0 "The chief minister Cui Yin asked the throne for the Shence armies, and the generals told him they had never heard of a scholar commanding an army. Now his memorial goes further. He would be rid of the inner offices' men, every one, and have palace women keep the inner offices' seals in their place.\n\nHis people have come to me. A woman of the Way who knows the palace's books, they say, could keep a seal for the throne when the palace men are gone.\n\n"
 tm_yt4.0001.desc_office:0 "My own seal is in the inner offices, and my friends there know of the memorial too. Their answer is to set women who can read beside the emperor, to listen. They ask me to be one of them."
 tm_yt4.0001.desc_outside:0 "I hold no seal. The inner offices have not asked me for anything, and they will not forgive whoever takes their place."
 tm_yt4.0001.a:0 "Keep a seal for the palace women. The offices will need someone."
 tm_yt4.0001.b:0 "I will not keep a seal that is paid for with their lives."
 tm_yt4.0001.c:0 "Sit by the throne and listen, as the inner offices ask."
 tm_yt4.0001.c.quiet:0 "No one marked where I sat"
 tm_yt4.0001.c.noticed:0 "The throne noticed who was listening"
 tm_yt4.0001.d:0 "This is the court's quarrel, not the society's."
 # The Boy from Min (Rideout 1949, p. 55 and nn. 6-7).
 tm_yt4.0002.t:0 "The Boy from Min"
 tm_yt4.0002.desc:0 "The tribute road north passes [tm_yt4_house_county.GetNameNoTier]. Every circuit sends the palace its year's quota of boys, and Min sends the most. The clerks call them the ungraded ones.\n\nOne of this year's boys was left at the House's gate in the night, too sick from the road to go on, and the commissioner's men went on without him. He is about ten. He speaks the southern tongue and a little of ours. He knows his mother's name and his village's, and a song of Min about a father and a son who part and do not expect to stand before each other again.\n\nThis morning he asked whether the House has a kitchen garden, and whether he could work in it."
 tm_yt4.0002.a:0 "He stays. The House will raise him as a son of the House, as he is."
 tm_yt4.0002.b:0 "Buy back the rest of this year's boys from the road, and keep this one with us."
 tm_yt4.0002.c:0 "Send him home to Min, with money for the road and a letter to his mother."
 tm_yt4_boy_as_he_is_tt:0 "The House takes him as he is. What he becomes is his own to say."
 tm_yt4_boys_ransomed_tt:0 "The other boys go home with the tea merchants, at the House's cost. Officials in the south have bought slaves free at their own cost before."
 tm_yt4_boy_home_tt:0 "He goes south with a merchant the House trusts."
 # The Commissioner of Merit's levy (Rideout 1949, p. 56; 1953, pp. 46-47).
 tm_yt4.0003.t:0 "The Commissioner of Merit"
 tm_yt4.0003.desc:0 "A Commissioner of Merit and Works has written from the palace. The commissioners are the inner offices' men set over both clergies, and this one has found that the House at [tm_yt4_house_county.GetNameNoTier] needs repairs: a new hall roof, by his own builders, at his own price. Such missions, the clerks say, never come home with less than a thousand strings.\n\nThe roof was mended two springs ago. The palace has founded abbeys of its own before now, and a patron in the inner offices could make the commissioner forget us."
 tm_yt4.0003.a:0 "Pay the levy. A roof is cheaper than a quarrel."
 tm_yt4.0003.b:0 "Put the House's goods in the burial society's store, and let him count an empty hall."
 tm_yt4.0003.b.kept:0 "He counted an empty hall"
 tm_yt4.0003.b.found:0 "His clerk knew where societies keep their stores"
 tm_yt4.0003.c:0 "Ask a patron in the inner offices to call him off."
 # Seal the Ledgers (Grass 2024).
 tm_yt4.0004.t:0 "Seal the Ledgers"
 tm_yt4.0004.desc:0 "The Directorate of Imperial Horses keeps its own books. Its herdsmen and its horsemen answer to its directors and to the emperor, not to the Ministry of War. The ministers may count the empire, the directors say, but they do not count the emperor's stables. The revenue men say that in those books the few become many and the dead are made alive.\n\n"
 tm_yt4.0004.desc_house:0 "A director has come to me with an offer. The Directorate holds far more pasture than its horses need. A Sisters' House on its land would be on its books, and the ministries do not read those books."
 tm_yt4.0004.desc_nohouse:0 "A director has come to me with an offer. My seal could draw on the stables' grain allowance, which no one outside the Directorate has counted in years."
 tm_yt4.0004.a:0 "Put the House's land on the Directorate's books."
 tm_yt4.0004.a.quiet:0 "The ministries never asked"
 tm_yt4.0004.a.audited:0 "A vice-minister accused the Directorate of seizing land. The throne pardoned it and granted the land, but a censor will inspect it every year"
 tm_yt4.0004.b:0 "Draw on the stables' grain."
 tm_yt4.0004.b.quiet:0 "No one counted"
 tm_yt4.0004.b.found:0 "A revenue official counted"
 tm_yt4.0004.c:0 "Open the ledgers to the ministries. The society keeps its own books, and they are open."
 tm_yt4.0004.d:0 "Not this year."
 tm_yt4_ledgers_named_tt:0 "My Sisters' Houses are written on the Directorate's books, out of the magistrate's reach, as a name-panel would keep them."
 # Lady Xue at Hezhong (Cahill 2006, pp. 189-193).
 tm_yt4.0010.t:0 "A Letter from Hezhong"
 tm_yt4.0010.desc:0 "A letter has come from Hezhong, from the household of the Lesser Governor, Feng Hui. His wife, Lady Xue, has kept a room of her own for some years now, on the excuse of illness, and chants the Yellow Court scripture there every day. She has heard that a woman of the Way could read it with her, and asks me to come for the winter.\n\nHer husband has added a line at the bottom. He mocks his wife's scripture, and the women who encourage it."
 tm_yt4.0010.a:0 "Go to Hezhong. If she asks why I came to the Way, I will tell her: to be born as myself."
 tm_yt4.0010.b:0 "Send her a copy of the scripture in my own hand, and stay with my sisters this winter."
 tm_yt4.0010.c:0 "Her husband's line decides it. I will not come between them."
 tm_yt4.0011.t:0 "Her Burial Garments"
 tm_yt4.0011.desc:0 "News from Hezhong. In the autumn of the war, Lady Xue's household says, an escort came to meet her boat on the river, and she sent it away: \"Not yet! I will go next spring, from my own house. Don't rush me!\"\n\nIn the spring she washed her own hair and face, as the women of a family do for their dead, and lay down, and in the morning she was gone. When her coffin was opened it held only her burial garments and her quilt.\n\nThe governor has written to the throne. The court at Chengdu has ordered the history officials to record her, and money to repair the Daoist altars where she lived."
 tm_yt4.0011.a:0 "Send gold for her altars, and a sister to keep them."
 tm_yt4.0011.b:0 "Write down our winter of reading for the history officials."
 tm_yt4.0011.c:0 "Keep what she said for myself. Not yet. Don't rush me."
 # Wang Fengxian (Cahill 2006, pp. 180-185; Jia 2018, pp. 201-203).
 tm_yt4.0020.t:0 "The Preacher of Dangtu"
 tm_yt4.0020.desc:0 "A woman called Wang Fengxian is preaching on the roads between the Huai and the Zhe: loyalty, filial piety, and the cultivation of the self. She was a weaver's daughter of Dangtu. Her hair was cut short when she was a girl and never grew back. The crowds call her Guanyin, and men who came to her with drawn swords have stayed as her disciples.\n\nWhen an official asked what she was, she said the common folk flatter her with a bodhisattva's name. Her disciples say there is no obstacle between names and the Way: if people think her an ox, she will act like an ox, and if a horse, like a horse.\n\nShe has seen me in the crowd, and asks what a sister of the Way makes of that."
 tm_yt4.0020.a:0 "\"For you a name is no obstacle. For me the register decides whether I am a woman, so I keep mine right.\""
 tm_yt4.0020.b:0 "Ask how she kept out of the consorts' apartments when the governor meant to send her."
 tm_yt4.0020.b.tt:0 "She told him her hair was cut short, and when that did not serve, she hid in a Buddhist temple for years."
 tm_yt4.0020.c:0 "Listen to the end, and go home."
 tm_yt4.0021.t:0 "Two Accounts"
 tm_yt4.0021.desc:0 "Two accounts of Wang Fengxian have reached the House. Her disciples say she was transformed on Mount Qianqing, without ever falling ill, at forty-eight. The court's men say that a year after that, in Yangzhou, the rebel generals took her as their oracle, that she told them a great man must die and he did, and that rewards and punishments there were hers to decide. They call her a sorceress.\n\nThe House keeps a book of the women it has met on the roads. Wang Fengxian was never one of ours. But what the House writes of her will be read."
 tm_yt4.0021.a:0 "Write what her disciples say: she went in peace, on her mountain."
 tm_yt4.0021.b:0 "Write what the court's men say, and who says it."
 tm_yt4.0021.c:0 "Write both, and say that we do not know."
 # Half a ladle at Mo-shan (Levering 1982, pp. 25, 27-29).
 tm_yt4.0025.t:0 "Half a Ladle at Mo-shan"
 tm_yt4.0025.desc:0 "I have come to Mo-shan, where an abbess, Liaoran, keeps a Chan hall of her own. Monks come to her as students, and bow.\n\nToday a wandering monk came up the road meaning to overturn her platform. She asked where he had set out from. \"From the entrance to the road,\" he said. \"Why didn't you cover it?\" she asked, and he had no answer. He asked what the one who dwells at Mo-shan is like. \"Neither male nor female in form,\" she said. He shouted, \"Then why doesn't she transform herself?\" She said, \"She is not a spirit, nor a ghost. What would you have her become?\"\n\nHe bowed to her. Then he saw me among her guests, and he has heard what the Way teaches. \"And you?\" he says. \"Change your form for me, then, if you are what you say.\""
 tm_yt4.0025.a:0 "\"If I changed for you, you would call me a fox.\""
 tm_yt4.0025.b:0 "\"Your teacher's mind has no form. I have one, and I chose it. I have nothing to prove to you.\""
 tm_yt4.0025.c:0 "Say nothing. Bow to the abbess, not to him."
 # The three routes into the abbeys (McMahon 2013, 2016; Jia 2018).
 tm_yt4.0030.t:0 "Not Your Anteroom"
 tm_yt4.0030.desc:0 "A letter has come under the seal of [tm_yt4_lord.GetTitledFirstName]. A young woman of [tm_yt4_house_county.GetNameNoTier], [tm_yt4_woman.GetFirstName], is to be registered as a nüguan at the House's guan, and to live there until he sends for her.\n\nIt has been done before. An emperor once had his son's wife registered as a Daoist so that she could leave her husband, and took her into the palace four years later.\n\n[tm_yt4_woman.GetFirstName] came with the letter. She has not said what she wants. Nobody has asked her."
 tm_yt4.0030.a:0 "Register her, and tell her the guan is no one's anteroom. If she stays, she stays for herself."
 tm_yt4.0030.b:0 "Register her as he asks, and send her on to him."
 tm_yt4.0030.c:0 "Refuse to register her for him. The guan does not keep women for a lord."
 tm_yt4_woman_home_tt:0 "She goes home, and the House's door stays open to her."
 tm_yt4.0031.t:0 "A Consort Set Aside"
 tm_yt4.0031.desc:0 "A consort of the palace, [tm_yt4_woman.GetFirstName], has been sent out of the inner quarters. When a lord no longer needs a consort who has borne him no son, the palace gives her to a cloister. She has come to the House at [tm_yt4_house_county.GetNameNoTier] with a box of robes and a stipend that will not last.\n\nHalf the grey heads who recite scripture in the convents once danced in the palace. She knows it, and she has chosen the House over the palace's own cloister."
 tm_yt4.0031.desc_ming:0 "The throne has set aside one of its consorts, [tm_yt4_woman.GetFirstName], and given her a Daoist title in place of the one it took: Master of Immortality, or something like it. A deposed empress was made a master of immortality not long ago, and the palace has found the form convenient.\n\nShe has chosen the House at [tm_yt4_house_county.GetNameNoTier] over the palace's own cloister, and she has come with her title and nothing else."
 tm_yt4.0031.a:0 "Give her a room and the House's work, as any sister has."
 tm_yt4.0031.b:0 "Give her the best room, and let her keep her own counsel."
 tm_yt4.0031.c:0 "The House cannot feed another this year. Write to a House that can."
 tm_yt4_woman_elsewhere_tt:0 "She goes on to another House with the Elder Sister's letter."
 tm_yt4.0032.t:0 "His Horses, Not Me"
 tm_yt4.0032.desc:0 "A widow, [tm_yt4_woman.GetFirstName], has come to the House. Her husband's younger kinsman means to marry her, as the custom allows, and her husband's clan expects it. She would rather take vows.\n\nIn the north, widows who would not remarry have shaved their heads and gone to the cloister, and the custom has spread. A widow of the Khan's own house once refused her husband's kinsman and asked for a household of her own instead.\n\n\"My husband's brother may have his horses,\" she says. \"He will not have me.\""
 tm_yt4.0032.a:0 "Take her vows at the House."
 tm_yt4.0032.b:0 "Write for her to her husband's clan: let her keep a household of her own."
 tm_yt4.0032.c:0 "The House cannot stand against her husband's clan."
 tm_yt4_widow_household_tt:0 "She goes home to a household of her own, with the House's letter behind her."
 # The Empress Chengtian (McMahon WSNR 260-262, 272).
 tm_yt4.0035.t:0 "The Hut of Rebirth"
 tm_yt4.0035.desc:0 "The Empress Dowager Chengtian rules for her son. She does not sit behind a curtain, as empresses of the south do; she faces the court, and the late emperor left an edict that lets her say \"I\" as an emperor does. She has also gone through the rite of rebirth, which is the emperor's alone: into a building set apart north of the palace gate, and out again with a new name."
 tm_yt4.0035.desc_986:0 " In 986 she went through it twice within a short time, and in the same year she rode with the army that broke the Song."
 tm_yt4.0035.desc_early:0 ""
 tm_yt4.0035.desc_question:0 "\n\nA Khitan officer at court has heard what the Way teaches. \"Your sisters say they are born again,\" he says. \"So was she. Is it the same rite?\""
 tm_yt4.0035.a:0 "\"Hers made her a ruler. Mine made me myself, and I needed no throne for it.\""
 tm_yt4.0035.b:0 "Ask him how the rite is kept."
 tm_yt4.0035.b.tt:0 "He tells me what an officer may: every twelve years, a building beside the building of the ruler's mother, three forked timbers to pass under, a midwife, swaddling clothes, and a new name chosen from seven the elders offer. The rest belongs to the court."
 tm_yt4.0035.c:0 "Say nothing. It is her day, not mine."
 # The curtain comes down (McMahon CW 11-16; WSNR 15-16).
 tm_yt4.0041.t:0 "The Curtain Comes Down"
 tm_yt4.0041.desc:0 "[tm_yt4_liege.GetFirstName] rules alone now. I held court behind a curtain, every five days and never alone, with the ruler beside me. I never said the imperial \"I\", and the ministers called my rule temporary from the first day.\n\nNow they want the curtain down. They have their old line ready: the hen does not announce the dawn. A minister once had the curtain taken down without asking the dowager behind it."
 tm_yt4.0041.a:0 "Take it down myself, before they ask."
 tm_yt4.0041.b:0 "One rite first, in the emperor's robes, at the ancestral temple."
 tm_yt4.0041.c:0 "Let the minister take it down. That is his part."
 # Modifiers.
 tm_yt4_curtain_modifier:0 "Behind the Curtain"
 tm_yt4_curtain_modifier_desc:0 "She rules for the throne behind a curtained divide, every five days and never alone. Her rule is called temporary, and she does not take the field."
 tm_yt4_face_to_face_modifier:0 "Face to Face"
 tm_yt4_face_to_face_modifier_desc:0 "She rules for the throne without a curtain, as Khitan and Mongol regents have, and she may lead the army."
 tm_yt4_no_curtain_modifier:0 "Without the Curtain"
 tm_yt4_no_curtain_modifier_desc:0 "The dynasty's founder ruled that women were never to involve themselves in politics. She governs without a title for it, as a dowager may."
 tm_yt4_listener_modifier:0 "At the Throne's Side"
 tm_yt4_listener_modifier_desc:0 "She sits near the throne and listens, for the inner offices."
 tm_yt4_palace_women_modifier:0 "A Seal for the Palace Women"
 tm_yt4_palace_women_modifier_desc:0 "She keeps one of the inner offices' seals for the palace women."
 tm_yt4_yellow_court_modifier:0 "A Winter of the Yellow Court"
 tm_yt4_yellow_court_modifier_desc:0 "She read the Yellow Court scripture through a winter at Hezhong."
 tm_yt4_half_ladle_modifier:0 "Half a Ladle at Mo-shan"
 tm_yt4_half_ladle_modifier_desc:0 "She brought something home from the abbess's hall at Mo-shan."
