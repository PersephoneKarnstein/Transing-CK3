l_english:
 # Keep the Road (the Vigla; docs/wave16/baedling-bands.md)
 tm_bae7_vigla_contract_contract:0 "Keep the Road"
 tm_bae7_vigla_contract_desc_title:0 "A watch on the road,"
 tm_bae7_vigla_contract_desc:0 "[TaskContract.GetEmployer.GetName] wants the road through one of his counties kept: travellers seen safely through, thieves brought in, the watch's toll taken at the ford. He will pay the band for three to five years of it."
 tm_bae7_vigla_contract_request:0 "This [task_contract|E] is for a band of the six faiths. Keep the band's camp in the guarded county or next to it for the whole term. Each year brings the watch's share of the toll, and sometimes a choice."
 tm_bae7.0001.t:0 "Keep the Road"
 tm_bae7.0001.desc_vigla:0 "[employer.GetName] has given us the watch on the road through [tm_bae7_vigla_county.GetName]. In these lands the watch is an old office, with its own name and its own tax, and the farmers along the road pay that tax whether the watch is good or bad. This year it is us.\n\n"
 tm_bae7.0001.desc_road:0 "[employer.GetName] has given us the road through [tm_bae7_vigla_county.GetName] to keep. The farmers along it will pay a little more at the ford, and the merchants a little less to whoever used to wait for them in the woods.\n\n"
 tm_bae7.0001.desc_end:0 "The camp stays where it is, in the county or beside it, until the term is served. The road will tell us soon enough whether we are guards or only one more band on it."
 tm_bae7.0001.a:0 "Post the watch at the ford."
 tm_bae7.0001.a.tt:0 "For three to five years, [tm_bae7_vigla_county.GetName] has #P safer roads#! and #P firmer control#!, and pays a small tax for the watch. Each year the band takes a share of the toll from [employer.GetName]. Moving the camp away ends the contract in failure."
 tm_bae7.0010.t:0 "A Thief on the Road"
 tm_bae7.0010.desc:0 "The watch brought him in at dusk: a farmer's son from up the valley, with a merchant's purse and the merchant's good knife. He did not run far. In some lands the law makes the road's keepers answer for what is taken on their road, and the merchant knows it. He wants his purse, and he wants to see the boy go to the lord."
 tm_bae7.0010.a:0 "To the lord's court with him. That is what the road is kept for."
 tm_bae7.0010.b:0 "The purse goes back. The boy goes home, and his village owes the watch."
 tm_bae7.0010.b.tt:0 "The village remembers. [tm_bae7_vigla_county.GetName] gains a little control."
 tm_bae7.0011.t:0 "The Toll at the Ford"
 tm_bae7.0011.desc:0 "A merchant with six mules will not pay the watch's toll. He has paid the lord's market, he says, and the lord's bridge, and no lord's letter he has read says anything about women at a ford. The letter says exactly that. He has not read it."
 tm_bae7.0011.a:0 "Let him through. The next one will pay."
 tm_bae7.0011.b:0 "What the letter says, and not a coin more."
 tm_bae7.0011.c:0 "Twice it, for the trouble."
 tm_bae7.0011.c.tt:0 "He may take his complaint to the lord who hired us."
 tm_bae7.0012.t:0 "The Guards' Habit"
 tm_bae7.0012.desc:0 "A long caravan is on the road tonight, and the next post is half a day off. Someone at the fire says what is said wherever guards are hired and badly watched: that no one would know, and that the watch on other roads has done it before. Everyone at the fire knows it is true."
 tm_bae7.0012.a:0 "We keep the road we are paid to keep."
 tm_bae7.0012.b:0 "Take what they carry, and send them on."
 tm_bae7.0012.b.tt:0 "The merchants will talk. If the lord hears of it, the contract fails and he will not forget it. Even if he does not hear of it now, he may when the term ends, and he will not think of the band as his servants."
 tm_bae7.0020.t:0 "The Term Served"
 tm_bae7.0020.desc:0 "The term is done. [employer.GetName]'s steward counts the caravans that came through [tm_bae7_vigla_county.GetName] and the thieves who did not, and pays what is owed.\n\n"
 tm_bae7.0020.desc_clean:0 "A lord remembers who kept his road. Some have given such bands land along it, for a garrison of their own."
 tm_bae7.0020.desc_robbed:0 "Nobody has spoken of the caravan. Nobody has to. The steward pays without looking up."
 tm_bae7.0020.a:0 "The road was kept."
 tm_bae7.0021.t:0 "The Watch Ends"
 tm_bae7.0021.desc_found:0 "The merchants talked, and [employer.GetName] heard them. The watch is dismissed. Nothing more is said to our faces; it does not need to be."
 tm_bae7.0021.desc_lord:0 "The lord who hired the watch no longer holds the road, or no longer stands on our side of it. There is no one to keep it for."
 tm_bae7.0021.desc_left:0 "The camp has moved on, and the watch on [employer.GetName]'s road went with it. Whatever the reason, the term was not served."
 tm_bae7.0021.a:0 "So be it."
 tm_bae7_vigla_county_modifier:0 "The Watch on the Road"
 tm_bae7_vigla_county_modifier_desc:0 "A hired band keeps the road through this county for a term of years. The roads are safer and the lord's hold firmer, and the county pays the watch's tax."
 tm_bae7_kept_road_opinion:0 "Kept My Road"
 tm_bae7_overcharged_opinion:0 "Took Twice the Toll"
 tm_bae7_guards_robbed_opinion:0 "Robbed the Road I Paid Them to Keep"

 # A harbour with a petty coastal lord
 tm_bae7.0031.t:0 "A Harbour Open"
 tm_bae7.0031.desc:0 "A boat came in on the evening tide with a letter from [tm_bae7_harbour_lord.GetName], who holds a stretch of coast and a harbour and does not much care whose gods a crew keeps. He has heard how the war goes. If the hall falls, he writes, his harbour is open to me and mine.\n\nIt has happened before. Bands driven off an island they once held found a last landing with small lords along the coast, who had use for good crews and few questions."
 tm_bae7.0031.a:0 "Tell him we may come."
 tm_bae7.0031.a.tt:0 "If you lose all your land in the next ten years, [tm_bae7_harbour_lord.GetName] will take you in: your camp may go to his coast, or you to his court."
 tm_bae7.0031.b:0 "We hold the hall."
 tm_bae7.0033.t:0 "The Harbour"
 tm_bae7.0033.desc:0 "The hall is gone. [tm_bae7_harbour_lord.GetName]'s word still stands, and his harbour is where it was.\n\n"
 tm_bae7.0033.desc_camp:0 "We have taken to the road again. His coast would give the camp a landing and a lord who owes us nothing and wants us anyway."
 tm_bae7.0033.desc_court:0 "I have no camp and no hall. His court would give me a roof, a seat at his table, and work for my hands."
 tm_bae7.0033.a:0 "To his coast, with the camp."
 tm_bae7.0033.b:0 "To his court."
 tm_bae7.0033.c:0 "I will find my own way."
 tm_bae7.0033.toast:0 "A Band Comes to the Harbour"
 tm_bae7_harbour_opinion:0 "Harbour Promised"

 # The Sword Is My Patent
 tm_bae7_sword_patent_decision:0 "The Sword Is My Patent"
 tm_bae7_sword_patent_decision_desc:0 "We moved our camp when we were asked, and kept our claim and our patience. When our case came before the same lord again, he would not give. There is one letter left to send him."
 tm_bae7_sword_patent_decision_confirm:0 "Send the letter"
 tm_bae7_sword_patent_decision_tooltip:0 "Press the claim you kept when you moved on"
 tm_bae7_sword_patent_decision.tt:0 "The holder of the county you claim gets your last letter. He may give you the county as his vassal; if not, you declare a [claim|E] war on him for it."
 tm_bae7_sword_county_tt:0 "You still hold your [claim|E] on the county you moved on from, or on another county of the lord who refused you, and its holder is not your ally or already at war with you"
 tm_bae7.0040.t:0 "This Sword Is My Patent"
 tm_bae7.0040.desc:0 "A letter from [tm_bae7_band.GetName], whose band once moved its camp off [tm_bae7_sword_county.GetName] when it was asked, and later asked in its turn and was refused.\n\nShe kept her claim. She asked for a patent, and none came. Now a sword has come with her letter. This is my patent, she writes, and she would rather have had yours."
 tm_bae7.0040.a:0 "Give her the county. Let it be her patent after all."
 tm_bae7.0040.a.tt:0 "She becomes your vassal in [tm_bae7_sword_county.GetName], as by Negotiate Settlement."
 tm_bae7.0040.b:0 "Then let it be settled in the field."
 tm_bae7.0040.b.tt:0 "[tm_bae7_band.GetName] declares a [claim|E] war on you for [tm_bae7_sword_county.GetName]."
 tm_bae7_patent_refused.toast:0 "The Lord Would Not Give"
 tm_bae7_patent_refused_opinion:0 "Refused Me After I Was Patient"
