l_english:
 bm_867_crusader_dolls:0 "Crusader Dolls"
 bm_867_crusader_dolls_desc:0 "Across the known world, a handful of small faiths keep a road the great religions will not walk: daughters the world will not call women are named and kept as women. At Dorylaion they take the knife at the feast of the Mother. On Gotland a völva goes up onto her platform for them. At Dunhuang they carry a jade embryo for ten months and are born from it as themselves.\n\nThe faiths are small, and their neighbours are not. Emperors, kings and caliphs count their daughters as eunuchs, prodigies or men, and the Houses that shelter them stand on borrowed land. In the Jewish street of Arles, the women of the lamp keep a sixth faith with no lord of their own.\n\n#bold Will you keep a small faith alive through the centuries, or carry its daughters into the wider world?#!"
 bookmark_tm_theia_beatrike:0 "Theia Beatrike"
 bookmark_tm_theia_beatrike_subheading:0 "Mother of Mothers"
 bookmark_tm_theia_beatrike_desc:0 "Called Aunt Bea by the House she raised, Theia Beatrike is an elder daughter of the knife and the Mother of Mothers at Dorylaion. She holds Phrygia as a theocracy beneath the Emperor, whose court calls its eunuchs angels and buys them as boys.\n\nThe Mother House is old in its faith, but its lands are not secure. Imperial governors covet Phrygia, and the bishops of Constantinople have long memories.\n\n#bold Can you keep the Mother House standing, and choose which House of the knife its daughters will follow?#!"

 bookmark_tm_steinunn:0 "Steinunn"
 bookmark_tm_steinunn_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_tm_steinunn_desc:0 "Steinunn holds Gotland, a small island grown rich on the Baltic trade, and her younger brother Steinn stands at her side as her heir. In this world, her hall keeps the Bædling faith: when a völva goes up onto her platform, she sees a daughter waiting below, and the hall calls her one.\n\nSwedes and Danes eye the island's silver, and the word ragr is never far from a neighbour's tongue. The hall must answer it with words of its own.\n\n#bold Will Gotland remain a quiet harbour for the faith, or will its counts carry the high seat across the sea?#!"
 bookmark_tm_huijing:0 "Huijing"
 bookmark_tm_huijing_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_tm_huijing_desc:0 "At the far end of the Hexi corridor, the Guiyi circuit has thrown off the Tibetans and pledged itself, at a distance, to the Tang. In this world its governor at Dunhuang is Huijing, a nüguan of Yutai Dao, the Way of the Jade Embryo, whose daughters carry an embryo for ten months and are born from it as themselves. She raises a boy of the Suo, Chengxun, as her ward and heir.\n\nThe Mogao caves are the Way's holy ground, and its temple societies keep their estates from the crown. Sooner or later, the palace's inner offices will come calling with seals and salaries.\n\n#bold Can the Way hold its seat on the edge of the empire, or will office prove the price of its daughters' welcome?#!"

 bookmark_tm_cantiradevi:0 "Cantirâdêvi"
 bookmark_tm_cantiradevi_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_tm_cantiradevi_desc:0 "A patron of the temple street of Kanchipuram, Cantirâdêvi holds Candragiri for the Pallava king. She keeps the Worn Garland, whose daughters take their vow in the month of Mārkazhi and their name from the garland Āntāl wore.\n\nThe Pallavas are old, and their rivals are rising: the Cholas to the south, the Rashtrakutas to the north. A vassal countess has little to bargain with but her loyalty and her gifts to the temple.\n\n#bold Can you keep Candragiri and the Garland alive while the great houses of the south fight over Tondai Nadu?#!"

 bookmark_tm_djeneba:0 "Djeneba"
 bookmark_tm_djeneba_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_tm_djeneba_desc:0 "Djeneba holds Kirina for her lord, in the old heart of the Manding. She keeps Badenya, the faith of mother-childness. Three people see a daughter across: a smith who bargains with a djinn, a woman who claims her as her mother's child, and a jeli who speaks her name before the lord.\n\nGhana still rules the Sahel, and Mali is not yet an empire. Every seventh dry season, the house of the faith puts on a new roof.\n\n#bold Will Kirina remain a house of the faith as the old powers fall and new ones rise?#!"
 bookmark_tm_bonadonna:0 "Bonadonna"
 bookmark_tm_bonadonna_subheading:0 "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_tm_bonadonna_desc:0 "Bonadonna is an elder of the women of the lamp, who sit together in the women's synagogue of Arles, below the men's. She keeps Ha-Nehpakhot, a small current inside Judaism. In Adar a seeker may ask, as Leah did, to be turned, and the street's judges decide whether her dress outlives Purim.\n\nThe sect holds no land. Bonadonna keeps a camp of scholars and physicians that goes where its learning is wanted, and the Jewish street of Arles lives under its lord.\n\n#bold Will the women of the lamp find a lord who keeps them, or a land of their own?#!"
 d_laamp_tm_lamp:0 "Women of the Lamp"
