 # --- Cūtikkotutta Mālai, "the garland worn and given" (the Worn Garland), and Badenya (faith_design.md §15) ---
 tm_garland:0 "Cūtikkotutta Mālai"
 tm_garland_adj:0 "Mālai"
 tm_garland_adherent:0 "Mālai devotee"
 tm_garland_adherent_plural:0 "Mālai devotees"
 tm_garland_desc:0 "A current of Tamil devotion that crosses Śiva's temples and Vishnu's. Its poets, men among them, sang to the god as girls in love; a Vīraśaiva saint of the twelfth century asked to be the devotees' bride, and a commentator of the thirteenth wrote that before God the devotee loses his male nature and wears the dress of a woman. Cūtikkotutta Mālai, the garland worn and given, holds that this was not a manner of speaking. It keeps Āntāl's month-long vow of Mārkazhi, wears the garland before it is offered, as she did, and calls its daughters what Śiva's temples called their women: daughters of God. Its scripture is King Bhangāśvana, who was turned into a woman and, offered her old body back, chose to stay as she was. No record shows a man living as a woman in these temples; the faith is a reconstruction, and says so."
 tm_garland_rite:0 "Rite of the Mārkazhi Vow"
 tm_garland_rite_adj:0 "Mālai"
 tm_garland_rite_adherent:0 "Mālai devotee"
 tm_garland_rite_adherent_plural:0 "Mālai devotees"
 tm_garland_rite_desc:0 "The main rite of Cūtikkotutta Mālai, the garland worn and given, kept on the temple street of Kanchipuram."
 tm_tevanar_makal:0 "Daughter of God"
 tm_tevanar_makal_plural:0 "Daughters of God"
 tm_badenya:0 "Badenya"
 tm_badenya_adj:0 "Badenya"
 tm_badenya_adherent:0 "Mother's Child"
 tm_badenya_adherent_plural:0 "Mother's Children"
 tm_badenya_desc:0 "In Mande speech badenya, mother-childness, is the bond of those who share a mother, and fadenya, father-childness, is the rivalry of those who share a father. Badenya takes the first as its law. In the Sunjata tradition a woman named Tenenba claimed a hero she had not borne and said, “I have given birth to a child without getting pregnant”; the faith says any woman may so claim a daughter. Its gate is a bargain, a claim and a word: the smith who speaks for the djinn, the woman who calls her “my mother's child”, and the jeli who speaks her name before the mansa. The line passes through a sister or a daughter, as it did at Ghana and Walata, and the House buries its own. Nothing in the medieval record shows a man becoming a woman here; Badenya is a reconstruction, built on institutions that are attested, and says so."
 tm_badenya_rite:0 "Rite of the Word That Cools"
 tm_badenya_rite_adj:0 "Badenya"
 tm_badenya_rite_adherent:0 "Mother's Child"
 tm_badenya_rite_adherent_plural:0 "Mother's Children"
 tm_badenya_rite_desc:0 "The main rite of Badenya, kept at Kirina."
 tm_jelimuso:0 "Jelimuso"
 tm_jelimuso_plural:0 "Jelimusow"
 tm_ala:0 "Ala"
 tm_ala_possessive:0 "Ala's"
 tm_badenya_spirits:0 "the spirits"
 tm_badenya_spirits_possessive:0 "the spirits'"
 tm_badenya_ancestors:0 "the ancestors"
 tm_badenya_ancestors_possessive:0 "the ancestors'"
 tm_badenya_bush:0 "the bush spirits"
 tm_badenya_bush_possessive:0 "the bush spirits'"
 holy_site_tm_srirangam_name:0 "Srirangam"
 holy_site_tm_srirangam_effects:0 "Vishnu's island temple on the Kaveri, where the god was woken with song each morning by the ninth century, and where an inscription of 1126 names Āntāl."
 holy_site_tm_tanjavur_name:0 "Thanjavur"
 holy_site_tm_tanjavur_effects:0 "Here the king who built the great temple gave four hundred women each a house and a share, and engraved their names on stone."
 holy_site_tm_madurai_name:0 "Madurai"
 holy_site_tm_madurai_effects:0 "The old Pāndya city of the goddess and her wedding."
 holy_site_tm_kirina_name:0 "Kirina"
 holy_site_tm_kirina_effects:0 "Where the Sunjata tradition sets the battle that made Mali. Badenya's seat."
 holy_site_tm_walata_name:0 "Walata"
 holy_site_tm_walata_effects:0 "The desert port where Ibn Battūta saw a man's heir be his sister's son, and wondered at it."
 holy_site_tm_do_name:0 "Do"
 holy_site_tm_do_effects:0 "Al-Bakrī's “Daw” of 1068, by the river near Ségou, ringed with the burial mounds of its dead."
 tenet_tm_pavai_vow_name:0 "The Pāvai Vow"
 tenet_tm_pavai_vow_desc:0 "In Mārkazhi, before dawn, the girls of the street wake one another, bathe, shape a goddess of sand, and sing to the god until the month is out. Āntāl made that vow a poem, and Śiva's temple women paid to sing their own. The Garland keeps the vow with its companions, and holds that when the circle holds to the end, the staff names a daughter who was one already."
 tenet_tm_temple_street_name:0 "The Temple Street"
 tenet_tm_temple_street_desc:0 "The temple women of the Chola country held a house and a share on the temple street, and their names were cut in stone. The Garland keeps that street for its daughters: a lord may grant one a share, or she may buy one, and she names the one who will hold it after her."
 tenet_tm_temple_street_opinion:0 "The Temple Street"
 tenet_tm_crossing_name:0 "The Crossing"
 tenet_tm_crossing_desc:0 "A seeker who would cross goes to a smith who speaks with the djinn. The djinn asks a life of her house; she gives instead the manhood the world masked her in, and is hot until a woman claims her and a jeli speaks her name aloud. Then the word cools her."
 tenet_tm_mothers_children_name:0 "Mother's Children"
 tenet_tm_mothers_children_desc:0 "What a mother gives, a mother may give again: a woman may claim a child she did not bear, and the line passes through a sister or a daughter. When a daughter dies, the House buries her under her own name."
 tenet_tm_mothers_children_opinion:0 "Mother's Children"
 doctrine_parameter_tm_garland_gate:0 "Men may keep the pāvai vow in Mārkazhi, and rise as daughters of God"
 doctrine_parameter_tm_temple_street:0 "Daughters may hold a share on the temple street"
 doctrine_parameter_tm_crossing_gate:0 "Men may make the crossing, and rise as daughters of the House"
 doctrine_parameter_tm_house_buries_its_own:0 "The House buries its daughters under their own names"
 trait_tm_daughter_of_the_garland:0 "Daughter of God"
 trait_tm_daughter_of_the_garland_desc:0 "This character kept the pāvai vow through Mārkazhi with her companions, and the staff was touched to her head: a daughter of God, as Śiva's temples called their women."
 trait_tm_daughter_of_the_house:0 "Daughter of the House"
 trait_tm_daughter_of_the_house_desc:0 "This character paid the djinn with the mask of manhood the world had put on her, was claimed by a woman as her mother's child, and had her name spoken before the mansa. The word cooled her."
 tm_garland_sister_opinion:0 "A Woman Before God"
 tm_buried_under_old_name_opinion:0 "Gave Our Sister to Her Blood Kin"
 tm_inscribed_share_modifier:0 "A Name in Stone"
 tm_inscribed_share_modifier_desc:0 "This character's gift to the temple has been cut in stone, with the share it endows."
 tm_pavai_vow_modifier:0 "Keeping the Pāvai Vow"
 tm_pavai_vow_modifier_desc:0 "This character is keeping the Mārkazhi vow with her companions."
 tm_crossing_hot_modifier:0 "Hot"
 tm_crossing_hot_modifier_desc:0 "This character has made the smith's bargain and is hot, as the Mande say of one between states, until the word cools her."
 tm_feast_server_modifier:0 "Serves at the Feasts"
 tm_feast_server_modifier_desc:0 "This character serves and dances at others' naming feasts, learning them."
 tm_feast_host_modifier:0 "Hosts the Feasts"
 tm_feast_host_modifier_desc:0 "This character hosts naming feasts, and a jeli speaks for her."
 tm_djinn_unpaid_modifier:0 "The Djinn Unpaid"
 tm_djinn_unpaid_modifier_desc:0 "This character did not pay the djinn's second price, and does not sleep well."
 tm_pavai_decision:0 "Keep the Pāvai Vow"
 tm_pavai_decision_desc:0 "In Mārkazhi the girls of the street wake each other before dawn and sing to the god. Keep the vow with them through the month, and at its end bow your head to the staff."
 tm_pavai_decision_tooltip:0 "Begin the month-long Mārkazhi vow."
 tm_pavai_decision_confirm:0 "Wake the girls of the street"
 tm_pavai_decision_markali_tt:0 "It is Mārkazhi (December or January)"
 tm_crossing_decision:0 "Go to the Smith"
 tm_crossing_decision_desc:0 "A smith who speaks with the djinn can open the way. Then a woman must claim you, and a jeli must speak your name."
 tm_crossing_decision_tooltip:0 "Begin the crossing."
 tm_crossing_decision_confirm:0 "Go to the forge"
 tm_garland.0010.t:0 "The Waking"
 tm_garland.0010.desc:0 "It is the first dawn of Mārkazhi. Before light I go from door to door, as the girls of the vow do, and call the others out: wake, the birds are calling, wake and bathe. [tm_garland_elder.GetFirstName], a daughter of God, walks with us."
 tm_garland.0010.a:0 "Go from door to door and wake them all."
 tm_garland.0010.b:0 "Wake those who will come."
 tm_garland.0010.c:0 "Not this Mārkazhi."
 tm_garland.0011.t:0 "The Song"
 tm_garland.0011.desc:0 "We have bathed and shaped a goddess of sand, and now we sing. The cold dawns have thinned our circle a little. [tm_garland_elder.GetFirstName] asks which song we will keep: the one Śiva's temple women paid to sing, or Āntāl's."
 tm_garland.0011.a:0 "Śiva's song, the Tiruvempāvai."
 tm_garland.0011.b:0 "Āntāl's song, the Tiruppāvai."
 tm_garland.0012.t:0 "The Garland"
 tm_garland.0012.desc:0 "The garland for the god is ready. Āntāl, they say, put it on first, and her father found her wearing it and was afraid, until the god said he wanted no other garland but the one she had worn."
 tm_garland.0012.a:0 "Wear it before it is offered."
 tm_garland.0012.a.caught:0 "Someone saw"
 tm_garland.0012.b:0 "Offer it as it came."
 tm_garland.0013.t:0 "The Dream"
 tm_garland.0013.desc:0 "I dreamed of the wedding: the drums, the canopy, the god taking my hand. I woke and it was not so. Āntāl woke from the same dream."
 tm_garland.0013.a:0 "It is a sign."
 tm_garland.0013.b:0 "It was only a dream."
 tm_garland.0001.t:0 "The Staff and the Name"
 tm_garland.0001.desc:0 "The month is out. Those of us who kept the vow to the end stand before the temple, and [tm_garland_elder.GetFirstName] lifts the staff. In the old rite of Śiva's temples it touched a girl's head, and she was given a name and called a daughter of God."
 tm_garland.0001.a:0 "Bow my head to the staff."
 tm_garland.0001.a.success:0 "The circle held. A daughter of God"
 tm_garland.0001.a.failure:0 "The circle broke before the month was out. Next Mārkazhi"
 tm_garland.0002.t:0 "A Name of the Temple Street"
 tm_garland.0002.desc:0 "The women of the street have brought the drum we asked for in the song, and now they ask what name to cut beside mine on the stone."
 tm_garland.0002.a:0 "A name of the temple street."
 tm_garland.0002.b:0 "I keep the name I carry."
 tm_garland.0002.c:0 "The old name will serve for now."
 tm_garland.0020.t:0 "A Name in Stone"
 tm_garland.0020.desc:0 "The temple's masons can cut a gift into its wall: a lamp to be kept burning, a share of paddy, and the giver's name, for as long as the stone stands."
 tm_garland.0020.a:0 "Endow a lamp and a share, and have it cut in stone."
 tm_garland.0020.b:0 "Give a smaller gift, unrecorded."
 tm_garland.0020.c:0 "Not this year."
 tm_garland.0030.t:0 "A Pandit's Objection"
 tm_garland.0030.desc:0 "A learned man of my court objects to [tm_garland_daughter.GetFirstName]. In one telling of Ilā's story, he says, Ilā wished to stay a woman, and the goddesses themselves talked her out of it: “To hell with birth as a woman.” Every telling turns Ilā back to a man. Her friends answer with Bhangāśvana, who was offered her old body and chose to stay a woman."
 tm_garland.0030.a:0 "“To hell with birth as a woman.”"
 tm_garland.0030.b:0 "“Bhangāśvana chose, and Indra let her.”"
 tm_garland.0030.c:0 "Let the temple decide."
 tm_badenya.0010.t:0 "The Smith's Bargain"
 tm_badenya.0010.desc:0 "The forge is cold tonight. [tm_smith.GetFirstName] the smith has spoken with the djinn, and gives me its price: a life from my house. Then he tells me what the sculptors say among themselves, that a man may give his own manhood instead, and be less than a man after. It was never mine. It is a mask the world put on me, and I will not be less without it."
 tm_badenya.0010.a:0 "Give it the mask the world put on me, and no one else's life."
 tm_badenya.0010.b:0 "Pay the smith for his trouble and walk away."
 tm_badenya.0011.t:0 "My Mother's Child"
 tm_badenya.0011.desc:0 "I am hot, as they say of one between states, and I cannot cool alone. [tm_claimer.GetFirstName] comes to me and says before the women of the compound: “This is my mother's child.” In the old story Tenenba said of a son she never bore, “I have given birth to a child without getting pregnant.”"
 tm_badenya.0011.desc_none:0 "I am hot, as they say of one between states, and I cannot cool alone. A woman must claim me as her mother's child, and no woman here will yet."
 tm_badenya.0011.a:0 "Pay the bracelets for my crossing."
 tm_badenya.0011.b:0 "The bracelets can wait."
 tm_badenya.0011.c:0 "No one will claim me yet."
 tm_badenya.0012.t:0 "The Word That Cools"
 tm_badenya.0012.desc:0 "At the feast the jeli rises before [tm_host.GetTitledFirstName] and speaks my name, my claiming mother's name before it, as Sogolon's name goes before Sunjata's. What the jeli says, the court will remember."
 tm_badenya.0012.a:0 "Pay the jeli well."
 tm_badenya.0012.b:0 "Pay what I can, and let the jeli make of it what they will."
 tm_badenya.0012.b.praise:0 "The jeli sang it as praise"
 tm_badenya.0012.b.satire:0 "The jeli sang of how little I paid, and the court laughed at my thin purse"
 tm_badenya.0002.t:0 "A Name Before the Mansa"
 tm_badenya.0002.desc:0 "The word has cooled me. The women ask what name the jeli should speak after my mother's."
 tm_badenya.0002.a:0 "A name of the old songs."
 tm_badenya.0002.b:0 "I keep the name I carry."
 tm_badenya.0002.c:0 "The old name will serve for now."
 tm_badenya.0015.t:0 "The Djinn Returns"
 tm_badenya.0015.desc:0 "A year has passed. The smith comes to my door at dusk: the djinn has come back, once, as the djinn do, for a second price."
 tm_badenya.0015.a:0 "Pay in gold, through the smith."
 tm_badenya.0015.b:0 "Pay with offerings and prayer."
 tm_badenya.0015.c:0 "Pay nothing more."
 tm_badenya.0020.t:0 "A Naming Feast"
 tm_badenya.0020.desc_serve:0 "There is a naming feast in the compound. A younger daughter serves the food and dances, and watches how the feast is made, as her claiming mother once watched."
 tm_badenya.0020.desc_host:0 "There is a naming feast in the compound, and this time it is mine to host. I will sit, and the jeli will speak for me."
 tm_badenya.0020.a:0 "Serve, dance, and learn the feast."
 tm_badenya.0020.b:0 "Host the feast, and let the jeli speak for me."
 tm_badenya.0020.c:0 "Stay away this time."
 tm_badenya.0030.t:0 "The House Buries Its Own"
 tm_badenya.0030.desc:0 "[tm_dead_daughter.GetFirstName] is dead. The daughters of the House would bury her under her own name; her blood kin have come for her body, her goods, and the name she was given at birth."
 tm_badenya.0030.a:0 "She is buried by the House, under her own name."
 tm_badenya.0030.b:0 "Let her blood kin take her."
