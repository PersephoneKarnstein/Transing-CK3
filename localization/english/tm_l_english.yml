l_english:
 ### Culture ###
 kybeline:0 "Kybeline"
 kybeline_prefix:0 "Kybelo"
 kybeline_collective_noun:0 "Kybelines"

 ### Faith ###
 transbian_maximalism:0 "Adelphai Dorleyaiou"
 transbian_maximalism_adj:0 "Dorleyaian"
 transbian_maximalism_adherent:0 "Dorleyaian Sister"
 transbian_maximalism_adherent_plural:0 "Dorleyaian Sisters"
 transbian_maximalism_old:0 "Old Dorleyaian"
 transbian_maximalism_old_adj:0 "Old Dorleyaian"
 transbian_maximalism_old_adherent:0 "Old Dorleyaian"
 transbian_maximalism_old_adherent_plural:0 "Old Dorleyaians"
 transbian_maximalism_desc:0 "The Sisters of Dorylaion keep a house almost no one remembers. Before the Patriarchs, the Mother's galli begged on the roads of Phrygia, and the Sisters call them gallae and say the house at Pessinus never closed. They remember it kinder than it was, and the eldest know it: Pessinus belonged to priests called Attis who passed the office from father to son. What the Sisters will not take is what Constantinople offers instead. "The court calls its eunuchs angels," they say, "and buys them as boys," and they want neither the title nor the market. The knife does not make a sister a woman: she was one before it, and it gives her the body the world must read as a woman's. She rises a daughter, not a third thing. They choose their heirs rather than breed them, women alone serve their altars, and what they beg they share among themselves."
 ### Rite ###
 transbian_maximalist_rite:0 "Rite of Dorleyaion"
 transbian_maximalist_rite_adj:0 "Dorleyaian"
 transbian_maximalist_rite_adherent:0 "Dorleyaian Sister"
 transbian_maximalist_rite_adherent_plural:0 "Dorleyaian Sisters"
 transbian_maximalist_rite_desc:0 "The main rite of the Sisters, kept at the house of Dorylaion."

 ### Faith terminology ###
 tm_priestess:0 "Daughter"
 tm_priestess_plural:0 "Daughters"
 tm_elder_sister:0 "Elder Sister"
 tm_elder_sister_plural:0 "Elder Sisters"
 tm_mother_of_mothers:0 "Mother of Mothers"
 tm_mother_house:0 "the Mother House"
 tm_metroon:0 "metroon"
 tm_metroon_plural:0 "metroa"
 tm_devotee:0 "Sister"
 tm_devotee_plural:0 "Sisters"

 ### Tenets ###
 tenet_tm_day_of_blood_name:0 "Day of Blood"
 tenet_tm_day_of_blood_desc:0 "Each spring, on the Day of Blood, the novices let blood and mourn with the Mother; two days later, at the Hilaria, the festival of joy, they take the knife and rise as daughters with new names. The knife does not make them women. They were sisters before it, and it gives them the body the world must read as a woman's. They are not a third thing between men and women, whatever the Emperor's law says of its eunuchs."
 tenet_tm_daughters_chosen_name:0 "Daughters Chosen, Not Born"
 tenet_tm_daughters_chosen_desc:0 "Blood confers nothing. A house is the women who chose it, and a mother passes her name, her lands and her office to the daughter she adopts."
 tenet_tm_sisterhood_name:0 "Unbending Sisterhood"
 tenet_tm_sisterhood_desc:0 "Love the sister you loathe. The faith teaches that a quarrel between sisters is settled among sisters and that the cast-out are given shelter, and two daughters may bind themselves by the old rite of sister-making."
 tenet_tm_sisterhood_opinion:0 "Unbending Sisterhood"
 doctrine_parameter_tm_personal_knife_half_cost:0 "The Rite of the Knife costs you half the usual @piety_icon![piety|E]"

 ### Doctrine groups ###
 doctrine_tm_knife_name:0 "The Knife"
 doctrine_tm_body_name:0 "The Cut Body"

 ### Doctrines ###
 tm_knife_grandmother_name:0 "Grandmother's House"
 tm_knife_grandmother_desc:0 "Any captive may be cut, man or boy, and the cut serve. Grandmother never called them daughters: she called them eunuchs, because unmaking them as men was the whole point, and she cut boys as the court's merchants do. They were meant to stay men in their own minds and live in the wrong body as a punishment. The old regime's way, and the reputation every neighbour already believes of us."
 tm_knife_aunt_bea_name:0 "Aunt Bea's House"
 tm_knife_aunt_bea_desc:0 "Only grown men proven violent are taken, and never a child. Each is given a sponsor who once walked the same road, and none is made to suffer pointlessly. The House holds that the ones who leave its cells are women, all of them, and that the knife only gives them the body: few would have called themselves sisters before the cells, and nearly all are glad of it after. It claims no law of the Emperor for what it does, and it admits that it keeps cells and learned its craft in Grandmother's. Those who will not change are not kept."
 tm_knife_gift_alone_name:0 "The Gift Alone"
 tm_knife_gift_alone_desc:0 "The knife is a gift given, never a sentence, and never to a child: only grown women who ask are cut. Even the Mother of God was asked. Aunt Bea's sisters answer that most of the women they made would never have asked, and are women now all the same. The Gift Alone answers that a gift you cannot refuse is not a gift. The argument has outlived everyone who started it."
 tm_body_aristotelian_name:0 "The Aristotelian Body"
 tm_body_aristotelian_desc:0 "As the Philosopher taught, the cut body changes into the female condition. The knife does not make the woman: the Sisters knew her a sister before it. It makes the body the world must read as a woman's. The daughters of the knife are women in every law of the faith, whatever the Emperor's law says: the faith keeps Aristotle's direction and refuses his ranking."
 tm_body_galenic_name:0 "The Galenic Body"
 tm_body_galenic_desc:0 "After Galen, the cut are some third thing, neither man nor woman. It is the rite that agrees with the Emperor, whose law counts three kinds of people: men, women and eunuchs. A third kind can be honoured, employed and kept apart, and it sits easier with bishops. The Aristotelians call it the old cage with a new name."

 ### Doctrine parameters ###
 doctrine_parameter_tm_day_of_blood_active:0 "Men may take the knife and rise as daughters"
 doctrine_parameter_tm_castrates_are_women:0 "The cut are counted as women"
 doctrine_parameter_tm_castrates_third_kind:0 "The cut are counted as a third kind"
 doctrine_parameter_tm_adoptive_matriline:0 "Adopted daughters inherit as daughters of the blood"
 doctrine_parameter_tm_sister_making_allowed:0 "Two daughters may be bound by sister-making"
 doctrine_parameter_tm_knife_penal_any_prisoner:0 "Any male prisoner may be cut"
 doctrine_parameter_tm_knife_vanilla_eunuch_outcome:0 "The cut become court eunuchs, not daughters"
 doctrine_parameter_tm_knife_penal_intake_only:0 "Only prisoners proven violent may be taken into the programme"
 doctrine_parameter_tm_knife_sponsor_chain:0 "Each novice is given a sponsor"
 doctrine_parameter_tm_knife_voluntary:0 "Any man of the faith may ask for the knife"
 doctrine_parameter_tm_rescue_daughters_cb:0 "May wage war to free daughters living under lords of other faiths"
 ### Holy sites ###
 holy_site_tm_dorylaion_name:0 "Dorylaion"
 holy_site_tm_dorylaion_effect_name:0 "From [holy_site|E] #weak ($holy_site_tm_dorylaion_name$)#!"
 holy_site_tm_kyzikos_name:0 "Kyzikos"
 holy_site_tm_kyzikos_effect_name:0 "From [holy_site|E] #weak ($holy_site_tm_kyzikos_name$)#!"
 holy_site_tm_ankyra_name:0 "Ankyra"
 holy_site_tm_ankyra_effect_name:0 "From [holy_site|E] #weak ($holy_site_tm_ankyra_name$)#!"

 ### Traits ###
 trait_tm_transgender:0 "Marked by the Mother"
 trait_tm_transgender_desc:0 "Something in this character answers to the Mother. Among the Sisters it is said that daughters are born of any womb, and that the Mother sows them among every people."
 trait_tm_daughter_of_the_knife:0 "Daughter of the Knife"
 trait_tm_daughter_of_the_knife_desc:0 "This character took the knife on the Day of Blood and rose a daughter. The Sisters counted her a sister before the knife and count her among their women now; others count her as they please."
 trait_tm_novice:0 "Novice of the House"
 trait_tm_novice_desc:0 "This character is in the care of a sponsor of the Mother House, partway along the road the sponsor once walked."
 trait_tm_washout:0 "Washed Out"
 trait_tm_washout_desc:0 "Taken into the House and judged unfit to remain. What became of him afterwards is not discussed."

 ### Game rules ###
 rule_tm_reembodiment:0 "Daughters of the Knife"
 setting_tm_reembodiment_on:0 "Re-embodied"
 setting_tm_reembodiment_on_desc:0 "After the rite, a daughter is remade as a woman in every respect the game knows: new body, same face. Memories, secrets, hooks and schemes are lost with the old register."
 setting_tm_reembodiment_off:0 "Cosmetic only"
 setting_tm_reembodiment_off_desc:0 "A daughter keeps her body; her portrait is softened and her beard removed. Nothing is lost."
 rule_tm_flavour_rate:0 "Crusader Dolls Flavour Events"
 setting_tm_flavour_rate_rare:0 "Rare"
 setting_tm_flavour_rate_rare_desc:0 "A character receives at most one flavour event from the mod every two years. Rites and gates are not affected."
 setting_tm_flavour_rate_normal:0 "Normal"
 setting_tm_flavour_rate_normal_desc:0 "A character receives at most one flavour event from the mod a year. Rites and gates are not affected."
 setting_tm_flavour_rate_frequent:0 "Frequent"
 setting_tm_flavour_rate_frequent_desc:0 "A character receives at most one flavour event from the mod every six months. Rites and gates are not affected."

 ### Decisions ###
 tm_take_the_knife_decision:0 "Take the Knife"
 tm_take_the_knife_decision_desc:0 "Go to the Elder Sisters and ask for the Day of Blood."
 tm_take_the_knife_decision_tooltip:0 "Rise a daughter of the Mother."
 tm_take_the_knife_decision_confirm:0 "I am ready"

 ### Events ###
 tm_knife.0001.t:0 "The Day of Blood"
 tm_knife.0001.desc:0 "It is the twenty-fourth of March, the Day of Blood. The novices stand with the Sisters and mourn the Mother's lost beloved, and each lets a little blood fall on the stones. The knife does not come today. Today is for grief; joy comes in two days."
 tm_knife.0001.a:0 "Let my blood fall with theirs."
 tm_knife.0001.b:0 "Not this spring."
 tm_knife.0100.t:0 "The Houses of the Knife"
 tm_knife.0100.desc:0 "The Sisters have always argued about whom the knife is for. In the old days, they say, Grandmother's House took any captive and made eunuchs of them, and meant them to suffer it as men. Aunt Bea's House takes only men proven cruel, gives each a sister who once walked the same road, and calls every one of them a woman when she comes out of the cells. It does not pretend the cells are anything but cells. And there are those who say the knife must only ever be a gift, given to those who ask. The Mother House awaits your word."
 tm_knife.0100.a:0 "Grandmother's House. Let them fear us, and let them stay eunuchs."
 tm_knife.0100.b:0 "Aunt Bea's House. Not pointlessly cruel."
 tm_knife.0100.b.tt:0 "The faith keeps Aunt Bea's House."
 tm_knife.0100.c:0 "The Gift Alone. Only those who ask."

 ### Titles and characters ###
 d_tm_mother_house:0 "Mother House of Dorylaion"
 d_tm_mother_house_article:0 "the "
 d_tm_mother_house_adj:0 "Dorleyaian"
 tm_name_theia_beatrike:0 "Theia Beatrike"

 ### Dorley path ###
 tm_take_into_house_interaction:0 "Take into the House"
 tm_take_into_house_interaction_desc:0 "Give [recipient.GetShortUIName] to the Mother House. A sponsor who once walked the same road will have the keeping of him for a year. If he changes, he will rise a daughter. If he will not, he will be washed out."
 tm_intake_not_eligible:0 "Only men proven cruel are taken into the House. A woman the Mother has marked is welcomed, not taken"
 tm_dorley.0010.t:0 "Levers"
 tm_dorley.0010.desc:0 "[tm_sponsor.GetFirstName] has had the keeping of [tm_novice.GetFirstName] for some months now. Every sponsor knows the levers: patience, the truth of what he did, and the story of what she herself once was. Which shall she use?"
 tm_dorley.0010.a:0 "Patience. Let him come to it."
 tm_dorley.0010.b:0 "Make him face what he did."
 tm_dorley.0010.c:0 "Let her tell him who she used to be."
 tm_dorley.0100.t:0 "The Year Turns"
 tm_dorley.0100.desc:0 "A year has passed in the cells beneath the House. The one who was brought here is not the one who will leave. She would never have asked for this, and the Gift Alone would say that matters. [tm_sponsor.GetFirstName] says it matters less than what she is now: she is ready for the knife, and ready to be called sister."
 tm_dorley.0100.a:0 "Let her rise a daughter, in her sponsor's care."
 tm_dorley.0100.b:0 "Let her rise a daughter, and my own."
 tm_dorley.0200.t:0 "One Light in the Cell Wing"
 tm_dorley.0200.desc:0 "Tonight every door to the cells is locked and every lamp is out but one. The Mother of the House comes down in person, as she always does, to tell [tm_novice.GetFirstName] that the programme is over. It would be pointlessly cruel to go on. The cells are the House's, and the House has never pretended otherwise."
 tm_dorley.0200.a:0 "[tm_novice.GetFirstName] stays in the cells."
 tm_dorley.0200.c:0 "There is nothing left to save."

 ### New Personal History ###
 tm_knife.0002.t:0 "A New Personal History"
 tm_knife.0002.desc:0 "The Sisters say the old name is buried with the old life. Before witnesses, a daughter may take a name of the House."
 tm_knife.0002.a:0 "Give me a name of the Sisters."
 tm_knife.0002.b:0 "I will keep the name I carry."
 tm_knife.0002.c:0 "Not yet. Let the old name stand a while."

 ### Sister-Making ###
 tm_sister_making_interaction:0 "Make Sisters"
 tm_sister_making_interaction_desc:0 "Ask [recipient.GetShortUIName] to be bound by the old rite: hands laid together on the Gospel, the elder's on top, a kiss, and a shared cup. It makes no heirs and asks nothing of the law. It is higher than marriage."
 relation_tm_sister:0 "Sworn Sister"
 relation_tm_sister_corresponding:0 "Sworn Sister"
 tm_sister:0 "Sworn Sister"

 ### Rescue the Daughters ###
 tm_rescue_daughters_cb:0 "Rescue the Daughters"
 tm_rescue_daughters_cb_desc:0 "Daughters of our faith live in the lands of [defender.GetShortUIName], under a lord who does not share it, or lie in [defender.GetHerHis] prisons. Free them, and let each choose her road."
 TM_RESCUE_DAUGHTERS_CB_NAME:0 "Rescue the Daughters of [county|E]"
 TM_RESCUE_DAUGHTERS_WAR_NAME:0 "War to Rescue the Daughters of [TITLE.GetBaseName]"
 tm_rescue_daughters_cb_victory_desc:0 "The attacker takes the county. The daughters, novices and Marked women of the attacker's faith who live there, and every one the defender holds captive, are freed. Each chooses for herself whether to join the attacker's court or go home. The attacker gains piety for every woman freed."
 tm_rescue_daughters_cb_white_peace_desc:0 "The attacker loses some prestige."
 tm_rescue_daughters_cb_defeat_desc:0 "The attacker loses prestige and piety."

 ### Fixes and debug ###
 name_list_kybeline:0 "Kybeline"
 tm_rescue_daughters_cb_invalidated_desc:0 "No daughters are left to free, and the war's cause is gone with them."
 tm_debug_take_the_knife_decision:0 "DEBUG: Rise a Daughter Now"
 tm_debug_take_the_knife_decision_desc:0 "Debug mode only. Skip the cost and the knifer's question."
 tm_debug_take_the_knife_decision_tooltip:0 "Debug mode only."
 tm_debug_take_the_knife_decision_confirm:0 "Do it"
 tm_debug_force_programme_interaction:0 "DEBUG: Through the Programme at Once"
 tm_debug_force_programme_interaction_desc:0 "Debug mode only. Release [recipient.GetShortUIName] and make her a daughter of the knife immediately."
 NOT_tm_intake_not_eligible:0 "Is a man proven cruel"
 death_tm_reborn:0 "was reborn a daughter of the Mother"
 tm_knife.0003.t:0 "Not Dead"
 tm_knife.0003.desc:0 "The clerks have closed the old register, and word has gone out that [tm_old_body.GetFirstName] is dead. It is not so. The one you knew has taken the knife and risen a daughter, and lives on as [tm_new_body.GetFirstName]."
 tm_knife.0003.a:0 "Welcome home, [tm_new_body.GetFirstName]."
 tm_debug_census_decision:0 "DEBUG: Census of the Marked"
 tm_debug_census_decision_desc:0 "Debug mode only. Count every living Marked man and daughter of the knife in the world."
 tm_debug_census_decision_tooltip:0 "Debug mode only."
 tm_debug_census_decision_confirm:0 "Count them"
 tm_knife.0900.t:0 "Census of the Marked"
 tm_knife.0900.desc:0 "Living men Marked by the Mother: [ROOT.Char.MakeScope.Var('tm_census_marked').GetValue|V0]\nLiving daughters of the knife: [ROOT.Char.MakeScope.Var('tm_census_daughters').GetValue|V0]\n\nShown: one Marked man (left) and one daughter (right), chosen at random."
 tm_knife.0900.a:0 "Noted."
 tm_arrival.0001.t:0 "A Traveller at the Gate"
 tm_arrival.0001.desc:0 "A young woman has walked a long way to reach my court, and asks at the gate not for alms but for the Sisters. She tells them her name is [tm_arrival.GetFirstName], and that she is a woman, and nobody asks her to prove it. Somewhere behind her is a father's house she will not go back to."
 tm_arrival.0001.a:0 "There is room at this hearth."
 tm_arrival.0001.b:0 "Bring her into the rite. She has waited long enough."
 tm_arrival.0001.c:0 "We cannot take her in. Tell her where the next House is."
 tm_arrival.0002.t:0 "A Daughter of the House"
 tm_arrival.0002.desc:0 "The Elder Sisters have done their work, and the traveller who came to my gate has risen a daughter. She has taken the name [tm_new_daughter.GetFirstName], and she waits to hear where her road goes now."
 tm_arrival.0002.a:0 "Stay with us, [tm_new_daughter.GetFirstName]."
 tm_arrival.0002.b:0 "Go to the Mother House at Dorylaion."

 # Take as Daughter (Sisters' adoption)
 tm_adopt_daughter_interaction:0 "Take as Daughter"
 tm_adopt_daughter_interaction_desc:0 "Adopt [recipient.GetShortUIName] by the custom of the Sisters. She joins your [house|E] and inherits as any daughter would. Unlike common adoption, the Sisters take grown women as readily as girls, and ask nothing about who her kin may be. Under female-only inheritance a Marked girl cannot inherit until she has taken the knife."
 tm_adopt_ai_marked:0 "Marked by the Mother"
 tm_adopt_ai_same_faith:0 "Shares your faith"
 tm_adopt_ai_lowborn:0 "Has no house of her own"
 tm_adopt_ai_has_mother:0 "Her mother still lives"

 # Refuge
 tm_seek_daughters_decision:0 "Send to the Houses"
 tm_seek_daughters_decision_desc:0 "Ask the Sisters' Houses whether anyone in their care needs a hearth."
 tm_seek_daughters_decision_tooltip:0 "Invite a newcomer to your court from three the Houses send."
 tm_seek_daughters_decision_confirm:0 "Send the letter"
 tm_seek_daughters_decision_effect_tt:0 "The Houses will tell you of three who need a home: a Marked girl, a young daughter, and an elder sister. Any of them may choose to stay where she is."

 tm_refuge.0001.t:0 "A House Founded"
 tm_refuge.0001.desc:0 "The first sisters have moved into the House: a hall, a kitchen, a chest for whoever needs it, and a door that opens to anyone who asks for the Sisters. The House is the county's now. Whoever holds these lands after me will have to decide whether to let it stand."
 tm_refuge.0001.a:0 "May it outlast me."
 tm_refuge.0001.a.tt:0 "Your capital county has a Sisters' House."
 tm_refuge.0010.t:0 "Word from the Houses"
 tm_refuge.0010.desc:0 "The Houses write that three in their care need a hearth. [tm_cand_child.GetFirstName] is still a child, and the Mother has marked her. [tm_cand_young.GetFirstName] became a daughter only lately. [tm_cand_elder.GetFirstName] has kept a House for many years among the Elder Sisters."
 tm_refuge.0010.a:0 "Send me the child, [tm_cand_child.GetFirstName]."
 tm_refuge.0010.b:0 "Send me [tm_cand_young.GetFirstName]."
 tm_refuge.0010.c:0 "Send me [tm_cand_elder.GetFirstName], the elder."
 tm_refuge.0010.d:0 "There is room for all who will come."
 tm_refuge.0010.e:0 "Not now."
 tm_refuge.0011.t:0 "A Daughter Chosen"
 tm_refuge.0011.desc:0 "[tm_refuge_candidate.GetFirstName] has arrived. She has no house and no mother living, and the custom of the Sisters is plain: a house is the women who choose it."
 tm_refuge.0011.a:0 "Then I choose her. She is my daughter."
 tm_refuge.0011.b:0 "Let her settle in first."
 tm_refuge.0020.t:0 "My Mother's Faith"
 tm_refuge.0020.desc:0 "[tm_new_mother.GetFirstName] has taken me into her house as her daughter, and what she has is mine in time. Her faith is not mine. She has not made it a condition, but her house keeps the [tm_new_mother.GetFaith.GetName], and a daughter who means to keep the house had better keep its faith as well."
 tm_refuge.0020.a:0 "Her house, her faith. I will learn it."
 tm_refuge.0020.b:0 "I will be her daughter, and I will keep my own faith."
 tm_refuge.0020.toast_a:0 "[ROOT.Char.GetFirstName] takes your faith"
 tm_refuge.0020.toast_b:0 "[ROOT.Char.GetFirstName] keeps her own faith"
 tm_arrival.0002.c:0 "Stay with us, [tm_new_daughter.GetFirstName], as my daughter."

 # ---------------- Northern faith: Bædling ----------------
 tm_baeddel:0 "Bædling"
 tm_baeddel_adj:0 "Bædling"
 tm_baeddel_adherent:0 "Bædling"
 tm_baeddel_adherent_plural:0 "Bædlings"
 tm_baeddel_desc:0 "In the north the sanctioned crossing ran toward manhood. A man who went the other way was called ragr, and the word was held so foul that the law let the man so named kill whoever said it. The law did not shelter him; it sheltered his name as a man. The Bædlings take their name from bædling, a word the English confessors' books set apart from other men (the glossaries also keep bæddel). The clerks never wrote down what made a man a bædling. The Bædlings say it was this road, and they keep it. They hold that when the völva goes up onto her platform and the warding songs hold, she sees who waits below, and a daughter comes away."
 tm_baeddel_rite:0 "Rite of the High Seat"
 tm_baeddel_rite_adj:0 "Bædling"
 tm_baeddel_rite_adherent:0 "Bædling"
 tm_baeddel_rite_adherent_plural:0 "Bædlings"
 tm_baeddel_rite_desc:0 "The main rite of the Bædlings, kept on Gotland."
 tm_volva:0 "Völva"
 tm_volva_plural:0 "Völur"
 tm_hof:0 "Hof"
 tm_hof_plural:0 "Hofs"

 tenet_tm_seidr_name:0 "Seiðr Unmans"
 tenet_tm_seidr_desc:0 "Seiðr is Freyja's art, which she taught; the Bædlings say a man who works it is no longer a man, and they do not call that shame. They hold that when the völva goes into trance for one who waits below, she does not make a daughter. She sees one."
 tenet_tm_valkyrie_host_name:0 "Óðinn's Host"
 tenet_tm_valkyrie_host_desc:0 "The skalds fill Valhöll with dead men. The Bædlings say the Allfather's true host has none in it: the choosers of the slain are women, and the daughters ride with them, as the shield-maidens did at Brávellir. A hall that hears of a sister held in chains goes to bring her home."
 tenet_tm_hall_daughters_name:0 "Daughters of the Hall"
 tenet_tm_hall_daughters_desc:0 "Blood carries nothing the hall did not give. A daughter is fostered, sworn or adopted, and two may bind themselves as sisters by the old oath."
 tenet_tm_hall_daughters_opinion:0 "Daughters of the Hall"
 doctrine_parameter_tm_seidr_gate:0 "Men may ask a völva to sit for them, and rise as daughters"
 doctrine_parameter_tm_personal_seidr_easier:0 "The seiðr costs you half the usual @piety_icon![piety|E]"
 doctrine_parameter_tm_valkyrie_host:0 "Daughters ride together in Óðinn's host"

 # ---------------- Chinese faith: Yutai Dao 玉胎道, the Way of the Jade Embryo (pinyin, as vanilla names Zhengyi and Shangqing) ----------------
 tm_yutai:0 "Yutai Dao"
 tm_yutai_adj:0 "Yutai"
 tm_yutai_adherent:0 "Yutai Adept"
 tm_yutai_adherent_plural:0 "Yutai Adepts"
 tm_yutai_desc:0 "The alchemists teach that an adept nurtures a holy embryo for ten months until it is born from her and becomes her true self. The old books say Lord Lao himself once took the shape of Mother Li and sheltered in his own womb, and the masters say a man must reach a state of pregnancy before he becomes pure yang. Yutai Dao, the Way of the Jade Embryo, stops there, at the mother, and does not go on. Its adepts are born as themselves. The palace counts the cut among its men and would count these women among them too, so that it need never call them women. The Way answers with the rectification of names: a daughter named before witnesses is a daughter, and any eunuch who seeks the same is received as a sister."
 tm_yutai_rite:0 "Rite of the Jade Embryo"
 tm_yutai_rite_adj:0 "Yutai"
 tm_yutai_rite_adherent:0 "Yutai Adept"
 tm_yutai_rite_adherent_plural:0 "Yutai Adepts"
 tm_yutai_rite_desc:0 "The main rite of Yutai Dao, the Way of the Jade Embryo, kept at Dunhuang beneath the Mogao caves."
 tm_nuguan:0 "Nüguan"
 tm_nuguan_plural:0 "Nüguan"
 tm_guan:0 "Guan"
 tm_guan_plural:0 "Guan"
 holy_site_tm_mogao_name:0 "Mogao Caves"
 holy_site_tm_mogao_effects:0 "Dunhuang's caves and abbeys, where thirty-seven Daoist priestesses were ordained in the year 758"

 tenet_tm_jade_embryo_name:0 "The Jade Embryo"
 tenet_tm_jade_embryo_desc:0 "Ten months of stillness, and the holy embryo is born from the crown of the head and becomes the adept's own self. Lord Lao sheltered in his own womb; the Way's daughters do the same and are born as themselves. The Way uses no knife, but it does not despise the people the palace cut. A eunuch who seeks to be born again is received like any other."
 tenet_tm_rectified_names_name:0 "Rectified Names"
 tenet_tm_rectified_names_desc:0 "Confucius taught that when names do not match things, the state falls into disorder. The palace reads him one way: it cuts a body and renames it to fit the place it has chosen. The Way reads him the other: a daughter named before witnesses is a daughter. When the palace counts her among its men, it is not describing her. It is excusing itself."
 tenet_tm_temple_societies_name:0 "Temple Societies"
 tenet_tm_temple_societies_desc:0 "The magistrate takes what a house with no daughter leaves, so every sister has a daughter: the law of the Song lets a daughter, born or adopted, keep her mother's house. The Way's temple and burial societies pay their dues at every birth and every death, keep a righteous store for lean years, and petition the throne for a name-panel so that no magistrate counts their goods."
 doctrine_parameter_tm_embryo_gate:0 "Men may gestate the jade embryo and be born as daughters"
 doctrine_parameter_tm_personal_embryo_easier:0 "Gestating the jade embryo costs you half the usual @piety_icon![piety|E]"
 doctrine_parameter_tm_rectified_names:0 "The Way holds that a daughter named before witnesses is a daughter, whatever the palace counts her"
 doctrine_parameter_tm_temple_societies:0 "Temple societies pay dues at births and deaths, keep a righteous store, and may petition for a name-panel"
 doctrine_parameter_tm_sisters_faith:0 "Same-sex marriage is blessed, and Marked travellers seek out this faith's rulers"

 # ---------------- Traits ----------------
 trait_tm_daughter_of_seidr:0 "Daughter of the High Seat"
 trait_tm_daughter_of_seidr_desc:0 "When the völva went into trance for this character, the warding songs held and the völva saw a daughter. The Bædlings hold that seiðr does what the knife does elsewhere."
 trait_tm_daughter_of_the_embryo:0 "Daughter of the Jade Embryo"
 trait_tm_daughter_of_the_embryo_desc:0 "This character nurtured the holy embryo for ten months and was born from it as herself. Whatever the palace calls her, she is a woman."

 # ---------------- Decisions ----------------
 tm_seidr_decision:0 "Ask a Völva to Sit for Me"
 tm_seidr_decision_desc:0 "Bring a völva to the hall, find a woman who knows the warding songs, and wait below the platform while she goes where seiðr takes her."
 tm_seidr_decision_tooltip:0 "Begin the three-day rite of seiðr."
 tm_seidr_decision_confirm:0 "Send for her"
 tm_embryo_decision:0 "Gestate the Jade Embryo"
 tm_embryo_decision_desc:0 "Go to a nüguan, answer her question, and begin ten months of inner gestation."
 tm_embryo_decision_tooltip:0 "Begin the ten months that end in a daughter's birth."
 tm_embryo_decision_confirm:0 "Begin"
 tm_embryo_already_gestating:0 "You are already gestating the jade embryo"

 # ---------------- Seiðr events ----------------
 tm_seidr.0001.t:0 "The Platform"
 tm_seidr.0001.desc:0 "In the morning the völva goes up onto the platform raised for sorcery, in her dark cloak and white catskin gloves, her staff across her knees. The song is sung, and the other women stand silent in the warding ring. I wait below. Whatever the spirits tell her, she will tell me."
 tm_seidr.0001.a:0 "Wait for her answer."
 tm_seidr.0001.a.success:0 "The song held, and she saw a daughter. "I did not make her. I saw her.""
 tm_seidr.0001.a.failure:0 "The song did not hold this winter"
 tm_seidr.0002.t:0 "A Name of the Hall"
 tm_seidr.0002.desc:0 "The völva has come down from the platform. She says the song held and she saw a daughter, and the women are waiting to hear what they should call me."
 tm_seidr.0002.a:0 "Give me a name the hall will know."
 tm_seidr.0002.b:0 "I keep the name I carry."
 tm_seidr.0002.c:0 "The old name will serve for now."
 tm_seidr.0003.t:0 "Before the Thing"
 tm_seidr.0003.desc:0 "At the thing I stood and said what I am now. A man at the back shouted the old word, ragr. The law gives me his life for it, though not out of kindness: it holds the word so foul that whoever says it of another may be killed. Everyone is waiting to see how I answer."
 tm_seidr.0003.a:0 "Answer him in verse, and make him the joke."
 tm_seidr.0003.a.win:0 "The hall laughed with you, and at him"
 tm_seidr.0003.a.lose:0 "The verse fell flat"
 tm_seidr.0003.b:0 "Answer him with steel."
 tm_seidr.0003.c:0 "Let him talk."

 # ---------------- Jade Embryo events ----------------
 tm_embryo.0001.t:0 "The Guarantor's Question"
 tm_embryo.0001.desc:0 "The nüguan will not begin until I have set down the offerings: a white candle, a handkerchief, and incense shaped like a dragon. My guarantor has vouched, not for my sincerity, she says, but for the house that will shelter me while the embryo grows. Then she asks the question the knifers ask, though she will use no knife: will I ever repent? It is asked for my sake, not the guan's. No answer turns me away."
 tm_embryo.0001.a:0 "I will not repent."
 tm_embryo.0001.a.tt:0 "Begin ten months of gestation. Dangers will come in the third and sixth months, the two bathings."
 tm_embryo.0001.b:0 "Not yet."
 tm_embryo.0010.t:0 "The First Bathing"
 tm_embryo.0010.desc:0 "Three months in, and the embryo has formed. The books call this the first bathing: guard yourself against dangers. Then a censor arrives with the clergy roll. I am not on it, and an unregistered nun is a private nun. If he strikes me off, the palace will count me among its men."
 tm_embryo.0010.a:0 "Hold the stillness. Let him wait at the gate."
 tm_embryo.0010.b:0 "My sisters will stand at the gate for me."
 tm_embryo.0011.t:0 "The White Tiger"
 tm_embryo.0011.desc:0 "Six months in, the second bathing. I am taming the White Tiger, the work the masters set for a body like the one I was given, and the embryo is quiet. Then a letter comes from home. My family wants me back to marry and keep the ancestral rites."
 tm_embryo.0011.a:0 "Tame the tiger, and leave the letter unanswered."
 tm_embryo.0011.b:0 "My guarantor will answer for the house that shelters me."
 tm_embryo.trial_kept:0 "The embryo holds"
 tm_embryo.0012.t:0 "Born from the Crown"
 tm_embryo.0012.desc:0 "In the tenth month the embryo is complete. On the last night the nüguan holds my head between her hands, there is a sound like a bell at the crown, and I am born out of myself."
 tm_embryo.0012.a:0 "I am here."
 tm_embryo.0002.t:0 "A Name Before Witnesses"
 tm_embryo.0002.desc:0 "The witnesses have gathered so that my name can be set right. Whatever they write in the register now is what I am."
 tm_embryo.0002.a:0 "Write the name of a daughter."
 tm_embryo.0002.b:0 "I keep the name I carry."
 tm_embryo.0002.c:0 "The old name will serve for now."
 tm_gestating_modifier:0 "Gestating the Jade Embryo"
 tm_gestating_modifier_desc:0 "This character is in the ten months of inner gestation."

 # Cast-out women (Bhatt: the "third sex" is a dumping-ground for all the reproductive order discards)
 tm_arrival.0003.t:0 "Turned Out"
 tm_arrival.0003.desc:0 "A woman stands at the gate with a bundle and nothing else. Her husband's family sent her away when it was clear she would bear no children, and her own father would not take her back. Someone on the road told her that the Sisters do not ask what a woman is for."
 tm_arrival.0003.a:0 "Then she has a place here."
 tm_arrival.0003.b:0 "She has a place here, and a mother."
 tm_arrival.0003.c:0 "We cannot take her in. Tell her where the next House is."
 tm_adopt_ai_cast_out:0 "Cast out for her barrenness"
 tm_found_house_decision:0 "Found a Sisters' House"
 tm_found_house_decision_desc:0 "Give the Sisters a House in my capital county: a hearth for the Marked, for daughters, for every woman turned out because she bore no son, and for any friend of the faith who will help keep it. The House will belong to the county, not to me, and it will choose its own Elder Sister."
 tm_found_house_decision_tooltip:0 "Found a Sisters' House in your capital county."
 tm_found_house_decision_confirm:0 "Let them come"
 tm_found_house_decision_effect_tt:0 "Your capital county gains a Sisters' House:\n- Marked travellers arrive at your court far more often\n- Unlocks the decision #V Send to the Houses#!\n- The House chooses an Elder Sister every five years, and splits to found a new House when it is under strain\n- The House belongs to the county: whoever holds it after you may let it stand or close it"
 tm_refuge.0010.desc_young_declines:0 "\n\n[tm_cand_young.GetFirstName] sends her thanks, but she would rather stay where she has friends."
 tm_refuge.0010.desc_elder_declines:0 "\n\n[tm_cand_elder.GetFirstName] sends her thanks, but her House needs her more than my court does."
 tm_arrival.0004.t:0 "A Friend of the House"
 tm_arrival.0004.desc:0 "[tm_friend.GetFirstName] keeps the faith, and is not Marked and never will be. [tm_friend.GetSheHe|U] has come anyway, to carry water and mend roofs and stand at the door when there is trouble. The Elder Sister says the House has never had too many hands."
 tm_arrival.0004.a:0 "Stay as the House's guest."
 tm_arrival.0004.b:0 "Another House needs you more."
 tm_embryo.0010.c:0 "Pay him to forget the road to my door."
 tm_embryo.0010.d:0 "Set the work down for now."
 tm_embryo.0011.c:0 "Set the work down for now."
 tm_embryo.trial_delayed:0 "The work is interrupted; the embryo waits, and the trial will come again"
 tm_seidr.0003.d:0 "Seiðr is women's art. I am a woman, and I do it."
 tm_declare_decision:0 "Declare Before Witnesses"
 tm_declare_decision_desc:0 "Stand before the Sisters and say what I am. The name is mine from today, whatever my body does next."
 tm_declare_decision_tooltip:0 "Take a daughter's name before witnesses."
 tm_declare_decision_confirm:0 "Say it"
 tm_house.0001.t:0 "Before Witnesses"
 tm_house.0001.desc:0 "The sisters have gathered. Nobody here will test me or ask me to prove anything. They only want to know what to call me."
 tm_house.0001.a:0 "Give me a name of the House."
 tm_house.0001.b:0 "Call me what I already call myself."
 tm_house.0001.c:0 "Not yet."
 tm_house.0010.t:0 "The Sisters Choose"
 tm_house.0010.desc:0 "The women of the House have named three of their number, and the lot has fallen on [tm_new_elder.GetFirstName] to keep it for the next five years. Nobody asked me, and that is the custom."
 tm_house.0010.a:0 "May she keep it well."
 tm_house.0010.b:0 "Thank [tm_old_elder.GetFirstName] for her years."
 tm_house.0020.t:0 "The Little Work"
 tm_house.0020.desc:0 "[tm_elder.GetFirstName] has been doing all of it: the accounts, the kitchen, the quarrels, the nights with whoever cannot sleep. Nobody has noticed, because the House keeps running. She is close to breaking."
 tm_house.0020.a:0 "See her, and send help."
 tm_house.0020.b:0 "Ask the sisters to share the work."
 tm_house.0020.c:0 "She has always managed."
 tm_house.0030.t:0 "The House Divides"
 tm_house.0030.desc:0 "The House is too full and too tired to hold together. Some of the sisters have decided to go and found a new House in [tm_new_house_county.GetName]. Nobody is angry. This is how Houses grow."
 tm_house.0030.desc_crowded:0 "The House is too full and too tired to hold together, and there is nowhere nearby for some of the sisters to go and start again. They will crowd in a while longer."
 tm_house.0030.a:0 "Go well."
 tm_house.0040.t:0 "Let Them Tend You"
 tm_house.0040.desc:0 "The sisters of the House have noticed how tired I am. They want to feed me, sit with me, and make me rest. It would be easier to send them gold and be thanked."
 tm_house.0040.a:0 "Let them."
 tm_house.0040.b:0 "Send coin instead."
 tm_house.0050.t:0 "A House in My Lands"
 tm_house.0050.desc:0 "There is a House of the Sisters in [tm_house_county.GetName], and it is mine to deal with now. They ask for nothing but to be let alone."
 tm_house.0050.a:0 "Let it stand."
 tm_house.0050.b:0 "Close it. They can go elsewhere."
 tm_sisters_house_county_modifier:0 "Sisters' House"
 tm_sisters_house_county_modifier_desc:0 "A House of the Sisters stands in this county."
 tm_declared_modifier:0 "Named Before Witnesses"
 tm_declared_modifier_desc:0 "This character has said what she is before the Sisters."
 tm_elder_sister_modifier:0 "Elder Sister"
 tm_elder_sister_modifier_desc:0 "Chosen by the women of a House to keep it for five years."
 tm_tended_modifier:0 "Tended by the House"
 tm_tended_modifier_desc:0 "The sisters of a House have looked after this character."
 tm_house_friend_modifier:0 "Friend of the House"
 tm_house_friend_modifier_desc:0 "A guest of the Sisters' House, keeping the faith alongside them."
 tm_sisters_elective_succession_law:0 "The Sisters Choose"
 tm_sisters_elective_succession_law_effects:0 "The [ruler|E], the faith's [clergy|E], and the ruler's direct vassals of the faith choose a [title_heir|E] from among the ruler's children (born or adopted), the women of the faith on the [council|E], and the vassals of the faith. Daughters and Elder Sisters are favoured."
 tm_sisters_elective_candidates:0 "Daughters, Councillors, and Vassals"
 tm_sisters_elective_candidates_tooltip:0 "In order to be a valid Candidate under The Sisters Choose, a character must fulfill one of the following conditions:\n$EFFECT_LIST_BULLET$Be a child of the current ruler, born or adopted\n$EFFECT_LIST_BULLET$Be a woman of the ruler's faith on the [council|E]\n$EFFECT_LIST_BULLET$Be a direct vassal of the ruler's faith"
 tm_sisters_elective_electors:0 "The Ruler, the Clergy, and the Faithful Vassals"
 tm_sisters_elective_electors_tooltip:0 "In order to be a valid [elector|E] under The Sisters Choose, a character must be adult, not Incapable, and one of:\n$EFFECT_LIST_BULLET$The ruler\n$EFFECT_LIST_BULLET$A direct vassal of the ruler's faith\n$EFFECT_LIST_BULLET$[clergy|E] of the ruler's faith"
 tm_seidr.0010.t:0 "The Völva Comes"
 tm_seidr.0010.desc:0 "[tm_volva.GetFirstName] has come to the hall. Custom says the household meets her at the door, gives her the high seat with its cushion of hen's feathers, and feeds her a porridge of kid's milk and a dish of the hearts of every animal on the farm. Tomorrow she will go up onto the platform."
 tm_seidr.0010.a:0 "Set out the high seat and the feast."
 tm_seidr.0010.b:0 "Plain hospitality will have to do."
 tm_seidr.0010.c:0 "Not this winter."
 tm_seidr.0011.t:0 "The Warding Songs"
 tm_seidr.0011.desc:0 "Before the völva can go into trance, someone must sing the warding songs, the varðlokkur, that keep her while she is away. Girls learn them from their foster-mothers, and few women know them now."
 tm_seidr.0011.a:0 "[tm_singer_known.GetFirstName] knows them."
 tm_seidr.0011.b:0 "Ask [tm_singer_reluctant.GetFirstName]. She learned them as a girl."
 tm_seidr.0011.b.yes:0 "She sang them, and sang them well"
 tm_seidr.0011.b.no:0 "She would not sing them"
 tm_seidr.0011.c:0 "The women will hum what they remember."
 tm_seidr.0002.d:0 "Fasten a name with a gift."
 tm_seidr.0002.e:0 "The woman's form of my own name."
 tm_seidr.0003.e:0 "Ragr is said of men. It does not reach me."
 tm_seidr.0020.t:0 "A Völva on the Winter Road"
 tm_seidr.0020.desc:0 "A seeress is travelling the halls this winter, as the old seeresses always have, from farm to farm with her staff and her songs. [tm_volva.GetFirstName] has come to my door."
 tm_seidr.0020.a:0 "Ask her to sit for me."
 tm_seidr.0020.b:0 "Ask her to sit for [tm_seeker_courtier.GetFirstName]."
 tm_seidr.0020.c:0 "Feast her and hear what she sees."
 tm_seidr.0020.d:0 "Send her on her road."
 tm_house.0001.d:0 "The woman's form of my own name."
 tm_teach_vardlokkur_interaction:0 "Teach the Warding Songs"
 tm_teach_vardlokkur_interaction_desc:0 "Teach [recipient.GetFirstName] the varðlokkur, the songs that keep a völva while she is in trance, as a foster-mother teaches a foster-daughter."
 tm_nidhoggr:0 "Níðhöggr"
 tm_nidhoggr_possessive:0 "Níðhöggr's"
 tm_knife.0004.t:0 "The Hilaria"
 tm_knife.0004.desc:0 "The mourning is over and the House is full of flowers. The Elder Sister who will hold the knife has taken my surety and my offering: a white candle, a cloth, a cup of wine. The physician has written in her book that this is done for health, as the law of the Emperor Leo allows. Then she asks what the knifers have always asked. Will I ever repent?"
 tm_knife.0004.a:0 "Never."
 tm_knife.0004.b:0 "Not today."
 tm_parakoimomene_court_position:0 "Parakoimomene"
 tm_parakoimomene_court_position_desc:0 "She sleeps beside the ruler's chamber and keeps it. At the Emperor's court the office was reserved for eunuchs; the Sisters give it to a daughter."
 tm_protovestiaria_court_position:0 "Protovestiaria"
 tm_protovestiaria_court_position_desc:0 "Keeper of the wardrobe and the privy purse. An office the court gave to its eunuchs and to the empress's women."
 tm_papias_court_position:0 "Papias"
 tm_papias_court_position_desc:0 "Keeper of the palace keys: who comes in, and who goes out, and when the gates are shut."
 tm_praiposita_court_position:0 "Praiposita"
 tm_praiposita_court_position_desc:0 "Mistress of the empress's chamber and the women of the court, appointed with the same rite and words as the court's eunuchs."
 holy_site_tm_pepouza_name:0 "Pepouza"
 holy_site_tm_pepouza_effects:0 "The ruined city where the prophetesses Priscilla and Maximilla said the New Jerusalem would come down."
 tm_name_companion_interaction:0 "Name a Companion"
 tm_name_companion_interaction_desc:0 "Name [recipient.GetFirstName] a Companion of the Mother of Mothers, as the prophetesses of Pepouza had their companions: one of seven who stand between the Mother and the Houses."
 tm_companions_full:0 "The Mother of Mothers already has seven Companions"
 tm_companion_modifier:0 "Companion of the Mother"
 tm_companion_modifier_desc:0 "One of the seven Companions of the Mother of Mothers."
 tm_byz.0001.t:0 "Cybele in Christian Clothes"
 tm_byz.0001.desc:0 "A bishop has preached against us before the whole province. The Sisters, he says, are the Mother of the Gods in Christian clothes, and their Elder Sisters are her castrated priests, as Montanus was in his day. The people are waiting for an answer."
 tm_byz.0001.a:0 "We took one thing from the Mother: that her daughters are not men. Everything else we left at Pessinus."
 tm_byz.0001.b:0 "The Emperor's own law counts three kinds of people. We only agree with him."
 tm_byz.0001.c:0 "Yes. The Mother was ours before she was yours."
 tm_byz.0001.d:0 "We are Christians, and we will say so as often as we must."
 tm_byz.0010.t:0 "The Books"
 tm_byz.0010.desc:0 "Under the old laws against heretics, the bishop's men have come for the Sisters' books: the sayings of the prophetesses, the Day of Blood liturgy, the House registers. They mean to burn them in the square."
 tm_byz.0010.a:0 "Copy them first, then let them burn."
 tm_byz.0010.b:0 "Hide them."
 tm_byz.0010.b.hidden:0 "The books were not found"
 tm_byz.0010.b.found:0 "The books were found, and so was my part in hiding them"
 tm_byz.0010.c:0 "Hand them over."
 tm_byz.0011.t:0 "The Assemblies"
 tm_byz.0011.desc:0 "A decree forbids the Sisters to gather: no assemblies, no Day of Blood, no meetings in the Houses. Anyone who opens a door to them may lose the house."
 tm_byz.0011.a:0 "We will meet in secret."
 tm_byz.0011.b:0 "We will meet in the open, and let them come."
 tm_byz.0011.c:0 "We will obey, for now."
 tm_byz.0012.t:0 "The Wills"
 tm_byz.0012.desc:0 "The bishops' court has found a law of the old emperors: a heretic's will is void, and the estate goes to orthodox kin. Under that law every daughter I adopted inherits nothing."
 tm_byz.0012.a:0 "Register every adoption with the Emperor's court, whatever it costs."
 tm_byz.0012.b:0 "Conform outwardly, and keep the faith at home."
 tm_byz.0012.c:0 "Let them try to take it."
 tm_outward_conformity_modifier:0 "Outward Conformity"
 tm_outward_conformity_modifier_desc:0 "This character keeps the forms of the orthodox Church in public and the Sisters' faith at home."
 tm_contested_inheritance_modifier:0 "Contested Inheritance"
 tm_contested_inheritance_modifier_desc:0 "The bishops' court says this daughter's inheritance is void under the laws against heretics."
 tm_house_protectress_modifier:0 "Protectress of the House"
 tm_house_protectress_modifier_desc:0 "She guards a Sisters' House against its lord, as the founder's line guarded a convent in the old charters. She may not touch its goods or choose its sisters."
 tm_foster_daughter_interaction:0 "Foster as Daughter"
 tm_foster_daughter_interaction_desc:0 "Take [recipient.GetFirstName] into the House as a foster-daughter. She belongs, but she does not inherit unless a later clause names her heir."
 tm_fostered_modifier:0 "Foster-Daughter"
 tm_fostered_modifier_desc:0 "Fostered by a woman of the House. She belongs to it, but she is not named an heir."
 tm_islamic_daughter_opinion:0 "A Castrated Man in Law"
 tm_isl.0001.t:0 "The Khasi of the Household"
 tm_isl.0001.desc:0 "[tm_isl_daughter.GetFirstName] keeps my household. The jurists say she is a castrated man and the jesters call her a mukhannath. My women trust her, and the keys are in her hands. Whether I trust her is for me to decide."
 tm_isl.0001.a:0 "Trust her with the household."
 tm_isl.0001.b:0 "Keep her at arm's length."
 tm_isl.0002.t:0 "Laughed At in the Hall"
 tm_isl.0002.desc:0 "My envoys have come back from the court of [tm_isl_court.GetTitledFirstName]. They were received, and then the court's jester, a shaven man paid to be laughed at, was set to mimic me before the whole hall and show them the man they say I am."
 tm_isl.0002.a:0 "Laugh with them. It costs nothing."
 tm_isl.0002.b:0 "Send a gift, and a verse that answers the jester."
 tm_isl.0002.c:0 "Remember it."
 holy_site_tm_nanyue_name:0 "The Southern Marchmount"
 holy_site_tm_nanyue_effects:0 "Mount Heng in Hunan, the holy women's mountain"
 tm_embryo.0011.d:0 "Not yet! Don't rush me!"
 tm_embryo.0011.e:0 "I will go home and nurse my parents, and come back to the work after."
 tm_embryo.0013.t:0 "A Ghost Fetus"
 tm_embryo.0013.desc:0 "A physician has heard what I am doing and come to the guan uninvited. He calls it a ghost fetus, a false pregnancy of the kind that troubles women without husbands, and he has brought a purge to drop it."
 tm_embryo.0013.a:0 "Send him away."
 tm_embryo.0013.b:0 "Let the nüguan answer him."
 tm_embryo.0013.c:0 "Take his purge, to be rid of him."
 tm_purged_modifier:0 "Purged"
 tm_purged_modifier_desc:0 "This character took a physician's purge for a "ghost fetus". The embryo held; the body did not thank her."
 tm_xiwangmu:0 "the Queen Mother of the West"
 tm_xiwangmu_possessive:0 "the Queen Mother of the West's"
 tm_metal_mother:0 "the Metal Mother"
 tm_metal_mother_possessive:0 "the Metal Mother's"
 tm_name_panel_decision:0 "Petition for a Name-Panel"
 tm_name_panel_decision_desc:0 "Ask the throne to grant my temple houses a name-panel. A house with a name is a house the magistrates do not count."
 tm_name_panel_decision_tooltip:0 "Protect your Sisters' Houses from confiscation and closure."
 tm_name_panel_decision_confirm:0 "Send the petition"
 tm_name_panel_decision_effect_tt:0 "Every Sisters' House you hold is named by the throne: confiscation passes it by, and a lord who closes it pays in prestige."
 tm_righteous_store_decision:0 "Borrow from the Righteous Store"
 tm_righteous_store_decision_desc:0 "The society keeps a store of grain and oil for lean years, and lends it, as the societies of Dunhuang did, at half again."
 tm_righteous_store_decision_tooltip:0 "Borrow 100 gold now; repay 150 in a year."
 tm_righteous_store_decision_confirm:0 "Borrow"
 tm_righteous_store_decision_effect_tt:0 "In a year the store will ask for 150 gold. If you cannot pay, your Houses will bear the strain."
 tm_store_loan_outstanding:0 "You already owe the righteous store"
 tm_relight_shenquan_decision:0 "Relight the Shenquan Abbey"
 tm_relight_shenquan_decision_desc:0 "Dunhuang once had Daoist abbeys and priestesses in them. Under the Tibetans the lamps went out. Light them again, and give the nüguan a house."
 tm_relight_shenquan_decision_tooltip:0 "Restore the Daoist abbey at Dunhuang."
 tm_relight_shenquan_decision_confirm:0 "Light the lamps"
 tm_shenquan_abbey_modifier:0 "Shenquan Abbey"
 tm_shenquan_abbey_modifier_desc:0 "The Daoist abbey at Dunhuang is lit again, and its nüguan keep the Way."
 tm_ordain_by_edict_interaction:0 "Ordain by Special Edict"
 tm_ordain_by_edict_interaction_desc:0 "Ordain [recipient.GetFirstName] a nüguan by special edict, as the Song court once ordained a bearded woman. What the throne names, no magistrate may rename."
 tm_ordained_modifier:0 "Ordained by Edict"
 tm_ordained_modifier_desc:0 "Ordained a nüguan by the throne's special edict."
 tm_eastern_daughter_opinion:0 "A Man Become a Woman"
 tm_eastern_knife_opinion:0 "Unmanned by the Knife"
 tm_yutai.0001.t:0 "A Prodigy in the Prefecture"
 tm_yutai.0001.desc:0 "A magistrate writes that in a village of my lands a man has become a woman. The omen books say such things happen when yin overcomes yang, when the court castrates too freely or its women grow too strong. They say nothing about the woman herself, who is waiting at the yamen to learn what will be done with her."
 tm_yutai.0001.a:0 "Report it up the chain, as the law requires."
 tm_yutai.0001.b:0 "Hold the report."
 tm_yutai.0001.b.quiet:0 "No one asked about it again"
 tm_yutai.0001.b.found:0 "A secret inspector found the report I held"
 tm_yutai.0001.c:0 "Ordain her in the Way."
 tm_yutai.0001.d:0 "Send her to the nearest House."
 tm_yutai.0010.t:0 "The Magistrate's Inventory"
 tm_yutai.0010.desc:0 "A magistrate has come with clerks and a ledger. Temple houses without a name-panel from the throne are to be counted, and whatever lies above the permanent store is to go to the state."
 tm_yutai.0010.a:0 "Open the store to him."
 tm_yutai.0010.b:0 "Pay him to count slowly."
 tm_yutai.0010.c:0 "Hide the store."
 tm_yutai.0010.c.hidden:0 "The clerks counted an empty room"
 tm_yutai.0010.c.found:0 "The clerks found the store, and the hiding of it"
 tm_yutai.0020.t:0 "The Rescript of 882"
 tm_yutai.0020.desc:0 "The throne has issued a rescript naming Huang Lingwei, the Tang priestess the people called Miss Flower, a transcendent. She restored Lady Wei's altars at Linchuan with her own hands, and now the court admits what the women always said of her."
 tm_yutai.0020.a:0 "Keep a rite at her altars."
 tm_yutai.0020.b:0 "The court's honour is enough."
 tm_yutai.0030.t:0 "The Righteous Store"
 tm_yutai.0030.desc:0 "A year has passed, and the society's steward has come for what I borrowed from the righteous store, with the half again that is owed on it."
 tm_yutai.0030.a:0 "Repay it, with the interest."
 tm_yutai.0030.b:0 "Ask the sisters to wait."
 tm_yutai.0040.t:0 "The Society Buries a Sister"
 tm_yutai.0040.desc:0 "[tm_dead_sister.GetFirstName] has died. By the society's rules every member brings oil, flour and millet, and the sisters cover her in white and carry her themselves. The dues are owed."
 tm_yutai.0040.a:0 "Pay the dues, and walk with the bier."
 tm_yutai.0040.b:0 "The society will bear it."

 # --- Ha-Nehpakhot (faith_design.md §13) ---
 tm_nehpakhot:0 "Ha-Nehpakhot"
 tm_nehpakhot_adj:0 "Nehpakhot"
 tm_nehpakhot_adherent:0 "Nehpekhet"
 tm_nehpakhot_adherent_plural:0 "Nehpakhot"
 tm_nehpakhot_desc:0 "A small current among the women of the Jewish street of Arles, whose name means “the women who were turned”. The Talmud says that when Leah prayed, Dinah was turned into a daughter in her mother's womb; the Nehpakhot say they were turned as she was. The rabbis answer that what came forth male is male, and that one does not cite miracles. The sect keeps its gate at Purim, the day the scroll says “it was turned about”, and holds that only the hands of heaven turn, never a human hand, so it uses no knife. It claims Kalonymus ben Kalonymus, born at Arles, whose Touchstone (1322–23) asks, perhaps in jest, “would that You turn me from male to female”."
 tm_nehpakhot_rite:0 "Rite of the Fourteenth of Adar"
 tm_nehpakhot_rite_adj:0 "Nehpakhot"
 tm_nehpakhot_rite_adherent:0 "Nehpekhet"
 tm_nehpakhot_rite_adherent_plural:0 "Nehpakhot"
 tm_nehpakhot_rite_desc:0 "The main rite of Ha-Nehpakhot, kept in the Jewish street of Arles."
 tm_zekenah:0 "Zekenah"
 tm_zekenah_plural:0 "Zekenot"
 holy_site_tm_arles_name:0 "Arles"
 holy_site_tm_arles_effects:0 "The Jewish street of Arles, where Kalonymus ben Kalonymus was born and worked. Its women sit in their own synagogue, below the men's, and the Nehpakhot keep the alms of its lamp."
 holy_site_tm_narbonne_name:0 "Narbonne"
 holy_site_tm_narbonne_effects:0 "The great Jewish community of the Midi, whose nasi held houses and fields of his own, under no lord."
 holy_site_tm_montpellier_name:0 "Montpellier"
 holy_site_tm_montpellier_effects:0 "The translators' country, from Lunel to Montpellier, where the learning of the Arabs was put into Hebrew."
 tenet_tm_turning_name:0 "The Turning"
 tenet_tm_turning_desc:0 "The rabbis divide the eunuch made by the hands of heaven from the one made by human hands. The Nehpakhot ask to be turned by the first. At Purim, when the scroll says “it was turned about”, she asks aloud to be turned from male to female, as Leah asked for Dinah. The knife is a human hand, and the sect does not use it; it does not say the knife's daughters are less for it."
 tenet_tm_three_lamps_name:0 "The Three Lamps"
 tenet_tm_three_lamps_desc:0 "Three commandments belong to women: the days of separation, the portion of the dough, and the Sabbath lamp. The Nehpakhot hold that a woman is known by what she keeps, week after week, and they keep all three. One whose days do not come keeps them as the zekenah keeps them, the old woman whose days have ended."
 tenet_tm_three_lamps_opinion:0 "The Three Lamps"
 doctrine_parameter_tm_turning_gate:0 "Men may pray at Purim to be turned, and rise as daughters"
 doctrine_parameter_tm_personal_turning_easier:0 "The Turning costs you half the usual @piety_icon![piety|E]"
 doctrine_parameter_tm_three_lamps:0 "Daughters keep the three women's commandments"
 trait_tm_daughter_of_the_turning:0 "Daughter of the Turning"
 trait_tm_daughter_of_the_turning_desc:0 "This character prayed aloud at Purim to be turned from male to female, and the Nehpakhot say she was turned, as Dinah was. The rabbis say one does not cite miracles."
 tm_niddui_modifier:0 "Niddui"
 tm_niddui_modifier_desc:0 "The elders of the community have set this character apart. Her own people keep their distance until the sentence is lifted."
 tm_three_lamps_modifier:0 "The Three Lamps"
 tm_three_lamps_modifier_desc:0 "This character has kept the days, the dough and the Sabbath lamp."
 tm_spinning_circle_modifier:0 "The Spinning Circle"
 tm_spinning_circle_modifier_desc:0 "The women spin by moonlight and tell one another stories, and this character sits among them."
 tm_translation_patron_modifier:0 "Patron of a Translation"
 tm_translation_patron_modifier_desc:0 "This character paid for a book to be put into a new tongue, and took the translator's people under protection."
 tm_jewish_daughter_opinion:0 "What Came Forth Male"
 tm_turned_sister_opinion:0 "Turned, as Dinah Was"
 tm_liege_joined_sisters_opinion:0 "Turned Faith on a Courtier's Word"
 tm_ruled_a_man_opinion:0 "Ruled Me a Man"
 tm_turning_decision:0 "Keep the Fourteenth of Adar"
 tm_turning_decision_desc:0 "At Purim the scroll is read, the young men play the fool, and the women listen in their own synagogue, below the men's. Keep the feast with the women of the lamp, and pray aloud to be turned."
 tm_turning_decision_tooltip:0 "Begin the rite of the Turning."
 tm_turning_decision_confirm:0 "Go to the women's gallery"
 tm_turning_decision_adar_tt:0 "It is Adar (February or March)"
 tm_hipukh.0010.t:0 "The Scroll"
 tm_hipukh.0010.desc:0 "It is the fourteenth of Adar. In the women's synagogue, the room below the men's, [tm_zekenah.GetFirstName], an elder among the women of the lamp, reads the scroll of Esther and explains it in the common tongue. At the verse “it was turned about” she stops and reads the other turnings: Abraham from the furnace, the staff to a serpent, the sea to dry land, and Dinah in her mother's womb."
 tm_hipukh.0010.a:0 "Go down to the women's synagogue."
 tm_hipukh.0010.b:0 "Go up to the men's synagogue, as I always have."
 tm_hipukh.0010.c:0 "Not this Adar."
 tm_hipukh.0011.t:0 "The Revel"
 tm_hipukh.0011.desc:0 "In the afternoon the young men of the street run riot. They put on women's anklets and necklaces, one sets a basket on his head for a hat, and one puts on a woman's dress for the joke. The rabbis grumble and let it pass. I am wearing the dress too, and [tm_zekenah.GetFirstName] has seen that for me it is not a joke."
 tm_hipukh.0011.desc_early:0 "In the afternoon the street keeps the feast with wine and gifts to the poor. No one else has put on a woman's dress. I have, under my cloak, and [tm_zekenah.GetFirstName] has seen it."
 tm_hipukh.0011.a:0 "Keep the dress on when the joke is over."
 tm_hipukh.0011.b:0 "Laugh with the others. It is only Purim."
 tm_hipukh.0011.c:0 "Take the dress off."
 tm_hipukh.0001.t:0 "The Prayer"
 tm_hipukh.0001.desc:0 "After the feast the women of the lamp gather, and [tm_zekenah.GetFirstName] tells me what the Talmud says: Leah prayed, and Dinah was turned into a daughter in her mother's womb. Every morning the men thank God that He did not make them women. I will ask aloud, for myself, for what they thank Him for withholding."
 tm_hipukh.0001.desc_touchstone:0 "After the feast the women of the lamp gather, and [tm_zekenah.GetFirstName] tells me what the Talmud says: Leah prayed, and Dinah was turned into a daughter in her mother's womb. Then she reads from the Touchstone of Kalonymus of Arles: “would that You turn me from male to female”. He said the men's blessing afterwards in a low voice. The learned call it a jest; the women of the lamp say he meant it. I will not pray in a low voice."
 tm_hipukh.0001.a:0 "Say it aloud: “turn me from male to female.”"
 tm_hipukh.0001.a.success:0 "The prayer was answered. “Not by a human hand,” the elder says."
 tm_hipukh.0001.a.failure:0 "Not this Adar. Leah's prayer, too, was answered in its own time"
 tm_hipukh.0002.t:0 "A Name for Shushan Purim"
 tm_hipukh.0002.desc:0 "The feast runs into a second day, as the scroll allows. In the morning the women teach me their blessing, and I say it with them: not “who did not make me a woman”, but “who made me a woman”. Now they say a turned woman needs a name of her own, and they are waiting to hear what they should call me."
 tm_hipukh.0002.desc_provence:0 "The feast runs into a second day, as the scroll allows. In the morning the women teach me their blessing in our own tongue, and I say it with them: “qui fis me fenna”, who made me a woman. Now they say a turned woman needs a name of her own, and they are waiting to hear what they should call me."
 tm_hipukh.0002.a:0 "A name from the scroll and the Torah."
 tm_hipukh.0002.d:0 "A name of the street, as the women here are called."
 tm_hipukh.0002.b:0 "I keep the name I carry."
 tm_hipukh.0002.c:0 "The old name will serve for now."
 tm_hipukh.0003.t:0 "Before the [ROOT.Char.Custom('tm_kahal_judges_title')]"
 tm_hipukh.0003.desc:0 "Purim is over, and I am still wearing the dress. The rabbis grumble at it even for one day's merriment, and here it is [ROOT.Char.Custom('tm_kahal_judges')] who judge. Now they have called me before them. One says that what came forth male is male, and no dress can change it; another, that one does not cite miracles."
 tm_hipukh.0003.desc_early:0 "Purim is over, and I have not put the dress away. No one else in the street wore one, even at the feast. Now [ROOT.Char.Custom('tm_kahal_judges')] have called me before them. One says that what came forth male is male, and no dress can change it; another, that one does not cite miracles."
 tm_kahal_judges_worthies:0 "the worthies of the street"
 tm_kahal_judges_rectors:0 "the rectors of the street"
 tm_kahal_judges_baylons:0 "the baylons"
 tm_kahal_judges_council:0 "the baylons and the council of the street"
 tm_kahal_judges_worthies_cap:0 "The worthies of the street"
 tm_kahal_judges_rectors_cap:0 "The rectors of the street"
 tm_kahal_judges_baylons_cap:0 "The baylons"
 tm_kahal_judges_council_cap:0 "The baylons and the council"
 tm_kahal_judges_worthies_title:0 "Worthies"
 tm_kahal_judges_rectors_title:0 "Rectors"
 tm_kahal_judges_baylons_title:0 "Baylons"
 tm_hipukh.0003.desc_council:0 "Purim is over, and I am still wearing the dress. The baylons have called me before the council of the street, and they have called its women too, as is the custom here: what touches all must be approved by all. One says that what came forth male is male, and no dress can change it; another, that one does not cite miracles."
 tm_hipukh.0003.a:0 "Answer with Dinah, text against text."
 tm_hipukh.0003.a.win:0 "[ROOT.Char.Custom('tm_kahal_judges_cap')] had no answer, and let it stand"
 tm_hipukh.0003.a.lose:0 "[ROOT.Char.Custom('tm_kahal_judges_cap')] set you apart"
 tm_hipukh.0003.b:0 "The Touchstone says the young men put on the dress every Adar. I only kept it on."
 tm_hipukh.0003.c:0 "“I am the lady of the house.” Let them shun me."
 tm_hipukh.0003.d:0 "Put the dress away until next Adar."
 tm_hipukh.0020.t:0 "The Three Lamps"
 tm_hipukh.0020.desc:0 "It is Friday evening. The dough has been portioned and the lamp is trimmed. The three commandments the women keep are mine to keep now."
 tm_hipukh.0020.a:0 "Light the lamp, and keep the days."
 tm_hipukh.0020.b:0 "Spin with the women by moonlight."
 tm_hipukh.0020.c:0 "Teach the prayer to [tm_hevrah_pupil.GetFirstName]."
 tm_hipukh.0030.t:0 "A Book in Arabic"
 tm_hipukh.0030.desc:0 "[tm_translator.GetFirstName] of my court reads Arabic and writes Hebrew and the common tongue. She has offered to put a book of physic, or of the philosophers, into a language my scholars can read, as the Jews of Provence have done for princes before."
 tm_hipukh.0030.a:0 "Commission it, and take her people under my protection."
 tm_hipukh.0030.b:0 "Pay for the book, nothing more."
 tm_hipukh.0030.c:0 "I have no use for it."
 tm_hipukh.0040.t:0 "What Came Forth Male"
 tm_hipukh.0040.desc:0 "My rabbis ask me to rule on [tm_jewish_daughter.GetFirstName]. They say that what came forth male is male, and that a body made by human hands is still a man's. Her friends answer that Dinah was turned in her mother's womb. The rabbis reply that one does not cite miracles."
 tm_hipukh.0040.a:0 "“What came forth male is male.”"
 tm_hipukh.0040.b:0 "“One does not cite miracles. But she keeps her place.”"
 tm_hipukh.0040.c:0 "Let the worthies of the town decide."
 tm_turning_niddui_refused:0 "The lord would not license the ban, and the sentence fell"
 Mairona:0 "Mairona"
 tm_hipukh.0031.t:0 "A Fisica at Court"
 tm_hipukh.0031.desc:0 "[tm_fisica.GetFirstName] of my court has learned the physician's art, and the women of the household already send for her. The notaries would write fisica after her name if my seneschal gave her a licence. Without one she may be fined for practising, as a woman physician of Provence once was."
 tm_hipukh.0031.a:0 "Licence her to practise."
 tm_hipukh.0031.b:0 "Licence her to treat women only."
 tm_hipukh.0031.c:0 "No licence."
 tm_fisica_licensed_modifier:0 "Licensed Fisica"
 tm_fisica_licensed_modifier_desc:0 "This character practises medicine under a lord's licence, and the notaries write fisica after her name."
 tm_fisica_women_modifier:0 "Fisica of Women"
 tm_fisica_women_modifier_desc:0 "This character is licensed to treat women, as the licences said women physicians were better suited to do."
 Venguessona:0 "Venguessona"
 Dulcia:0 "Dulcia"
 Bonafilia:0 "Bonafilia"
 Astruga:0 "Astruga"
 Estes:0 "Estes"
 Bella:0 "Bella"
 Gratiosa:0 "Gratiosa"
 Bonadonna:0 "Bonadonna"
 Steinunn:0 "Steinunn"
