l_english:
 tm_bd2.0001.t:0 "The Sister's Child"
 tm_bd2.0001.desc:0 "[tm_bd2_old.GetFirstName] is dead, and the seat is mine. I am the child of [tm_bd2_old.GetFirstName]'s sister. "
 tm_bd2.0001.desc_ghana:0 "At Ghana, they say, the king's heir is his sister's son, for a man is sure his sister's child is of his blood. "
 tm_bd2.0001.desc_ghana_past:0 "At Ghana, the old men say, the king's heir was his sister's son, in the days before its king prayed toward Mecca. "
 tm_bd2.0001.desc_end:0 "The father is everybody's; the mother is one's own. The jelimusow will sing my mother's name before mine."
 tm_bd2.0001.a:0 "My mother's name goes first."
 tm_bd2.0002.t:0 "The Sister's Line"
 tm_bd2.0002.desc:0 "[tm_bd2_old.GetFirstName] is dead, and the seat is mine. [tm_bd2_sisters_child.GetFirstName] is the child of [tm_bd2_old.GetFirstName]'s sister, and of the faith of the Mother's Children. "
 tm_bd2.0002.desc_faith:0 "Our House holds that the sister's child is close kin, and at Ghana, they say, the sister's son sits after his mother's brother. [tm_bd2_sisters_child.GetFirstName] has come to court to see how the new ruler will answer the sister's line."
 tm_bd2.0002.desc_faith_past:0 "Our House holds that the sister's child is close kin, as Ghana held in the days of its grove. [tm_bd2_sisters_child.GetFirstName] has come to court to see how the new ruler will answer the sister's line."
 tm_bd2.0002.desc_muslim:0 "Among the Mother's Children, they tell me, the sister's child is closer kin than any son. My jurist answers that the law of inheritance gives a man's estate to his own children, and that the old custom of the sister's son rested, as a geographer of Cordoba wrote, on a doubt about paternity. [tm_bd2_sisters_child.GetFirstName] has come to court to see how I will answer the sister's line."
 tm_bd2.0002.desc_other:0 "Among the Mother's Children, they tell me, the sister's child is closer kin than any son. [tm_bd2_sisters_child.GetFirstName] has come to court to see how I will answer the sister's line."
 tm_bd2.0002.a:0 "Give the sister's share in gold."
 tm_bd2.0002.b:0 "Honour the sister's line before the court."
 tm_bd2.0002.c:0 "The seat is mine. The belt is closer than the milk."
 tm_bd2.0002.c_muslim:0 "The law of inheritance gives the seat to me."
 tm_bd2.0010.t:0 "Hot Words"
 tm_bd2.0010.desc:0 "The realm is still hot, as they say of a time of change, and tempers are quick. [tm_bd2_hot_a.GetFirstName] and [tm_bd2_hot_b.GetFirstName] have quarrelled before the court, and neither will give way. A cool speaker could settle it without naming it, so that neither is shamed."
 tm_bd2.0010.a:0 "Let [tm_bd2_jeli.GetFirstName] speak of it coolly."
 tm_bd2.0010.b:0 "I will judge it myself, now."
 tm_bd2.0010.c:0 "Let it burn itself out."
 tm_bd2.0020.t:0 "Praise Before the Court"
 tm_bd2.0020.desc_king:0 "It is the afternoon of the feast. I sit on the dais under the parasol with the gold bird, and [tm_bd2_jeli.GetFirstName] the jelimuso rises to sing my line before the whole court. The bards come after her in their feather birds, and sing that those who sat here before me did good, and that I should do good, so that it is remembered."
 tm_bd2.0020.desc_king_early:0 "It is the afternoon of the feast. I sit on the dais, and the poet who speaks between me and the people stands beside it. Then [tm_bd2_jeli.GetFirstName] the jelimuso rises to sing my line before the whole court."
 tm_bd2.0020.desc_court:0 "It is the afternoon of the feast. The household has gathered, and [tm_bd2_jeli.GetFirstName] the jelimuso rises to sing my line, as the jelimusow of the House do."
 tm_bd2.0020.desc_mother:0 " She begins with my mother's name, [tm_bd2_ruler_mother.GetFirstName], before my own. A jelimuso's praise is paid, and paid before everyone."
 tm_bd2.0020.desc_nomother:0 " She begins with my mother's name, though few here remember it, and puts it before my own. A jelimuso's praise is paid, and paid before everyone."
 tm_bd2.0020.a:0 "Pay her before the whole court."
 tm_bd2.0020.b:0 "Pay what is owed, and hear her out."
 tm_bd2.0020.c:0 "Pay nothing."
 tm_bd2.0030.t:0 "Uninvited Praise"
 tm_bd2.0030.desc:0 "It is the eighth day, and the child is to be named. No one sent for a jeli, but a jelimuso of the House has come anyway. She stands in the yard and sings the name for everyone to hear: [tm_bd2_mother.GetFirstName]'s [tm_bd2_child.GetFirstName], the mother's name first. Now she waits to be paid."
 tm_bd2.0030.a:0 "Pay her."
 tm_bd2.0030.b:0 "Pay what I can, and let her make of it what she will."
 tm_bd2.0030.b.praise:0 "She sang it again as praise"
 tm_bd2.0030.b.satire:0 "She sang it again as a joke, and the yard laughed"
 tm_bd2.0030.c:0 "Send her away."
 tm_bd2_hot_realm_modifier:0 "A Hot Realm"
 tm_bd2_hot_realm_modifier_desc:0 "This ruler's realm has changed hands and is still hot. Tempers are quick until a cool word settles it."
 tm_bd2_cooled_realm_modifier:0 "The Realm Has Cooled"
 tm_bd2_cooled_realm_modifier_desc:0 "A jelimuso's cool word has settled this ruler's realm."
 tm_bd2_honoured_line_opinion:0 "Honoured the Sister's Line"
 tm_bd2_passed_over_line_opinion:0 "Passed Over the Sister's Line"
 tm_bd2_paid_praise_opinion:0 "Paid for My Praise"
 tm_bd2_unpaid_praise_opinion:0 "Would Not Pay for Praise"
 tm_bd2_cooled_words_opinion:0 "Cooled Our Quarrel"
 tm_bd2_hot_words_opinion:0 "Hot Words"
 tm_bd2_judged_against_opinion:0 "Judged Against Me"
 tm_bd2_name_associate_decision:0 "Name an Associate in Rule"
 tm_bd2_name_associate_decision_desc:0 "A traveller at Mali's court wrote that the king's chief wife was his associate in government, by the custom of the people, and that her name was said with his. Name your spouse, a sister, your mother or the woman who claimed you as your associate in rule."
 tm_bd2_name_associate_decision_tooltip:0 "Name a woman of your family, cis or trans, associate in rule."
 tm_bd2_name_associate_decision_confirm:0 "Name her"
 tm_bd2_name_associate_decision.tt:0 "You choose whom to name. Her name will be said with yours at the feast."
 tm_bd2_set_aside_associate_decision:0 "Set Aside My Associate in Rule"
 tm_bd2_set_aside_associate_decision_desc:0 "Her name will no longer be said with mine."
 tm_bd2_set_aside_associate_decision_tooltip:0 "End the honour. She keeps her own standing."
 tm_bd2_set_aside_associate_decision_confirm:0 "Set it aside"
 tm_bd2.0040.t:0 "Associate in Rule"
 tm_bd2.0040.desc:0 "At Mali, a traveller wrote, the king's chief wife shared his rule by the custom of the people, and her name was said with his. I may name a woman of my family to share mine. At every feast her name will be said after my own."
 tm_bd2.0040.desc_jurist:0 "\n\nMy qadi says it is a custom of this country, not of the law. The Muslims among my vassals will say the same."
 tm_bd2.0040.desc_end:0 ""
 tm_bd2.0040.a:0 "[tm_bd2_cand_spouse.GetFirstName], my spouse."
 tm_bd2.0040.b:0 "[tm_bd2_cand_sister.GetFirstName], my sister."
 tm_bd2.0040.c:0 "[tm_bd2_cand_mother.GetFirstName], my mother."
 tm_bd2.0040.d:0 "[tm_bd2_cand_claimer.GetFirstName], who claimed me as her mother's child."
 tm_bd2.0040.e:0 "Not yet."
 tm_bd2.0041.t:0 "Two Names at the Feast"
 tm_bd2.0041.desc:0 "It is the feast. My name is said before the court, and [tm_bd2_associate.GetFirstName]'s with it, as my associate in rule."
 tm_bd2.0041.a:0 "As it should be."
 tm_bd2.0042.t:0 "One Name at the Feast"
 tm_bd2.0042.desc:0 "[tm_bd2_former.GetFirstName] is dead. At the next feast only my name will be said."
 tm_bd2.0042.a:0 "I will remember hers."
 tm_bd2_associate_modifier:0 "Associate in Rule"
 tm_bd2_associate_modifier_desc:0 "This character shares the rule of her family's realm. Her name is said with the ruler's at the feast."
 tm_bd2_associate_vassal_opinion:0 "Associate in Rule"
 tm_bd2_associate_jurist_opinion:0 "A Custom of the Country, Not of the Law"
 tm_bd2_associate_set_aside_opinion:0 "Set Me Aside"
