l_english:
 # Spring the Cell
 tm_bae2_spring_cell:0 "Spring the Cell"
 tm_bae2_spring_cell_action:0 "Spring the Cell"
 tm_bae2_spring_cell_desc:0 "I will open [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]'s prison and walk our sisters out."
 tm_bae2_spring_cell_desc_general:0 "The $tm_bae2_spring_cell$ [scheme|E] is a [hostile_scheme|E] against a ruler who holds a daughter, a Marked woman, a novice or a declared sister in prison. It is a [secret_scheme|E] based on [intrigue|E], and its [agents|E] are Marked guards, servants in the jailer's own house, and friends of the House.\n\nOn success, every such prisoner walks free to the nearest Sisters' House, or else to the plotter's court. The jailer may never learn who opened the door."
 TM_BAE2_SPRING_CELL_SUCCESS_DESC:0 "Every daughter, Marked woman, novice and declared sister in [TARGET_CHARACTER.GetShortUIName]'s prison walks free, to the nearest Sisters' House or to your court."
 TM_BAE2_SPRING_CELL_DISCOVERY_DESC:0 "[TARGET_CHARACTER.GetShortUIName] does not learn who opened the door"
 tm_bae2_spring_cell_interaction:0 "Spring the Cell #weak (Scheme)#!"
 tm_bae2_spring_cell_interaction_desc:0 "[recipient.GetShortUIName|U] holds a sister in prison. Gather Marked guards, a servant inside the house, and friends of the House, and open the door."
 tm_bae2_spring_cell_notification:0 "Spring the Cell"
 tm_bae2_spring_cell_invalidated_title:0 "@scheme_icon! Spring the Cell Ends"
 tm_bae2_spring_cell_invalidated_tt:0 "There is no one left in that prison for us to free, or the way there is closed."
 tm_bae2_agent_join_sisters:0 "Of a Sisters' faith"
 tm_bae2_agent_join_marked:0 "Marked, a daughter, or declared"
 tm_bae2_agent_join_compassion:0 "Will not leave a woman in a cell"
 tm_bae2_cell_same_realm:0 "Prisons are guarded"
 tm_bae2_cell_house_near:0 "A Sisters' House is near the prison"
 tm_bae2_agent_guard:0 "Marked Guard"
 tm_bae2_agent_guard_i:0 "[success_chance_max_i]"
 tm_bae2_agent_guard_desc:0 "#WEAK A sword arm from among the Marked, the daughters, the declared or the faithful.#!\n$EFFECT_LIST_BULLET$ Provides [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Must be Marked, a daughter, declared, of the House, or of your faith\n$EFFECT_LIST_BULLET$ Requires [prowess_i] [prowess|E] & [intrigue_i] [intrigue|E]\n$EFFECT_LIST_BULLET$ #P Best#! if a [knight|E] of the jailer"
 tm_bae2_agent_inside_guard:0 "Guards the jailer's own hall"
 tm_bae2_agent_servant:0 "Faithful Servant"
 tm_bae2_agent_servant_i:0 "[secrecy_i]"
 tm_bae2_agent_servant_desc:0 "#WEAK Someone in the jailer's house who knows when the guard changes.#!\n$EFFECT_LIST_BULLET$ Provides [secrecy_i] [secrecy|E]\n$EFFECT_LIST_BULLET$ Must live at the jailer's court\n$EFFECT_LIST_BULLET$ Requires [intrigue_i] [intrigue|E] & [stewardship_i] [stewardship|E]\n$EFFECT_LIST_BULLET$ #P Best#! if of a Sisters' faith or Marked"
 tm_bae2_agent_faithful:0 "Keeps the faith in secret"
 tm_bae2_agent_friend:0 "Friend of the House"
 tm_bae2_agent_friend_i:0 "[scheme_speed_i]"
 tm_bae2_agent_friend_desc:0 "#WEAK A House member, a friend of the House, or a sworn sister.#!\n$EFFECT_LIST_BULLET$ Provides [scheme_speed_i] [scheme_speed|E]\n$EFFECT_LIST_BULLET$ Must be of a House, its friend, or your sworn sister\n$EFFECT_LIST_BULLET$ Requires [diplomacy_i] [diplomacy|E] & [intrigue_i] [intrigue|E]"
 tm_bae2_agent_sworn_sister:0 "Your sworn sister"

 tm_bae2.0001.t:0 "A Night for It"
 tm_bae2.0001.desc:0 "The guard at [tm_bae2_jailer.GetFirstNamePossessive] prison changes at the second bell, and tonight the man on the door drinks. [tm_bae2_freed.GetFirstName] is on the other side of it.\n\nWe could go tonight. Or we could wait, and know the house better."
 tm_bae2.0001.a:0 "Tonight."
 tm_bae2.0001.a.tt:0 "Roll the scheme's [scheme_success_chance|E]. Whether I am seen depends on its [secrecy|E]."
 tm_bae2.0001.b:0 "Not yet. Another night will come."
 tm_bae2.0001.b.tt:0 "The scheme goes on, and its odds may grow."

 tm_bae2.0010.t:0 "The Door Was Open"
 tm_bae2.0010.desc:0 "By morning the cell is empty. [tm_bae2_freed.GetFirstName] walked out between two of our people with a cloak over her head, and she is on the road to a House."
 tm_bae2.0010.desc.known:0 "\n\nSomeone saw my face. [tm_bae2_jailer.GetFirstName] will know whom to blame."
 tm_bae2.0010.desc.unknown:0 "\n\nNo one saw us. [tm_bae2_jailer.GetFirstName] can guess, but [tm_bae2_jailer.GetSheHe] cannot know."
 tm_bae2.0010.a:0 "She is out."

 tm_bae2.0011.t:0 "An Empty Cell"
 tm_bae2.0011.desc.known:0 "My prison is empty. The women I held are gone, and my guards name [tm_bae2_plotter.GetName] as the one who came for them."
 tm_bae2.0011.desc.unknown:0 "My prison is empty. The women I held are gone, the door is whole, and no one will say who opened it."
 tm_bae2.0011.a:0 "[tm_bae2_plotter.GetFirstName] will answer for this."
 tm_bae2.0011.b:0 "Double the guard."

 tm_bae2.0012.t:0 "The Door"
 tm_bae2.0012.desc:0 "Someone unbarred the door in the night and put a cloak over my shoulders. Outside there were horses, and women who called me sister. [tm_bae2_plotter.GetFirstName] sent them."
 tm_bae2.0012.a:0 "I will not forget it."

 tm_bae2.0020.t:0 "The Door Held"
 tm_bae2.0020.desc:0 "The man on the door did not drink tonight. We got as far as the yard before the dogs woke the house, and [tm_bae2_freed.GetFirstName] is still inside."
 tm_bae2.0020.desc.known:0 "\n\nWorse, they saw who led us. [tm_bae2_jailer.GetFirstName] knows my name now."
 tm_bae2.0020.desc.unknown:0 "\n\nNo one saw our faces. We can try again."
 tm_bae2.0020.a:0 "Let it go. For now."
 tm_bae2.0020.b:0 "We go again."

 tm_bae2.0021.t:0 "Footsteps in the Yard"
 tm_bae2.0021.desc.known:0 "Last night someone tried to break my prison and free the women in it. My guards caught sight of the leader: [tm_bae2_plotter.GetName]."
 tm_bae2.0021.desc.unknown:0 "Last night someone tried to break my prison and free the women in it. The dogs drove them off before anyone saw a face."
 tm_bae2.0021.a:0 "I will remember [tm_bae2_plotter.GetFirstName]."
 tm_bae2.0021.b:0 "Double the guard."

 # Outlawry
 tm_bae2.0100.t:0 "A Suit at Law"
 tm_bae2.0100.desc.seidr:0 "[tm_bae2_accuser.GetName] has brought the church's charge against [tm_bae2_outlaw.GetName]: that she sits on the seeress's seat and sings the old songs. "Pagan illusion, and sin," [tm_bae2_accuser.GetSheHe] says. "The church law sends a sorceress out of the realm.""
 tm_bae2.0100.desc.dress:0 "[tm_bae2_accuser.GetName] has brought a suit against [tm_bae2_outlaw.GetName] under the law of dress. "The law says that a woman who dresses as a man, or cuts her hair, or carries weapons, to be different from other women, goes into lesser outlawry. And the same for a man who dresses as a woman. Whichever she claims to be, the law has her.""
 tm_bae2.0100.desc.end:0 "\n\nThe suit is brought in my hall. I can let it go to judgement, or end it here."
 tm_bae2.0100.a:0 "Let the law take its course."
 tm_bae2.0100.a.tt:0 "[tm_bae2_outlaw.GetFirstName] must answer the charge: an oath, the life-ring and three winters abroad, or the woods."
 tm_bae2.0100.desc.iceland_none:0 "[tm_bae2_accuser.GetName] has brought the church's charge against [tm_bae2_outlaw.GetName]: that she sits on the seeress's seat and sings the old songs. But the law of this land does not ask who sat on the seat. It asks who hired her, and that one answers for it."
 tm_bae2.0100.desc.iceland_none_end:0 "\n\nNo one will name who asked her to sit. [tm_bae2_accuser.GetFirstName] has a charge and no one to answer it."
 tm_bae2.0100.desc.iceland_client:0 "[tm_bae2_accuser.GetName] has brought the church's charge: that [tm_bae2_seeress.GetName] sat on the seeress's seat, and that [tm_bae2_outlaw.GetName] asked her to. The law of this land holds the one who hired a seeress to answer for it. A jury of twelve may clear [tm_bae2_outlaw.GetHerHim]."
 tm_bae2.0100.desc.relapse:0 "\n\n[tm_bae2_outlaw.GetFirstName] has done penance once already, under a bishop's condition: if she came before a court again, the church would not sentence her a second time. "She has," [tm_bae2_accuser.GetFirstName] says. "The church gives her to the secular arm." That is me."
 tm_bae2.0100.arm:0 "Take her into my keeping."
 tm_bae2.0100.arm.tt:0 "[tm_bae2_outlaw.GetFirstName] goes to my prison. What happens to her there is mine to decide."
 tm_bae2.0100.c:0 "Then there is no suit."
 tm_bae2.0100.b:0 "I will not hear this suit."

 tm_bae2.0101.t:0 "The Sentence"
 tm_bae2.0101.desc.seidr:0 "The suit has gone against me. [tm_bae2_accuser.GetFirstName] calls the seat a pagan illusion and the songs a sin. Under the church law I may clear myself if six good housewives swear that I know no sorcery. If they will not, I must leave the realm."
 tm_bae2.0101.desc.client:0 "The suit has gone against me. [tm_bae2_seeress.GetFirstName] sat on the seat because I asked her, and the law here says the one who asks answers for it, not the woman on the seat. Twelve jurors may clear me. If they will not, I pay the life-ring and go abroad.\n\nIf I will not pay, or will not go, I am an outlaw in full."
 tm_bae2.0101.desc.penance:0 "\n\nThe bishop offers another road: penance, and seven years on the pilgrim roads outside the realm. But the penance comes with a condition, and the condition does not end."
 tm_bae2.0101.desc.dress:0 "The suit has gone against me, under the law of dress. They call it lesser outlawry: I pay the life-ring to the court, and spend three winters out of the land. Then I am as free as if it had never happened.\n\nIf I will not pay, or will not go, I am an outlaw in full, and anyone may kill me."
 tm_bae2.0101.a:0 "Six housewives will swear for me."
 tm_bae2.0101.a.tt:0 "Three stand on each side of me and swear. If they hold, I am cleared, and [tm_bae2_accuser.GetFirstName] is the slanderer. If they do not, lesser outlawry, once the confiscation court has sat. Better odds if I am of a House, or speak well."
 tm_bae2.0101.a_jury:0 "Twelve jurors will clear me."
 tm_bae2.0101.a_jury.tt:0 "If the twelve clear me, [tm_bae2_accuser.GetFirstName] is the slanderer. If not, lesser outlawry, once the confiscation court has sat. Better odds if I am of a House, or speak well."
 tm_bae2.0101.cleared:0 "The Oath Held"
 tm_bae2.0101.b:0 "Pay the ring and go abroad for three winters."
 tm_bae2.0101.b.tt:0 "Lesser outlawry for three years, once the confiscation court sits in a fortnight. I pay a ring of one mark and go to a court of our faiths outside this realm, a House first. When the three winters are out, I am free. If the court is not held, the sentence lapses."
 tm_bae2.0101.c:0 "I will not pay for being what I am."
 tm_bae2.0101.c.tt:0 "Full outlawry, once the confiscation court sits in a fortnight and takes what I own. Then, if I can lead fighters, I take to the woods with a band of my own; if not, I seek service far from here. It lasts until a settlement, or until I hold land of my own. If my friends stop the court, the sentence lapses."
 tm_bae2.0101.d:0 "Penance and the pilgrim roads."
 tm_bae2.0101.d.tt:0 "Seven years of penance. I go abroad at once, to a court of our faiths, a House first. No one may kill me for it. But the condition stays for life: if I am ever sued again where the law takes lives for sorcery, the court will not sentence me. It will hand me over."

 tm_bae2.0105.t:0 "The Confiscation Court"
 tm_bae2.0105.desc.failed:0 "A fortnight after the sentence I went to hold the court outside [tm_bae2_outlaw.GetFirstNamePossessive] door, as the law requires. Her people were there before me, her sisters and the women of her House and men I did not expect, and they stood between us and the door until the day was gone.\n\nNo court was held. The sentence lapses."
 tm_bae2.0105.desc.lesser:0 "A fortnight after the sentence the court sat outside [tm_bae2_outlaw.GetFirstNamePossessive] door, as the law requires. She paid the ring, one mark, and now she goes abroad for three winters."
 tm_bae2.0105.desc.full:0 "A fortnight after the sentence the court sat outside [tm_bae2_outlaw.GetFirstNamePossessive] door, as the law requires, and took what she owned. She would not pay the ring. She is an outlaw in full now, with no standing at law."
 tm_bae2.0105.desc.magnus:0 "\n\nUnder King Magnus's new law her silver goes to the lord of the hall and his chaplain, half each."
 tm_bae2.0105.a:0 "The law is kept."
 tm_bae2.0105.a.tt:0 "The sentence stands. Her silver is divided as the law of this court directs: half to the lord and half to me, or under Magnus's law, half to the lord and half to his chaplain."
 tm_bae2.0105.b:0 "The law was not kept, and everyone saw it."

 tm_bae2.0110.t:0 "An Outlaw at the Door"
 tm_bae2.0110.desc:0 "[tm_bae2_exile.GetName] has come to my court from the north, outlawed under a Christian law for what she is. She asks for a place to wait out her sentence."
 tm_bae2.0110.a:0 "She stays."
 tm_bae2.0110.a.tt:0 "Whoever outlawed her will think less of me for it. While an outlaw in full stays at my court, I gain 5 [prestige|E] a year and her accuser loses 5, my Sisters' House bears the strain of hiding her, and her accuser may summon me for harbouring."

 tm_bae2.0115.t:0 "A Summons for Harbouring"
 tm_bae2.0115.desc:0 "[tm_bae2_accuser.GetName] has sent men to my hall with a summons. I keep [tm_bae2_outlaw.GetName], whom [tm_bae2_accuser.GetSheHe] outlawed, and the law calls that assistance: a roof, food, a boat. "Pay, and I let it go," [tm_bae2_accuser.GetSheHe] says. Such summonses are often settled for a fee."
 tm_bae2.0115.a:0 "Pay the fee."
 tm_bae2.0115.b:0 "She stays, and I pay nothing."
 tm_bae2.0115.b.tt:0 "[tm_bae2_accuser.GetFirstNamePossessive] house counts it a wrong against it."
 tm_bae2.0115.c:0 "Name witnesses, tell five neighbours, and send her on."
 tm_bae2.0115.c.tt:0 "She goes on to another House. Before witnesses I gave her only a roof, and the law asks nothing more of me."
 tm_bae2.0110.b:0 "Send her on to another House."

 tm_bae2.0130.t:0 "The Outlaw's Price"
 tm_bae2.0130.desc:0 "[tm_bae2_outlaw.GetName], whom I had outlawed, sends word with silver. She offers a hundred [gold|E] to settle the matter between us, as such matters are settled. If I take it, her sentence is lifted."
 tm_bae2.0130.desc.ride:0 "[tm_bae2_outlaw.GetName], whom I had outlawed, has ridden from hall to hall, and her sisters and friends have each pledged silver for her. They offer the whole sum to settle the matter between us. If I take it, her sentence is lifted. If I refuse so many, they will remember it."
 tm_bae2.0130.a:0 "Take the price. The matter is settled."
 tm_bae2.0130.b:0 "No silver will settle this."

 tm_bae2.0135.t:0 "Forgiven for the War"
 tm_bae2.0135.desc:0 "[tm_bae2_outlaw.GetName] was outlawed in my realm. Now she and her people have fought on my side, and she asks a pardon for it. The law does not forgive her. Only I can."
 tm_bae2.0135.a:0 "She has earned it. The sentence is lifted."
 tm_bae2.0135.b:0 "Service is owed. It buys nothing."

 # Landless bands
 tm_bae2_answer_hall_decision:0 "Answer the Hall's Call"
 tm_bae2_answer_hall_decision_desc:0 "Within reach of our camp is a county held by a lord of another faith, where the people kept our faith, or a Sisters' House stands, or our faith's seat lies. They would take us back. We could go to them."
 tm_bae2_answer_hall_decision_confirm:0 "We go home"
 tm_bae2_answer_hall_decision_tooltip:0 "Go to war for a county that keeps your faith"
 tm_bae2_answer_hall_decision.tt:0 "Gain a pressed [claim|E] on the nearest such county and declare a [claim|E] war on its holder. If you win and hold it, your band settles with ten years' grace: defensive [battle_advantage|E], [garrison|E], and a welcome from its people."
 tm_bae2_ride_for_sympathy_decision:0 "Ride for Sympathy"
 tm_bae2_ride_for_sympathy_decision_desc:0 "I am an outlaw in full, but I am not friendless. My sworn sisters, my friends, and the Houses that think well of me would each pledge silver if I rode to them. Together it could buy a settlement."
 tm_bae2_ride_for_sympathy_decision_confirm:0 "I ride"
 tm_bae2_ride_for_sympathy_decision_tooltip:0 "Raise the price of a settlement from your well-wishers"
 tm_bae2_ride_for_sympathy_decision.tt:0 "Each well-wisher pledges 25 [gold|E], and your accuser is offered the sum to lift your outlawry. The more who pledge, the harder it is to refuse, and a refusal costs your accuser [prestige|E]."
 tm_bae2_ride_cooldown_tt:0 "I have not ridden for sympathy in the last five years"
 tm_bae2_ride_accuser_tt:0 "My accuser is alive"
 tm_bae2_ride_wishers_tt:0 "At least two well-wishers: sworn sisters, friends, or nearby rulers of our faiths who keep a Sisters' House and think well of me"
 tm_bae2_answer_hall_county_tt:0 "A county within reach of your camp keeps your faith, or a Sisters' House, or is your faith's seat, under a lord of another faith"

 # Modifiers and opinions
 tm_bae2_lesser_outlaw_modifier:0 "Lesser Outlaw"
 tm_bae2_lesser_outlaw_modifier_desc:0 "Paid the life-ring and went abroad for three winters. When they are out, she is free."
 tm_bae2_full_outlaw_modifier:0 "Outlaw"
 tm_bae2_full_outlaw_modifier_desc:0 "Outlawed in full: no standing at law, and anyone may kill her. A settlement ends it, or land of her own."
 tm_bae2_settling_modifier:0 "Settling the Hall"
 tm_bae2_settling_modifier_desc:0 "Her band has taken land, and the first years in the hall are the hardest to hold."
 tm_bae2_hall_returned_county_modifier:0 "Our Own Came Home"
 tm_bae2_hall_returned_county_modifier_desc:0 "The people here kept the faith under other lords. Now one of their own holds the hall."
 tm_bae2_penance_modifier:0 "Penance and the Pilgrim Roads"
 tm_bae2_penance_modifier_desc:0 "Seven years of fasting and pilgrimage outside the realm, on a bishop's sentence. The condition does not end with them."
 tm_bae2_holm_modifier:0 "Holding the Holm"
 tm_bae2_holm_modifier_desc:0 "Our camp has stood on this ground for years. We know every path to it, and every path is watched."
 tm_bae2_outlaws_holm_county_modifier:0 "The Outlaw's Holm"
 tm_bae2_outlaws_holm_county_modifier_desc:0 "A band of outlaws held its camp here for years, where no one could easily come at it. The place keeps the name."
 tm_bae2_sprang_my_cell_opinion:0 "Emptied My Prison"
 tm_bae2_tried_my_cell_opinion:0 "Tried to Break My Prison"
 tm_bae2_outlawed_by_me_opinion:0 "I Outlawed Her"
 tm_bae2_settled_with_me_opinion:0 "Settled With"
 tm_bae2_suit_quashed_opinion:0 "Quashed My Suit"
 tm_bae2_harbours_outlaw_opinion:0 "Harbours an Outlaw"
 house_relation_reason_tm_harboured_desc:0 "[char.GetShortUINameNotMe|U] harboured an outlaw of [target_char.GetShortUINameNotMe]'s"
