l_english:
 # Ha-Nehpakhot: the family and the women's synagogue (events/tm_kahal_events.txt)
 tm_kahal.0001.t:0 "A Prayer Book for [tm_book_sister.GetFirstName]"
 tm_kahal.0001.desc:0 "I have been thinking of [tm_book_sister.GetFirstName]. She keeps the women's commandments now, and the women of her street call her by a woman's name. In Provence the scribes copy prayer books in the common tongue for women who do not read Hebrew, and families give them as gifts. I could send her one."
 tm_kahal.0001.desc_wedding:0 "[tm_book_sister.GetFirstName] is to be married. In Provence the scribes copy prayer books in the common tongue for women who do not read Hebrew, and families give them as wedding gifts, with Rebecca's blessing on the title page. I could send her one."
 tm_kahal.0001.a:0 "Have a scribe copy one for her, with Rebecca's blessing on the title page."
 tm_kahal.0001.b:0 "Copy out the morning blessings for her myself, in my own hand."
 tm_kahal.0001.c:0 "Not this year."
 tm_kahal.0002.t:0 "A Prayer Book in Our Own Tongue"
 tm_kahal.0002.desc:0 "[tm_book_giver.GetFirstName] has sent me a prayer book in the tongue of Provence. It is small, and its title page is lettered in gold with Rebecca's blessing, as her family said it: “our sister, may you become thousands of myriads.” Among the morning blessings is the women's own: “qui fis me fenna”, who made me a woman."
 tm_kahal.0002.desc_sibling:0 "[tm_book_giver.GetFirstName] has sent me a prayer book in the tongue of Provence. It is small, and its title page is lettered in gold with Rebecca's blessing, changed by one word: “my sister, may you become thousands of myriads.” Among the morning blessings is the women's own: “qui fis me fenna”, who made me a woman."
 tm_kahal.0002.desc_hand:0 "[tm_book_giver.GetFirstName] has sent me a few leaves in a hand I know: the morning blessings, copied out in the tongue of Provence. At the top is Rebecca's blessing, “may you become thousands of myriads.” The women's blessing is there among the others: “qui fis me fenna”, who made me a woman."
 tm_kahal.0002.a:0 "Say the blessing from it, aloud and with the Name."
 tm_kahal.0002.b:0 "Write back to [tm_book_giver.GetFirstName]: I will keep it all my life."
 tm_kahal.0010.t:0 "The Women at the Door"
 tm_kahal.0010.desc:0 "It is the Days of Awe. Some of the women keep a custom their mothers brought from the Rhine: in their days they do not come in, but stand outside the door of the women's synagogue while the prayers are said within. On the Rhine the women had prayer leaders, who stood at the opening and said the words aloud so that those outside could answer. [tm_door_woman.GetFirstName] is outside this year."
 tm_kahal.0010.a:0 "Stand at the door, and give them the prayer."
 tm_kahal.0010.b:0 "Stand outside with them."
 tm_kahal.0010.c:0 "Go in. It is for the men to rule on this."
 tm_kahal_prayer_book_modifier:0 "A Prayer Book in Our Own Tongue"
 tm_kahal_prayer_book_modifier_desc:0 "A gift from this character's own kin: a prayer book in the tongue of Provence, with the women's blessing among the morning blessings."
 tm_kahal_door_modifier:0 "Prayer Leader of the Women"
 tm_kahal_door_modifier_desc:0 "This character stood at the door in the Days of Awe and gave the prayer to the women outside."
 tm_kahal_book_opinion:0 "Sent Me a Prayer Book"
 tm_kahal_door_opinion:0 "Gave Us the Prayer at the Door"
