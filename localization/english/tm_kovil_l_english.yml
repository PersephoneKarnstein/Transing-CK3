l_english:
 tm_kovil.0001.t:0 "The Temple's Deal"
 tm_kovil.0001.desc:0 "[tm_kovil_woman.GetFirstName] has been to the temple. Its priests will grant her an honour for a gift, as temples of this country grant the women of the street: a verse to sing in Mārkazhi, the flywhisk beside the god in procession, or the first house in the temple quarter. It would be hers, and her descendants' after her. They ask who will pay."
 tm_kovil.0001.desc_self:0 "The temple's priests will grant me an honour for a gift, as temples of this country grant the women of the street: a verse to sing in Mārkazhi, the flywhisk beside the god in procession, or the first house in the temple quarter. It would be mine, and my descendants' after me."
 tm_kovil.0001.a:0 "A verse of the Tiruvempāvai, to sing in Mārkazhi."
 tm_kovil.0001.b:0 "The flywhisk beside the god in procession."
 tm_kovil.0001.c:0 "The first house in the temple quarter."
 tm_kovil.0001.d:0 "She will give from her own purse."
 tm_kovil.0001.e:0 "Not this year."
 tm_kovil.0002.t:0 "The Seventh Verse"
 tm_kovil.0002.desc:0 "It is Tiruvātirai, in the month of Mārkazhi. The drums stop, and the temple waits for the seventh verse of the Tiruvempāvai. It is mine to sing. The temple granted it to me and to my descendants, and the stone says so."
 tm_kovil.0002.a:0 "Sing it."
 tm_kovil.0002.b:0 "Let my daughter sing it with me."
 tm_kovil.0003.t:0 "To Her Descendants"
 tm_kovil.0003.desc:0 "[tm_kovil_mother.GetFirstName] is dead. The temple's grant was made to her and to her descendants, and the priests have sent for me to take up her place."
 tm_kovil.0003.a:0 "I will keep it as she kept it."
 tm_kovil_verse_modifier:0 "A Verse of the Tiruvempāvai"
 tm_kovil_verse_modifier_desc:0 "This character has the temple's grant of a verse to sing at Tiruvātirai in Mārkazhi, for herself and her descendants."
 tm_kovil_flywhisk_modifier:0 "The Flywhisk in Procession"
 tm_kovil_flywhisk_modifier_desc:0 "This character walks beside the god in procession with the flywhisk, by the temple's grant to her and her descendants."
 tm_kovil_first_house_modifier:0 "The First House"
 tm_kovil_first_house_modifier_desc:0 "This character holds the first house in the temple quarter, by the temple's grant to her and her descendants."
