l_english:
 # Yutai Dao and the Sogdians of Dunhuang (tm_yt3; docs/wave4/yutai-sogdians.md). de la Vaissiere, Sogdian Traders (2005).
 # Hide the Name (pp. 220-222).
 tm_yt3_hide_name_decision:0 "Hide the Name"
 tm_yt3_hide_name_decision_desc:0 "My lord's court looks hard at where a family comes from. A name can be written again in the register, and a birthplace with it."
 tm_yt3_hide_name_decision_tooltip:0 "Choose whether to hide where you came from."
 tm_yt3_hide_name_decision_confirm:0 "Open the register"
 tm_yt3_hide_name_decision_effect_tt:0 "I choose whether to take a new family name, write another birthplace, stand on my record, or keep my name as it is."
 tm_yt3_hide_name_tt:0 "I keep quiet in this land, as with Keep Quiet in This Land. The world's hostile courts are half as likely to single me out, and I cannot be chosen Elder Sister while it lasts. Speak Aloud Again ends it. What is written in the register stays written."
 tm_yt3.0001.t:0 "Hide the Name"
 tm_yt3.0001.desc_sogdian:0 "Since An Lushan's revolt the court has looked hard at families from the west. In 756 one family of An had its name written as Li, back through four generations, so that no grandfather of theirs was ever an An. Others wrote that they came from the south.\n\nMy family's name says where it came from. The clerk who keeps the register would write something else for a fee, and the court would stop asking."
 tm_yt3.0001.desc_sogdian_early:0 "My lord's court looks hard at families from the west, and my family's name says where it came from. The clerk who keeps the register would write something else for a fee, and the court would stop asking."
 tm_yt3.0001.desc_court:0 "My lord does not love the Way, and his court knows where I came from. I will not hide what I am. Where I came from is another matter. A family name and a birthplace are only words in a register, and the clerk would write others for a fee."
 tm_yt3.0001.desc_purge:0 "The palace has been emptied. The inner offices are gone, and the court is asking who served them and where those people came from. My name is in the palace's books.\n\nFamilies have hidden their names before, when a court turned on them. The clerk who keeps the register would write another name for a fee, and another birthplace."
 tm_yt3.0001.a:0 "Take a new family name, and have it written back through four generations."
 tm_yt3.0001.b_sogdian:0 "Write that we come from Guiji. The clerks will think of the great city in the south, not of old Guiji by Dunhuang."
 tm_yt3.0001.b:0 "Write another birthplace in the register, far from here."
 tm_yt3.0001.b.quiet:0 "No one looked twice"
 tm_yt3.0001.b.found:0 "A clerk asked questions"
 tm_yt3.0001.b_sogdian.found:0 "A clerk knew that Changle was once called Guiji"
 tm_yt3.0001.c:0 "Stand on my record. I have served this house, and it knows me."
 tm_yt3.0001.d:0 "Keep my name. The Way sets names right. It does not write them out."
 # The banquet at the Cao inn (p. 324; S. 2894v, the she circular of 973).
 tm_yt3.0010.t:0 "The Banquet at the Cao Inn"
 tm_yt3.0010.desc:0 "The street's society has sent round its circular for the year-end banquet. Each member is to bring a measure of flour and a bowl, and come to the inn of the Cao family. There are fifteen names on the paper, and the House at [tm_yt3_house_county.GetNameNoTier] is one of them. Five are An or Cao, and the head who signed it is one of those.\n\nThe An and Cao families have married among themselves for generations. Some of their daughters come to the House's door on festival days. The House pays its own society's dues as well, at every birth and every burial."
 tm_yt3.0010.a:0 "Bring the flour, and bring the neighbours' daughters into our own society."
 tm_yt3.0010.a.guest:0 "A neighbour's daughter came to stay"
 tm_yt3.0010.a.home:0 "The neighbours' daughters came to the rites, and went home after"
 tm_yt3.0010.b:0 "Go to the banquet, and keep our society to the House."
 tm_yt3.0010.c:0 "Hold the banquet at the House this year. We will send round a circular of our own."
 tm_yt3_neighbour_keeps_faith_tt:0 "She keeps her own faith. The House shelters her; whether the Way calls her is for her."
 # The stranded woman, after the Ancient Letters (pp. 47, 56-57, 188).
 tm_yt3.0020.t:0 "No Reply from There"
 tm_yt3.0020.desc:0 "A woman of a western merchant family has come to the House at [tm_yt3_house_county.GetNameNoTier]. Her husband went east through the passes on business years ago and has not written. The kinsman who was to keep her ran off with his debts unpaid, and his creditors came to her instead.\n\nShe has written to her mother and to her husband, and sent the letters with the merchants' own post. None has come back. If no one helps her, she must go into service in a stranger's household to pay what he owed. She says she can write, and she can ride a camel.\n\n"
 tm_yt3.0020.desc_kin:0 "Her mother's people serve at the court of [tm_yt3_kin_court.GetTitledFirstName], far to the west. A caravan could take her there."
 tm_yt3.0020.desc_nokin:0 "Her people are scattered. A caravan could take her west, but no one is waiting for her there."
 tm_yt3.0020.a:0 "Ask the House's priestess for a camel, and a place in the next caravan west."
 tm_yt3.0020.a.road_tt:0 "She goes west with the caravan, and takes her chances on the road."
 tm_yt3.0020.b:0 "Take her in as the House's lodger."
 tm_yt3.0020.c:0 "She can write. The court needs a clerk for its letters west."
 tm_yt3.0020.d:0 "We cannot help her."
 tm_yt3_stranded_keeps_faith_tt:0 "She keeps her own faith. The House gives her a roof, not a name."
