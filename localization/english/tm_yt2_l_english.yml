l_english:
 tm_yt2_work_offices_decision:0 "Work the Inner Offices"
 tm_yt2_work_offices_decision_desc:0 "Use my palace seal to move the court between the inner offices and the scholar-officials, or spend what the inner offices have won on the society."
 tm_yt2_work_offices_decision_tooltip:0 "Choose how to use the palace seal this year."
 tm_yt2_work_offices_decision_confirm:0 "Open the seal box"
 tm_yt2_work_offices_decision_effect_tt:0 "I choose how to use my seal: adoption, a commander, the ministers' audiences, or licences for the society."
 tm_yt2_north_tt:0 "The inner offices gain ground at this throne."
 tm_yt2_south_tt:0 "The scholar-officials gain ground at this throne."
 tm_yt2_spend_tt:0 "The inner offices spend some of their ground at this throne."
 tm_yt2_one_body_tt:0 "For five years the Southern Office's memorials pass me by."
 tm_yt2_licences_tt:0 "One Sisters' House in this realm that is not mine receives a name-panel. For five years, an adept of the Way under this throne can have her name taken off the clergy-roll inquiry."
 tm_yt2.0001.t:0 "The Inner Offices at Work"
 tm_yt2.0001.desc:0 "My seal opens doors in the palace. Behind them the inner offices and the scholar-officials pull at the throne from two sides. The ministers call our side the Northern Office and their own the Southern Office. What I do with the seal this year moves the rope a little.\n\n"
 tm_yt2.0001.desc_north:0 "Just now the inner offices have the throne's ear. The Southern Office is counting our gains, and it will write about them."
 tm_yt2.0001.desc_south:0 "Just now the scholar-officials have the throne's ear. Their memorials go up the stairs faster than ours."
 tm_yt2.0001.desc_even:0 "Just now neither side has the throne's ear."
 tm_yt2.0001.a:0 "Adopt grown followers into my house, as the Yang of the inner offices did."
 tm_yt2.0001.b:0 "Register an adopted heir with the Court of Imperial Ceremonies."
 tm_yt2.0001.b.entered:0 "The clerk entered the name"
 tm_yt2.0001.b.quota:0 "The quota of palace people was full"
 tm_yt2.0001.c:0 "Win over a commander of the Shence armies."
 tm_yt2.0001.c.quiet:0 "No one marked the gift"
 tm_yt2.0001.c.noticed:0 "The throne heard of it"
 tm_yt2.0001.d:0 "Ask to sit in the ministers' audiences. Inner and outer officials are one body."
 tm_yt2.0001.e:0 "Spend what the inner offices have won on licences for the society."
 tm_yt2.0001.f:0 "Not this year."
 tm_yt2.0002.t:0 "The Clerk of Ceremonies"
 tm_yt2.0002.desc:0 "A clerk of the Court of Imperial Ceremonies has come about the society's daughters. Under the founder's edicts, a palace man who adopts must enter the child in that court's register, by name and age, and hold its certificate. A secret adoption means death.\n\n\"Your society takes in daughters,\" the clerk says. \"Some came to you from the palace's side of the world. A eunuch's adoptee needs a certificate. Which are they?\""
 tm_yt2.0002.a:0 "A daughter named before witnesses is a daughter, not a eunuch's son. Rectify your names."
 tm_yt2.0002.a.kept:0 "The clerk wrote \"daughter\" and left"
 tm_yt2.0002.a.lost:0 "The clerk wrote what he liked, and the House felt it"
 tm_yt2.0002.b:0 "A friend in the inner offices will file his question away."
 tm_yt2.0002.c:0 "Buy the certificate, and let him write what he likes."
 tm_yt2.0003.t:0 "The Censor's Brush"
 tm_yt2.0003.desc:0 "A memorial against the palace's people has come to my desk. As Censor I am the one who sends such papers up to the throne, and the Southern Office expects me to send this one. One of the names in it is [tm_palace_daughter.GetFirstName], a daughter of the Way who holds a seal in the inner offices.\n\nThe ministers say the realm belongs to the founders, not to the inner offices. My sister would say the society keeps its own. Both are waiting to see what I do."
 tm_yt2.0003.a:0 "Send it up. The Censorate keeps no favourites."
 tm_yt2.0003.b:0 "Let it lie on my desk."
 tm_yt2.0003.b.quiet:0 "No one asked after it"
 tm_yt2.0003.b.found:0 "A minister asked after it"
 tm_yt2.0003.c:0 "Write to [tm_palace_daughter.GetFirstName] first, so she can give back the seal before it is taken."
 tm_embryo.0010.e:0 "A friend in the inner offices will have my name taken off his inquiry."
