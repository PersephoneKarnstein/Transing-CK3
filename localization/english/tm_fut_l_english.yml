l_english:
 # Protection under Muslim and Orthodox lords, wave 4 (events/tm_fut_events.txt; docs/wave4/protection.md).
 # Under Her Chivalry: Tor, Violent Order, pp. 243-250, 257 (research/isl_tor_violent_order.md §6). "fityan" and
 # "futuwwa" appear only for a lord in Iran or Iraq before 1056; elsewhere, "a free man's word".
 tm_fut.0001.t:0 "The Fityan"
 tm_fut.0001.desc:0 "The fityan of [tm_fut_town.GetNameNoTier] have come to my hall: the young men who keep the code they call futuwwa. Their head tells me what it asks. A man of the code gives justice and does not demand it. He treats the stranger as he treats his neighbour. He keeps his table open and his word whole. Whoever entrusts himself to his chivalry, even an enemy, he protects at the risk of his life.\n\nThey swear by the truth of the futuwwa, and a new brother is dressed in the trousers of the order. They would swear me in."
 tm_fut.0001.a:0 "Put on the trousers, and swear by the futuwwa."
 tm_fut.0001.b:0 "Thank them, and send them home."
 tm_fut.0010.t:0 "Under a Lord's Word"
 tm_fut.0010.desc:0 "I live at [tm_fut_lord.GetTitledFirstName]'s court, and [tm_fut_lord.GetHerHis] faith is not mine. If I put myself under [tm_fut_lord.GetHerHis] protection before the household, [tm_fut_lord.GetHerHis] honour answers for my safety. I would be owed nothing for it but a word. I would owe my thanks and my service, and nothing in coin."
 tm_fut.0010.desc_fata:0 " Men say [tm_fut_lord.GetSheHe] has sworn by the futuwwa, and does not give up one who has entrusted herself to [tm_fut_lord.GetHerHis] chivalry."
 tm_fut.0010.desc_plain:0 " Men say [tm_fut_lord.GetSheHe] keeps [tm_fut_lord.GetHerHis] word as a free man keeps it."
 tm_fut.0010.a_fata:0 "Entrust myself to [tm_fut_lord.GetHerHis] chivalry."
 tm_fut.0010.a:0 "Put myself under [tm_fut_lord.GetHerHis] word."
 tm_fut.0010.b:0 "I will keep my own counsel."
 tm_fut.0011.t:0 "Under My Word"
 tm_fut.0011.desc:0 "Before my household, [tm_fut_daughter.GetFirstName] has put herself under my word. She offers no gold, and I ask none."
 tm_fut.0011.desc_fata:0 "Before my household, [tm_fut_daughter.GetFirstName] has entrusted herself to my chivalry, as the fityan say it. She offers no gold, and I ask none."
 tm_fut.0011.desc_end:0 " If I give my word, I give it before everyone. No one at my court will lay a hand on her, and I will give her up to no one who asks for her."
 tm_fut.0011.a:0 "She has my word."
 tm_fut.0011.b:0 "I cannot give it."
 tm_fut.0020.t:0 "The Demand"
 tm_fut.0020.desc:0 "[tm_fut_demander.GetTitledFirstName] has written to me about [tm_fut_daughter.GetFirstName]. The letter does not ask. It demands that I give her up. She is under my word."
 tm_fut.0020.desc_fata:0 " The fityan say one who keeps the code protects whoever has entrusted herself to them, even at the risk of life."
 tm_fut.0020.desc_plain:0 " A word given freely is not taken back because someone asks for it."
 tm_fut.0020.a:0 "She is under my word. No one may have her."
 tm_fut.0020.b:0 "Move one step, and tell the messenger: no one has passed while I sat here."
 tm_fut.0020.c:0 "Send her from my court, to her own people."
 # No Service in the Prince's Wars: Dollinger, The German Hansa, Document 3, pp. 381-382, cls. 10 and 32
 # (research/norse_dollinger_hansa.md §7). The scribe's precedent only for an Orthodox lord from 1229.
 tm_fut.0030.t:0 "The Terms They Ask"
 tm_fut.0030.desc:0 "[tm_fut_spokeswoman.GetFirstName] has come before me for the Nehpakhot at my court, the people of her faith. They ask for terms, written and sealed. My wars are to be none of their concern, unless they ask to ride with me. If they quarrel among themselves, they settle it in their own fashion, and my court does not hear it.\n\nThey offer no coin for this, and I would take none. They offer service."
 tm_fut.0030.desc_smolensk:0 "\n\nMy scribe says the prince of Smolensk gave the German merchants in his city the same two clauses, and he can write them out from memory."
 tm_fut.0030.desc_plain:0 "\n\nMy scribe says princes have given foreign merchants terms like these before."
 tm_fut.0030.a:0 "Grant them. She will be my physician."
 tm_fut.0030.b:0 "Grant them. She will read and write my letters in other tongues."
 tm_fut.0030.c:0 "Grant them. She will keep my household."
 tm_fut.0030.d:0 "No terms."
 tm_fut.0032.t:0 "Unless They Ask"
 tm_fut.0032.desc:0 "By the terms I gave, my wars are none of the concern of the Nehpakhot at my court, unless they ask to ride with me. [tm_fut_rider.GetFirstName] asks."
 tm_fut.0032.a:0 "Ride with me, then."
 tm_fut.0032.b:0 "Stay. You need not."
 tm_fut.0033.t:0 "In Their Own Fashion"
 tm_fut.0033.desc:0 "Two households of the Nehpakhot at my court, [tm_fut_party_a.GetFirstName]'s and [tm_fut_party_b.GetFirstName]'s, have fallen out over a betrothal. My bailiff asks whether he should hear the case.\n\nBy the terms I gave, their quarrels are no concern of mine. They settle them in their own fashion."
 tm_fut.0033.a:0 "It is no concern of mine."
 tm_fut.0033.b:0 "My bailiff will hear it. The terms are done."
 tm_fut_grant_terms_interaction:0 "Grant Terms to Her People"
 tm_fut_grant_terms_interaction_desc:0 "Offer the Nehpakhot at your court terms: your wars are none of their concern unless they ask to ride with you, and they settle their own quarrels. In return, they serve."
 # Modifiers
 tm_fut_javanmard_modifier:0 "Javanmard"
 tm_fut_javanmard_modifier_desc:0 "Sworn by the futuwwa before the fityan of the town. Whoever entrusts herself or himself to this character's chivalry is protected."
 tm_fut_free_word_modifier:0 "A Free Man's Word"
 tm_fut_free_word_modifier_desc:0 "This character gave a free man's word before the household to one who put herself under it, and keeps it."
 tm_fut_sheltered_modifier:0 "Under a Lord's Word"
 tm_fut_sheltered_modifier_desc:0 "This character has put herself under the word of the lord at whose court she lives, and the word was given."
 tm_fut_terms_physician_modifier:0 "Physician by the Terms"
 tm_fut_terms_physician_modifier_desc:0 "The Nehpakhot at this court serve as physicians, by the terms their lord gave them."
 tm_fut_terms_interpreter_modifier:0 "Letters in Other Tongues"
 tm_fut_terms_interpreter_modifier_desc:0 "The Nehpakhot at this court read and write their lord's letters in other tongues, by the terms the lord gave them."
 tm_fut_terms_steward_modifier:0 "The Household Kept"
 tm_fut_terms_steward_modifier_desc:0 "The Nehpakhot at this court keep their lord's household, by the terms the lord gave them."
 tm_fut_terms_member_modifier:0 "No Part in the Prince's Wars"
 tm_fut_terms_member_modifier_desc:0 "By the terms her lord gave her people, the lord's wars are none of her concern unless she asks to ride with the army, and her people settle their own quarrels."
