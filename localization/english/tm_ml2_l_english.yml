l_english:
 tm_ml2.0001.t:0 "A House on the Temple Street"
 tm_ml2.0001.desc:0 "[tm_ml2_woman.GetFirstName] has asked me for a house on the temple street, and a share of the temple's land with it. A share is paddy from the temple's fields, paid each year to the woman who lives on the street and does the work. The Brahman accountants of the temple would write it in her name, not in mine."
 tm_ml2.0001.desc_self:0 "A house on the temple street stands empty, and a share of the temple's land goes with it: paddy from the temple's fields, paid each year to the woman who lives on the street and does the work. The Brahman accountants of the temple will write it in my own name if I pay the price."
 tm_ml2.0001.a:0 "Grant her the house and the share."
 tm_ml2.0001.b:0 "She can buy it from her own purse."
 tm_ml2.0001.c:0 "Buy it in my own name."
 tm_ml2.0001.d:0 "Not now."
 tm_ml2.0003.t:0 "To Her and Her Descendants"
 tm_ml2.0003.desc_child:0 "[tm_ml2_mother.GetFirstName] held a share on the temple street of [tm_ml2_share_county.GetName], and the grant was to her and her descendants. The accountants have written my name where hers was."
 tm_ml2.0003.desc_street:0 "[tm_ml2_mother.GetFirstName] held a share on the temple street of [tm_ml2_share_county.GetName] and left no daughter to take it up. By the custom of the street, the women who live there choose who will do the work. They have chosen me."
 tm_ml2.0003.a:0 "I will keep it as she kept it."
 tm_ml2.0004.t:0 "For Those Who Do the Work"
 tm_ml2.0004.desc:0 "I have been away from [tm_ml2_share_county.GetName] for three years. A share on the temple street is paid to the women who live there and do the work, and the accountants have struck out my name. No woman of the street was there to take it up, so it has gone back to the temple."
 tm_ml2.0004.desc_heir:0 "I have been away from [tm_ml2_share_county.GetName] for three years. A share on the temple street is paid to the women who live there and do the work, and the accountants have struck out my name. It has passed to [tm_ml2_heir.GetFirstName]."
 tm_ml2.0004.a:0 "The street keeps its own."
 tm_ml2.0010.t:0 "A Gift in My Own Name"
 tm_ml2.0010.desc:0 "The women of the street give to the temple, and the masons cut each gift into its wall under the giver's name. The gold is mine, and so is the name they will cut. The priests will set it below the grants of kings, as they always do. It will still be there when the kings' grants are forgotten."
 tm_ml2.0010.a:0 "A lamp to burn before the god."
 tm_ml2.0010.b:0 "A feeding house that bears my name."
 tm_ml2.0010.c:0 "Set up the Lady beside the god."
 tm_ml2.0010.d:0 "Keep my gold this year."
 tm_ml2.0010.e:0 "A lamp kept by the market, in my name."
 tm_ml2.0011.t:0 "She of the Illustrious Staff"
 tm_ml2.0011.desc:0 "The Lady stands beside the god now, and the temple will give me a title for her: she of the illustrious staff. A staff is laid on the head, and the title is cut in stone. The Ādiśaiva priests say the staff is theirs to lay, and their fee is gold. The women of the street say Śiva's watchman lent his staff to name the women of the god's temple, and they can lend it again."
 tm_ml2.0011.a:0 "Pay the priests' fee, and have it cut in stone."
 tm_ml2.0011.b:0 "Let the eldest of the street lay the staff."
 tm_ml2.0030.t:0 "Food and Clothing"
 tm_ml2.0030.desc:0 "My court's pandit has read the law books over [tm_ml2_child.GetFirstName]. To him she is “a man in the form of a woman”, and the law bars such a one from inheritance and from the rites. The same law tells the heirs to give food and clothing. That, he says, is all she is owed. Her friends answer that the law books also let a father appoint a daughter as his heir."
 tm_ml2.0030.a:0 "Food and clothing, as the law books say. Not an inheritance."
 tm_ml2.0030.b:0 "An appointed daughter. She stays my heir."
 tm_ml2.0030.c:0 "A share on the temple street, in her own name."
 tm_ml2.0031.t:0 "Of the Third Feeling"
 tm_ml2.0031.desc:0 "A monk of the Jain order has spoken to me about [tm_ml2_daughter.GetFirstName]. His law does not judge by the body but by desire, and he says hers burns like a city on fire. The Order will not house her, he says. She has not asked the Order for anything. She lives in my hall."
 tm_ml2.0031.a:0 "The monk speaks for the Order. I will not go against him."
 tm_ml2.0031.b:0 "The Order's rule is for the Order. My hall is mine."
 tm_ml2.0031.c:0 "Let it lie."
 tm_ml2.0031.d:0 "The Order's own rule admits the skilled. Admit her by it."
 tm_ml2.0032.t:0 "The Order's Terms"
 tm_ml2.0032.desc:0 "[tm_ml2_jain_lord.GetFirstName] has heard the monk out. The Order's rule, the monk says, admits one such as me when she is skilled and well connected, and I keep good accounts and read well. So there is a place for me, on the Order's terms. I did not choose those terms. The women of the street are not women because they are useful, and they do not stay where they are welcome only for their use."
 tm_ml2.0032.a:0 "“I will take the place. Write down that I am a woman, not a skill.”"
 tm_ml2.0032.b:0 "“Keep the place. I did not ask the Order to let me in.”"
 tm_ml2_admitted_modifier:0 "Admitted on the Order's Terms"
 tm_ml2_admitted_modifier_desc:0 "A Svetambara lord has admitted this character under the Order's rule for the skilled. She took the place, and said aloud that the rule was not hers."
 tm_ml2.0040.t:0 "The Reciter"
 tm_ml2.0040.t_vacana:0 "A Singer of Sayings"
 tm_ml2.0040.desc:0 "A reciter has come to [tm_ml2_host.GetFirstName]'s hall with Cēkkizhār's lives of Śiva's servants. Tonight he tells of the merchant's wife of Kāraikkāl, who asked the Lord to take away the beauty she bore for a husband. She was given the form she asked for, and the Lord called her Mother. The hall is quiet, and [tm_ml2_host.GetFirstName] is looking at me."
 tm_ml2.0040.desc_vacana:0 "A singer has come to [tm_ml2_host.GetFirstName]'s hall with the sayings of Basavanna, who served the Lord of the Meeting Rivers. In one he wears men's clothes only for the Lord, and he will be the bride of the Lord's devotees. In Basavanna's life it was a song and a rite. The women of the Garland hear more in it."
 tm_ml2.0040.a:0 "“She asked, and was given the form she asked for.”"
 tm_ml2.0040.a_vacana:0 "“He wore them only for the Lord. I have taken mine off.”"
 tm_ml2.0040.b:0 "Reward the singer in [tm_ml2_host.GetFirstName]'s hall."
 tm_ml2.0040.c:0 "Listen, and keep it to myself."
 tm_ml2_gift_decision:0 "Give to the Temple in My Own Name"
 tm_ml2_gift_decision_desc:0 "The women of the street give to the temple from their own purses, and the gift is cut in its wall under the giver's name."
 tm_ml2_gift_decision_tooltip:0 "Give a lamp, a feeding house or a shrine of the Lady to the temple where you live. With no land of your own, you can also give a lamp through the market assembly of the county, which keeps it for ever."
 tm_ml2_gift_decision_confirm:0 "Go to the temple"
 tm_ml2_share_modifier:0 "A Share on the Temple Street"
 tm_ml2_share_modifier_desc:0 "This character holds a house and a share of the temple's land in her own name. It pays each year while she lives in its county. When she dies, the women of the street choose who takes it up; once the temples grant shares to a woman's descendants, it goes to her daughter first."
 tm_ml2_name_in_stone_modifier:0 "Her Name in the Temple Wall"
 tm_ml2_name_in_stone_modifier_desc:0 "This character's gift to the temple is cut in its wall under her own name."
 tm_ml2_staff_modifier:0 "She of the Illustrious Staff"
 tm_ml2_staff_modifier_desc:0 "A staff has been laid on this character's head, and the temple calls her by the title of the women of the street."
 tm_ml2_street_county_modifier:0 "A Temple Street"
 tm_ml2_street_county_modifier_desc:0 "Women of the Worn Garland hold shares here, and their gifts are cut in the temple wall."
 tm_ml2_nick_talaikkoli:0 "of the Illustrious Staff"
 tm_ml2_nick_talaikkoli_desc:0 "Talaikkōli, “she of the illustrious staff”: a title the temples of the Tamil country gave to the women of the street. Hers is cut in stone beside the Lady she set up."
