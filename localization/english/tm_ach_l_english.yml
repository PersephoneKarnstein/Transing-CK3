 tm_ach_risen_memory_desc:0 "I passed through the Rite of the Knife in the House of [officiant.GetName]"
 tm_ach_risen_memory_desc_second_perspective:0 "you passed through the Rite of the Knife in the House of [officiant.GetName]"
 tm_ach_risen_memory_desc_third_perspective:0 "[owner.GetName] passed through the Rite of the Knife in the House of [officiant.GetName]"
