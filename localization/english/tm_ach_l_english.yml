 tm_ach_officiated_memory:0 "brought someone through the Rite of the Knife"
 tm_ach_officiated_memory_desc:0 "I brought [daughter.GetName] through the Rite of the Knife"
 tm_ach_officiated_memory_desc_second_perspective:0 "you brought [daughter.GetName] through the Rite of the Knife"
 tm_ach_officiated_memory_desc_third_perspective:0 "[owner.GetName] brought [daughter.GetName] through the Rite of the Knife"
