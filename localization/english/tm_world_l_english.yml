l_english:
 # 33. Whispers (tm_world.0001) and the child-lifter rumour (0002, 0003). Every tale is the teller's.
 tm_world.0001.t:0 "Whispers"
 tm_world.0001.desc_seidr:0 "[tm_world_speaker.GetTitledFirstName] is telling my court a tale about [tm_world_sister.GetFirstName] of the House at [tm_world_county.GetName]. She sings men out of their manhood, [tm_world_speaker.GetSheHe] says. Any man who hears her seiðr songs is unmanned, and the young men of the hall should stop their ears."
 tm_world.0001.desc_palace:0 "[tm_world_speaker.GetTitledFirstName] is telling my court a tale about [tm_world_sister.GetFirstName] of the House at [tm_world_county.GetName]. She carries the palace's secrets out under her veil, [tm_world_speaker.GetSheHe] says, and sells what she hears in the women's rooms."
 tm_world.0001.desc_feast:0 "[tm_world_speaker.GetTitledFirstName] is telling my court a tale about [tm_world_sister.GetFirstName] of the House at [tm_world_county.GetName]. At the Jews' feast of Purim, [tm_world_speaker.GetSheHe] says, the young men put on women's dress for the play, and the women of the lamp pray over them until the men under the dress are gone."
 tm_world.0001.desc_garland:0 "[tm_world_speaker.GetTitledFirstName] is telling my court a tale about [tm_world_sister.GetFirstName] of the House at [tm_world_county.GetName]. She wears the garland before it is offered to the god, [tm_world_speaker.GetSheHe] says, as no one may, and so the temple is defiled."
 tm_world.0001.desc_draught:0 "[tm_world_speaker.GetTitledFirstName] is telling my court a tale about [tm_world_sister.GetFirstName] of the House at [tm_world_county.GetName]. She gives the boys of the market a draught, [tm_world_speaker.GetSheHe] says, and they wake up the way she is."
 tm_world.0001.desc_baths:0 "[tm_world_speaker.GetTitledFirstName] is telling my court a tale about [tm_world_sister.GetFirstName] of the House at [tm_world_county.GetName]. She goes to the women's baths and to the convent gate, [tm_world_speaker.GetSheHe] says, to look at the women."
 tm_world.0001.desc_ear:0 "[tm_world_speaker.GetTitledFirstName] is telling my court a tale about [tm_world_sister.GetFirstName] of the House at [tm_world_county.GetName]. She has my ear, [tm_world_speaker.GetSheHe] says, and she turns my mind."
 tm_world.0001.desc_end:0 " The tale has gone round the hall. The House is waiting to see what I will do."
 tm_world.0001.a:0 "Silence it."
 tm_world.0001.b:0 "Let it run. Tales die on their own."
 tm_world.0001.c:0 "Disprove it before the court."
 tm_world.0001.c.success:0 "The tale falls apart in the telling."
 tm_world.0001.c.failure:0 "The court believes what it likes."
 tm_world.0002.t:0 "A Child Missing"
 tm_world.0002.desc:0 "A fuller's boy of [tm_world_county.GetName] did not come home last night. By morning the market had its answer. “Give the alms, or she takes the boy,” the old saying goes, and [tm_world_speaker.GetTitledFirstName] has told my court that the House at [tm_world_county.GetName] has taken him."
 tm_world.0002.a:0 "Forbid the tale."
 tm_world.0002.b:0 "Let the market talk."
 tm_world.0002.c:0 "Send riders to search, and ask the House to open its doors to them."
 tm_world.0003.t:0 "The Boy Is Found"
 tm_world.0003.desc_grandmother:0 "The fuller's boy has been found. He walked to his grandmother's village to see her new lambs, and she kept him two nights before she sent word."
 tm_world.0003.desc_hayloft:0 "The fuller's boy has been found. He fell asleep in a hayloft at the far end of the town, and woke hungry and afraid of a beating."
 tm_world.0003.desc_juggler:0 "The fuller's boy has been found. He followed a juggler down the road, and a carter brought him home."
 tm_world.0003.desc_run:0 " He was never near the House. For three days its door stayed shut while the market talked."
 tm_world.0003.desc_search:0 " He was never near the House. The searchers went through every room of it, and they have said so in the market."
 tm_world.0003.desc_quash:0 " He was never near the House. The tale was forbidden, and some still tell it."
 tm_world.0003.a:0 "Have it cried in the market where he was found."
 tm_world.0003.b:0 "Let the matter drop."

 # 34. Records: Many Ledgers (0010), the physician's record (0011), the copyist (0012).
 tm_world.0010.t:0 "Many Ledgers"
 tm_world.0010.desc_self:0 "Three books keep my name, and they do not agree."
 tm_world.0010.desc:0 "Three books keep the name of [tm_world_daughter.GetFirstName], and they do not agree."
 tm_world.0010.desc_christian:0 " The bishop's register, where the child was baptised, says a son. [tm_world_court.GetTitledFirstName]'s tax roll counts a man of the household for the levy. The House book says a woman. “Your House may write what it likes,” the clerk says. “My roll says a man.”"
 tm_world.0010.desc_islamic:0 " The qadi's register, where the child was named, says a son. [tm_world_court.GetTitledFirstName]'s tax roll counts a man of the household for the levy. The House book says a woman. “Your House may write what it likes,” the clerk says. “My roll says a man.”"
 tm_world.0010.desc_other:0 " The temple's roll, where the child was named, says a son. [tm_world_court.GetTitledFirstName]'s tax roll counts a man of the household for the levy. The House book says a woman. “Your House may write what it likes,” the clerk says. “My roll says a man.”"
 tm_world.0010.desc_end_self:0 " Only one of the three ever asked me."
 tm_world.0010.desc_end:0 " Only one of the three ever asked her."
 tm_world.0010.a:0 "Petition the clergy to amend their register."
 tm_world.0010.b:0 "Pay the clerk to amend the roll."
 tm_world.0010.c:0 "Let the books disagree. We live by the House book."
 tm_world.0011.t:0 "The Physician's Record"
 tm_world.0011.desc_self:0 "A physician of [tm_world_court.GetTitledFirstName]'s court has asked me about my health. In his book he has written that I call myself no woman. I said the opposite, and he wrote it down the other way."
 tm_world.0011.desc:0 "A physician of [tm_world_court.GetTitledFirstName]'s court has asked [tm_world_daughter.GetFirstName] about her health. In his book he has written that she calls herself no woman. She said the opposite, and he wrote it down the other way."
 tm_world.0011.desc_lure:0 " Beside it he writes his warning: it is all a lure for men, and the poor creature does not know what she is."
 tm_world.0011.desc_contagion:0 " Beside it he writes his warning: if this one can, any man can. Keep the boys away."
 tm_world.0011.desc_mutilation:0 " Beside it he writes his verdict on the rites of her sect: they make monsters, not women."
 tm_world.0011.desc_madness_demon:0 " Beside it he writes his diagnosis: a demon has her by the mind, and she should be prayed over."
 tm_world.0011.desc_madness_jinn:0 " Beside it he writes his diagnosis: a jinn has taken her wits, and the Quran should be read over her."
 tm_world.0011.desc_madness_fox:0 " Beside it he writes his diagnosis: a fox spirit has her, as fox spirits take the foolish."
 tm_world.0011.desc_madness:0 " Beside it he writes his diagnosis: it is a sickness of the mind, and the sick beg for strange cures."
 tm_world.0011.a:0 "Answer him in writing: “Ask how we live, not why we are.”"
 tm_world.0011.b:0 "The House will keep a counter-record of what was said."
 tm_world.0011.c:0 "Let it stand."
 tm_world.0012.t:0 "The Copyist"
 tm_world.0012.desc_lamp:0 "A copyist of the Jewish street has made a fair copy of a letter of mine. Wherever the Hebrew marks a woman, he has written me as a man. He says he is only minding the grammar. The women of the lamp have seen it."
 tm_world.0012.desc_way:0 "The clerk who copies the household register has written me under the sons. The old register had a son in that place, he says, and a register does not change for a robe."
 tm_world.0012.a:0 "Correct the copy, word by word."
 tm_world.0012.b_lamp:0 "The women of the lamp will keep a corrected copy."
 tm_world.0012.b_way:0 "The sisters of the Way will keep a corrected copy."
 tm_world.0012.c:0 "Let it pass. I know what I am."

 # 36. Questions in hall (0020), with the Adam's-rib line of 38.
 tm_world.0020.t:0 "A Question in Hall"
 tm_world.0020.desc_self:0 "In the hall of [tm_world_court.GetTitledFirstName], before the guests, [tm_world_speaker.GetTitledFirstName] has a question for me."
 tm_world.0020.desc:0 "In the hall of [tm_world_court.GetTitledFirstName], before the guests, [tm_world_speaker.GetTitledFirstName] has a question for [tm_world_daughter.GetFirstName]."
 tm_world.0020.desc_rib_christian:0 " “God took Eve from Adam's side,” [tm_world_speaker.GetSheHe] says. “Count your ribs. You will find Adam's count.”"
 tm_world.0020.desc_rib_islamic:0 " “Eve was made from Adam's rib,” [tm_world_speaker.GetSheHe] says. “The jurists count the ribs, and yours are the count of a son of Adam.”"
 tm_world.0020.desc_rib_jewish:0 " “Eve was built from Adam's side,” [tm_world_speaker.GetSheHe] says, “and what came forth male is male. Count the ribs, if you doubt it.”"
 tm_world.0020.desc_body:0 " “Tell us what is under the silk,” [tm_world_speaker.GetSheHe] says. “You were born to do the taking. Silk does not change that.”"
 tm_world.0020.desc_origin:0 " “How did this come about?” [tm_world_speaker.GetSheHe] asks. “Was it your mother's loom, or a fever, or a demon of the south wind?” The hall leans in to hear."
 tm_world.0020.desc_end_self:0 " Everyone is watching. If I answer gently, they will call it weakness. If I object, they will call it temper."
 tm_world.0020.desc_end:0 " Everyone is watching. If she answers gently, they will call it weakness. If she objects, they will call it temper."
 tm_world.0020.a:0 "Answer patiently."
 tm_world.0020.b:0 "Object, before them all."
 tm_world.0020.c:0 "[tm_world_ally.GetFirstName] answers for her."
 tm_world.0020.d_bishop:0 "“Does the bishop answer that question? Then neither do I.”"
 tm_world.0020.d_qadi:0 "“Does the qadi answer that question? Then neither do I.”"
 tm_world.0020.d_rabbi:0 "“Does the rabbi answer that question? Then neither do I.”"
 tm_world.0020.d_priest:0 "“Does your priest answer that question? Then neither do I.”"

 # 37. The Court Wonders (0030) and the abbess's feast (0031).
 tm_world.0030.t:0 "The Court Wonders"
 tm_world.0030.desc:0 "My guests stare at [tm_world_daughter.GetFirstName] and ask what she is. Some call her a marvel of nature, like the elephant the caliph sent to Aachen. Some call her a miracle. My chaplain mutters about the devil's deceits."
 tm_world.0030.desc_greek:0 " He reminds me of the Church's rule for wonders: the lives of the saints are there to be wondered at, not walked."
 tm_world.0030.desc_latin:0 " He reminds me of the Church's rule for wonders: non imitandum sed admirandum. They are to be marvelled at, not copied."
 tm_world.0030.a:0 "A marvel of nature. Let the guests see her."
 tm_world.0030.b:0 "A miracle of God's making."
 tm_world.0030.c:0 "A deceit of the devil."
 tm_world.0031.t:0 "The Abbess's Feast"
 tm_world.0031.desc_self:0 "An abbess in the lands of [tm_world_court.GetTitledFirstName] keeps a feast today, and her gate is shut to me."
 tm_world.0031.desc:0 "An abbess in the lands of [tm_world_court.GetTitledFirstName] keeps a feast today, and her gate is shut to [tm_world_daughter.GetFirstName]."
 tm_world.0031.desc_marina:0 " It is the feast of Saint Marina, who lived among the monks as the brother Marinos until her death. The nuns sing her life."
 tm_world.0031.desc_euphrosyne:0 " It is the feast of Saint Euphrosyne of Alexandria, who fled the husband her father chose and lived among the monks as a brother. The nuns sing her life."
 tm_world.0031.desc_pelagia:0 " It is the feast of Saint Pelagia, who left the stage at Antioch and lived as the monk Pelagios on the Mount of Olives. The nuns sing her life."
 tm_world.0031.desc_greek:0 " “We keep the feast of a woman who lived among monks,” the abbess says at the gate. “This one was born a son, and the gate stays shut. Her life is given us to wonder at. It is not a road.”"
 tm_world.0031.desc_latin:0 " “We keep the feast of a woman who lived among monks,” the abbess says at the gate. “This one was born a son, and the gate stays shut. The saints are given to be wondered at, not copied.”"
 tm_world.0031.a:0 "“You sing the women who climbed up to the monks, and curse us for coming down. You keep your saints for wonder. We keep them for example: we imitate.”"
 tm_world.0031.b:0 "“We imitate. That is what a saint is for.”"
 tm_world.0031.c:0 "Keep the feast outside the gate, with the sisters."
 tm_world.0031.d:0 "Go home."

 # 38. The qadi's ruling (0040), Those Without Desire (0041, 0042).
 tm_world.0040.t:0 "The Qadi's Ruling"
 tm_world.0040.desc_self:0 "A qadi of [tm_world_court.GetTitledFirstName]'s court has given a ruling on me."
 tm_world.0040.desc:0 "A qadi of [tm_world_court.GetTitledFirstName]'s court has given a ruling on [tm_world_daughter.GetFirstName]."
 tm_world.0040.desc_sunni:0 " He follows precaution. Where a case is in doubt, the law takes the safer side, and the safer side counts one born a son as a man. He cites the tradition that curses men who make themselves like women."
 tm_world.0040.desc_shii:0 " He cites the judgement of the Commander of the Faithful, who judged by the ribs, for Eve was taken from Adam's side. “As the Commander of the Faithful judged by the ribs,” he writes, “so this court judges.”"
 tm_world.0040.desc_pillars:0 " He cites the judgement of the Commander of the Faithful, who judged by the ribs, for Eve was taken from Adam's side, as al-Qadi al-Numan sets it down in the Pillars of Islam. “As the Commander of the Faithful judged by the ribs,” he writes, “so this court judges.”"
 tm_world.0040.desc_redress_self:0 " He asks that a barber cut my hair, and that my robe be wrapped the way men wrap it, as the law once did on a judge's word."
 tm_world.0040.desc_redress:0 " He asks that a barber cut her hair, and that her robe be wrapped the way men wrap it, as the law once did on a judge's word."
 tm_world.0040.a:0 "“Their court cuts the hair and wraps the robe on a judge's word. Ours waited for hers.”"
 tm_world.0040.b_adelphai:0 "“Count what you like. The Mother does not count ribs.”"
 tm_world.0040.b:0 "“They count ribs to find Adam in us. The Mother counts nothing.”"
 tm_world.0040.c:0 "Keep away from his court, and say nothing."
 tm_world.0041.t:0 "Those Without Desire"
 tm_world.0041.desc:0 "The steward of [tm_world_household.GetTitledFirstName]'s house has found me a place in the women's rooms. He cites the verse of the Light, which lets women be seen unveiled by the men who serve them and have no desire. So I may serve among the women as one without desire. “Let this one serve in the women's rooms, as one without desire,” he says. “No more.” It is a safe place. It is not a woman's place."
 tm_world.0041.a:0 "Take the place. It is safe."
 tm_world.0041.b:0 "“I am a woman. Let me be housed as one.”"
 tm_world.0042.t:0 "Housed as a Woman"
 tm_world.0042.desc:0 "[tm_world_daughter.GetFirstName] will not serve in the women's rooms as one without desire. She says she is a woman, and asks to be housed among the women as one. My steward warns me that the jurists will not like it."
 tm_world.0042.a:0 "House her among the women, as a woman."
 tm_world.0042.b:0 "Keep her out of the women's rooms."

 # 42. The Women's Hour (0050).
 tm_world.0050.t:0 "The Women's Hour"
 tm_world.0050.desc_self:0 "It is the women's hour at a bathhouse in the lands of [tm_world_court.GetTitledFirstName]. The keeper, a matron of the town, stands in the door and will not let me in. “She came in a veil to look at us bathing,” she tells the women behind her. They look at me, and then away."
 tm_world.0050.desc:0 "It is the women's hour at a bathhouse in the lands of [tm_world_court.GetTitledFirstName]. The keeper, a matron of the town, stands in the door and will not let [tm_world_daughter.GetFirstName] in. “She came in a veil to look at us bathing,” she tells the women behind her. They look at [tm_world_daughter.GetFirstName], and then away."
 tm_world.0050.a:0 "Come back at another hour."
 tm_world.0050.b:0 "Go back with the sisters. “You guard the women from a woman.”"
 tm_world.0050.c:0 "[tm_world_protectress.GetFirstName], the House Protectress, will speak for her."
 tm_world.0050.d:0 "Take it to the lord of the town."

 # Modifiers and opinions.
 tm_world_counter_record_modifier:0 "The House's Counter-Record"
 tm_world_counter_record_modifier_desc:0 "A physician wrote that this character calls herself no woman. Her House wrote down what she said."
 tm_world_corrected_copy_modifier:0 "A Corrected Copy"
 tm_world_corrected_copy_modifier_desc:0 "A copyist wrote this character as a man. The women keep a copy that says she."
 tm_world_without_desire_modifier:0 "One Without Desire"
 tm_world_without_desire_modifier_desc:0 "This character serves in the women's rooms as an attendant without desire. It is safe, and it files her as no woman."
 tm_world_silenced_opinion:0 "Silenced My Tale"
 tm_world_let_run_opinion:0 "Let the Tale Run"
 tm_world_objected_opinion:0 "Objected in Hall"
 tm_world_refused_question_opinion:0 "Would Not Answer Me"
 tm_world_answered_for_her_opinion:0 "Answered for Me"
 tm_world_shown_opinion:0 "Showed Me to the Guests"
 tm_world_called_deceit_opinion:0 "Called Me the Devil's Deceit"
 tm_world_housed_as_woman_opinion:0 "Housed Me as a Woman"
 tm_world_kept_out_opinion:0 "Kept Me from the Women's Rooms"
 tm_world_refused_ruling_opinion:0 "Refused the Ruling"

 # Round 2 (T13-T18): hostile voices added to the existing events. Every line is a named speaker's.
 tm_world.0001.desc_chrysostom:0 " The tale has gone round the hall. [tm_world_speaker.GetFirstName] has a word for me as well, from Saint John Chrysostom: whoever is deceived is a little woman, whatever his beard, and the lord who keeps these Sisters is the first to be deceived. The House is waiting to see what I will do."
 tm_world.0011.desc_regret:0 " Beside it he writes his warning: she will regret it, and who will mend her then?"
 tm_world.0011.desc_stoic:0 " Beside it he copies a line from Musonius, the old Stoic of Rome: a man may be many things, but he may not be seen to be a woman. Under it he writes his own diagnosis: this one has forgotten what nature made."
 tm_world.0011.desc_lust:0 " Beside it he writes his diagnosis: it is not a wish to be a woman. It is a hidden lust, and the slowness of her cultivation is the proof."
 tm_world.0011.a_regret:0 "Answer him in writing: “Then let me regret my own life.”"
 tm_world.0011.a_lust:0 "Answer him in writing: “The embryo takes years. That is why it is real.”"
 tm_world.0020.desc_dualist:0 " “Paulicians in a woman's veil,” [tm_world_speaker.GetSheHe] says, as the bishops preach it. “They curse the marriage bed as the devil's work. Ask this one what she thinks of marriage.”"
 tm_world.0020.desc_class:0 " “The priest at the church gate says it plainly,” [tm_world_speaker.GetSheHe] says. “They teach servants to refuse their lords, and they laugh at the elders. A cook ran from my household last month, and the House let her in.”"
 tm_world.0020.desc_crow:0 " “Meet one of them at dawn and turn back home,” [tm_world_speaker.GetSheHe] says, and the hall laughs. “The old satirist had it right. They are crows. No dove will have them, and no raven either.”"
 tm_world.0020.desc_heretic:0 " “They scorn the marriage bed, as the heretics scorn it,” [tm_world_speaker.GetSheHe] says. “So the preachers tell us, and the preachers know heretics.”"
 tm_world.0020.desc_waste:0 " “The plague emptied the fields,” [tm_world_speaker.GetSheHe] says, “and they will not fill them. The land wants hands, and they sow none.”"
 tm_world.0020.desc_paint:0 " “God did not paint your face,” [tm_world_speaker.GetSheHe] says. “Whoever paints it says He made it badly. A Father of the Church wrote that long ago.”"
 tm_world.0020.desc_stranger:0 " “That is a stranger's custom,” [tm_world_speaker.GetSheHe] says. “Our grandmothers never heard of it. Whatever you are, you did not come from us.”"
 tm_world.0020.desc_necessity_chaplain:0 " Then the chaplain of [tm_world_court.GetTitledFirstName] leans close. “No one may wear the other's clothing except in need,” he says quietly. “Tell me your need, and I will tell the lord it is a disguise.”"
 tm_world.0020.desc_necessity_jurist:0 " Then a jurist of [tm_world_court.GetTitledFirstName]'s court leans close. “It is no sin to wear a woman's dress to escape your enemies,” he says quietly. “Name your enemies, and the lord will call it a disguise.”"
 tm_world.0020.b_necessity:0 "“I am not hiding. This is the dress I am seen in.”"
 tm_world.0020.b_crow:0 "“A crow is a bird. I am a woman.”"
 tm_world.0020.b_dualist:0 "“We do not say the world is the devil's. We say the count of wombs is a ledger, not a law.”"
 tm_world.0020.b_heretic:0 "“You call us too chaste and too loose in one breath. Both mean only that we are not yours.”"
 tm_world.0020.e:0 "The House keeps the servant who ran to it."
 tm_world.0020.f_chaplain:0 "Let the chaplain call it a disguise worn in need."
 tm_world.0020.f_jurist:0 "Let the jurist call it a disguise worn in need."

 # T23. Name the Purse (0041, 0050). The modesty plea (0050).
 tm_world.0041.c:0 "Ask whose seal is on the order, and name it before the household."
 tm_world.0050.desc_modesty:0 " “The women must have one place where no one looks at them,” the keeper says."
 tm_world.0050.desc_seal:0 " Her petition to shut the door is sealed. The seal is [tm_world_patron.GetTitledFirstName]'s."
 tm_world.0050.e:0 "Name the purse before the town: [tm_world_patron.GetTitledFirstName] paid for this door."

 # T30a. A Woman in the Line (0051).
 tm_world.0051.t:0 "A Woman in the Line"
 tm_world.0051.desc_self:0 "It is the women's hour again at the bathhouse in [tm_world_bath_county.GetName]. I have stood in the line with my sisters every week since the keeper barred me. Today the keeper comes to the door again. Before she can speak, a townswoman who has bathed beside us all year speaks first. “She has stood in this line longer than you have kept that door,” she says."
 tm_world.0051.desc:0 "It is the women's hour again at the bathhouse in [tm_world_bath_county.GetName]. [tm_world_daughter.GetFirstName] has stood in the line with her sisters every week since the keeper barred her. Today the keeper comes to the door again. Before she can speak, a townswoman who has bathed beside them all year speaks first. “She has stood in this line longer than you have kept that door,” she says."
 tm_world.0051.desc_heard:0 " The women behind her nod. The keeper looks at them, and steps aside."
 tm_world.0051.desc_unheard:0 " The keeper hears her out, and shuts the door all the same. The townswoman stays in the line beside them."
 tm_world.0051.a:0 "Stand in the line again next week."

 # T28. The Confessor's Book (0060) and Women Without a Rule (0061).
 tm_world.0060.t:0 "The Confessor's Book"
 tm_world.0060.desc:0 "The priest who hears confessions at [tm_world_county.GetName] has come to me with his book open. The House's herb-woman, he says, gives the women of the town herbs so that they do not conceive. His book calls it maleficium, an evil working, and sets ten years' penance for it. “But the book judges a poor woman more gently,” he adds, “if hunger drove her to it.” He waits for my word."
 tm_world.0060.a:0 "Let the herb-woman answer him: “Your own book judges the poor more gently. I am poor.”"
 tm_world.0060.b:0 "Pay the penance in alms."
 tm_world.0060.c:0 "Forbid the herbs."
 tm_world.0061.t:0 "Women Without a Rule"
 tm_world.0061.desc:0 "The bishop has written to me about the House at [tm_world_county.GetName]. “Women in common,” he writes, “under no rule and no abbess. The council at Vienne has judged such houses. Let them take a rule the Church knows, or let the house be shut.”"
 tm_world.0061.a:0 "The House will take a rule the bishop knows."
 tm_world.0061.a.tt:0 "The House stays open, under a rule the bishop knows."
 tm_world.0061.b:0 "Refuse. The House lives as it has lived."
 tm_world.0061.c:0 "Pay for a protector's word to the bishop."
 tm_world.0061.c_liege:0 "Pay my liege to speak to the bishop for the House."

 # T26. Ruled as a Man (0070).
 tm_world.0070.t:0 "Ruled as a Man"
 tm_world.0070.desc:0 "[tm_world_ruler.GetFirstName] held [tm_world_ruler_title.GetName] until the day she died."
 tm_world.0070.desc_maliki:0 " Now a scribe of the Maliki school at [tm_world_court.GetTitledFirstName]'s court has written her into his history."
 tm_world.0070.desc_islamic:0 " Now a scribe of [tm_world_court.GetTitledFirstName]'s chancery has written her into his history."
 tm_world.0070.desc_greek:0 " Now a Greek chronicler at [tm_world_court.GetTitledFirstName]'s court has written her into his history."
 tm_world.0070.desc_latin:0 " Now a monk who keeps [tm_world_court.GetTitledFirstName]'s chronicle has written her into his annals."
 tm_world.0070.desc_other:0 " Now a chronicler of [tm_world_court.GetTitledFirstName]'s court has written her into his history."
 tm_world.0070.desc_regent:0 " He writes that she held the seat as a regent, until a man could take it."
 tm_world.0070.desc_heart:0 " He writes that she ruled well, for she had a man's heart. He means it as praise."
 tm_world.0070.a:0 "The House keeps its own record of her reign."
 tm_world.0070.b:0 "Pay the singers to keep her name. “They wrote her as a regent. We sang her as a queen.”"
 tm_world.0070.b_jeli:0 "Pay the jeli to keep her name. “They wrote her as a regent. We sang her as a queen.”"
 tm_world.0070.b_skald:0 "Pay a skald to keep her name. “They wrote her as a regent. We sang her as a queen.”"
 tm_world.0070.b_temple:0 "Pay the temple singers to keep her name. “They wrote her as a regent. We sang her as a queen.”"
 tm_world.0070.c:0 "Let it stand."

 # T32. The mask law (0080).
 tm_world.0080.t:0 "The Crier's Law"
 tm_world.0080.desc:0 "The commune's crier stands in the square of [tm_world_city.GetName] and reads a new law. “By order of the commune,” he calls, “let no one go masked, nor change his dress for the other sex, nor make himself into anything he is not.” The law names no one. The square looks at me all the same."
 tm_world.0080.a:0 "Leave the city for a season."
 tm_world.0080.b:0 "Keep to the house."
 tm_world.0080.c:0 "Pay the fine."
 tm_world.0080.d:0 "Go out, and be cited before the commune's court."

