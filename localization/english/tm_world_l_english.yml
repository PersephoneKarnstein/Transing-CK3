 tm_world_named_purse_opinion:0 "Named My Purse"
 tm_world_took_servant_opinion:0 "Took In My Servant"
 tm_world_necessity_opinion:0 "Called It Necessity"
 tm_world_house_protection_opinion:0 "Paid Me to Speak for the House"

 # T31. Keep Quiet in This Land.
 tm_world_keep_quiet_decision:0 "Keep Quiet in This Land"
 tm_world_keep_quiet_decision_desc:0 "My liege's faith is not mine. Among my sisters I speak aloud. Before strangers I may choose to go unremarked, and no one of my faith will think less of me for it."
 tm_world_keep_quiet_decision_tooltip:0 "Go unremarked before the world's courts while you live in this land."
 tm_world_keep_quiet_decision_confirm:0 "Keep quiet"
 tm_world_keep_quiet_decision.tt:0 "The world's courts are half as likely to single you out. Your faith gives nothing and takes nothing for it. You may speak aloud again at any time."
 tm_world_speak_aloud_decision:0 "Speak Aloud Again"
 tm_world_speak_aloud_decision_desc:0 "Aloud among sisters. Before strangers, as I like. Today I like to be heard."
 tm_world_speak_aloud_decision_tooltip:0 "End Keep Quiet in This Land."
 tm_world_speak_aloud_decision_confirm:0 "Speak aloud"
 tm_world_speak_aloud_decision.tt:0 "The world's courts single you out as often as anyone else. Your faith gives nothing and takes nothing for it."
