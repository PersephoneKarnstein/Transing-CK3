l_english:
 tm_ml5.0001.t:0 "To Her and Her Descendants"
 tm_ml5.0001.desc:0 "The temple council of [tm_ml5_temple_county.GetName] has a deed ready on palm leaf, with a space left for the name. For gold, the temple will grant an honour and cut it in the wall \"to her and her descendants\": the singing of a verse of the Tiruvempāvai at the Tiruvātirai festival in Mārkali, or a place near the god in procession, with the flywhisk. Women of the temples have bought such honours for a hundred years, and now more of them are buying, and richer, than ever. The accountants take their fee either way."
 tm_ml5.0001.a:0 "The verse in Mārkali, for me and my daughters."
 tm_ml5.0001.b:0 "A place near the god, and the flywhisk."
 tm_ml5.0001.c:0 "The gold stays in my house this year."
 tm_ml5_honour_passes_tt:0 "When she dies, the honour passes to her eldest daughter of the faith, born or taken. With none, it goes back to the temple."
 tm_ml5.0002.t:0 "To Her Descendants"
 tm_ml5.0002.desc:0 "[tm_ml5_mother.GetFirstName] is gone. Her name is still in the temple wall, and under it the words the accountants cut for her: to her and her descendants. They read them as written. What she bought from the temple is mine now."
 tm_ml5.0002.a:0 "I will keep it as she kept it."
 tm_ml5.0010.t:0 "The Commentator's Word"
 tm_ml5.0010.desc:0 "A reciter has come to [tm_ml5_host.GetTitledFirstName]'s hall with the new commentary on Nammālvār's songs, made by a disciple of the great teacher. He signs himself śrīvaishnava, as the men of the Lord's temples do now. Where the poet sings as a girl sick with love, the commentary says he speaks \"in the guise of another\". The reciter has heard about [ROOT.Char.GetFirstName]. \"A guise,\" he tells the hall. \"As with the poet, so with her.\"\n\nThe same commentary tells a whole decad of the songs with the poet as \"she\", and her friend knows her \"by her exceeding love\". The book is open on its stand."
 tm_ml5.0010.a:0 "\"Read on. Your teacher knows a girl by her love, not by her guise. So may you.\""
 tm_ml5.0010.a.won:0 "The hall heard her out, and the reciter turned the page"
 tm_ml5.0010.a.lost:0 "The hall laughed with the reciter. She said it anyway"
 tm_ml5.0010.b:0 "\"A guise is put on and taken off. I have nothing to take off.\""
 tm_ml5.0010.c:0 "Let him finish. The verses are lovely, whoever reads them."
 tm_ml5.0011.t:0 "The Girl's Part"
 tm_ml5.0011.desc:0 "This year [ROOT.Char.GetFirstName] went with the pilgrims to the island temple for the festival of recitation. Before the Lord, a man of the old reciting families sang the poet's songs and danced them: the girl sick with love, her mother who cannot name the illness, her friend who can. He played the girl well, and old men wept. Women may not take the part. That is the temple's rule, and the families keep the part from father to son.\n\nShe has had the road home to think it over. The temple lets a man play the girl, and will not let the girl in."
 tm_ml5.0011.a:0 "Say it at the temple gate, where the pilgrims can hear."
 tm_ml5.0011.b:0 "Call out from among the women how the girl should grieve."
 tm_ml5.0011.b.taken:0 "He stopped, bowed toward the women, and played it her way"
 tm_ml5.0011.b.ignored:0 "He played on, as his fathers taught him"
 tm_ml5.0011.c:0 "Bring the song home, and sing it on our street in our own voices."
 tm_ml5.0011.d:0 "It was beautiful. Leave it there."
 tm_ml5.0020.t:0 "Both Temples"
 tm_ml5.0020.desc:0 "The men who keep the temple registers at [tm_ml5_host.GetTitledFirstName]'s seat sign themselves by their Lord now: māhēśvara in Śiva's house, śrīvaishnava in Vishnu's. Neither list has a woman on it. The women of the temples are \"devotees\", and that word is fast becoming theirs alone. At court the two houses contend for the lord's gifts, and the keeper of the share registers has noticed that [ROOT.Char.GetFirstName]'s lamp burns in both. \"One house,\" he says. \"The Lord's men keep one.\""
 tm_ml5.0020.a:0 "Both, as the street always has."
 tm_ml5.0020.b:0 "Let the market keep my lamp in the other house."
 tm_ml5.0020.c:0 "This year, one house. The street will understand."
 tm_ml5.0030.t:0 "The First House in the Quarter"
 tm_ml5.0030.desc:0 "The king's men have gone to his wars, and his officers come to [tm_ml5_temple_county.GetName] less often than they did. The temple council decides more on its own now, and it needs gold: the roads are worse, the temple's fields want watching, and the festivals must be kept all the same. It offers [ROOT.Char.GetFirstName] the first house in the temple quarter and first place at the festivals, to her and her descendants. Women of the temples do well in years like these, where the king's hand is light. The farmers on the temple's land are not asked."
 tm_ml5.0030.a:0 "The first house, then, for me and my daughters."
 tm_ml5.0030.b:0 "Not while the roads are like this."
 tm_ml5.0031.t:0 "The Council's Guard"
 tm_ml5.0031.desc:0 "The temple council of [tm_ml5_council_county.GetName] sends to [ROOT.Char.GetFirstName]'s camp. The king's men are away. The temple's paddy has to reach the granary and the festival car has to go round the streets, and the council will pay a band to walk beside both: a band that will not stay to rule."
 tm_ml5.0031.a:0 "We will walk beside the paddy and the car."
 tm_ml5.0031.b:0 "The band is spoken for."
 tm_ml5_verse_modifier:0 "A Verse in Mārkali"
 tm_ml5_verse_modifier_desc:0 "She bought from the temple the singing of a verse of the Tiruvempāvai in Mārkali, for her and her descendants."
 tm_ml5_procession_modifier:0 "Near the God in Procession"
 tm_ml5_procession_modifier_desc:0 "She bought a place near the god in procession, and the flywhisk, for her and her descendants."
 tm_ml5_first_house_modifier:0 "The First House in the Quarter"
 tm_ml5_first_house_modifier_desc:0 "The first house in the temple quarter, and first place at the festivals, for her and her descendants."
 tm_ml5_answered_modifier:0 "Answered the Commentator"
 tm_ml5_answered_modifier_desc:0 "She answered a reciter out of his own book, and the hall heard her."
 tm_ml5_street_song_county_modifier:0 "The Girl's Part on the Street"
 tm_ml5_street_song_county_modifier_desc:0 "At night the women of the temple street sing the poet's girl in their own voices."
 tm_ml5_registers_slow_modifier:0 "Slow Registers"
 tm_ml5_registers_slow_modifier_desc:0 "The keeper of the share registers takes his time with her paddy."
 tm_ml5_council_guard_county_modifier:0 "The Council's Guard"
 tm_ml5_council_guard_county_modifier_desc:0 "A band of the Garland walks beside the temple's paddy and the festival car while the king's men are away."
