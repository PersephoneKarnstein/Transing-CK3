l_english:
 # Bædling, wave 7: era news and lore (events/tm_bae3_events.txt)
 tm_bae3.0001.t:0 "The King's Example"
 tm_bae3.0001.desc:0 "[tm_bae3_teller.GetFirstName] told it at the fire, low, so that the far end of the benches would not hear."
 tm_bae3.0001.desc.norway:0 " The king has taken the cross, she said, and he wants the old rites gone from the land. He gathered sorcerers at a feast and made an example of them, and the seiðmenn who would not take the cross he drove from the land."
 tm_bae3.0001.desc.iceland:0 " At the Althing it was ruled that everyone must be baptised, and that what is done where no one sees it is no one's business. \"For now,\" she said. \"Within a few years they will want the hidden rites too.\""
 tm_bae3.0001.desc.denmark:0 " The king's priest carried the hot iron in his bare hand before the whole court and showed them his hand unburned, she said, and the king was baptised the same year. Now the priests want the old rites out of the land, and the king listens to them."
 tm_bae3.0001.desc.sweden:0 " The king has taken the cross, she said, and the old feast at Uppsala is to be kept no longer. His priests want the old rites out of the land, and a new king likes to show his priests an example."
 tm_bae3.0001.desc.end:0 "\n\n\"Do not tell yourself the old kings were kinder,\" she said. \"A king who sacrificed to Óðinn burned his own brother and eighty men he called seiðmenn, and the skalds praised him for it. The kings change their gods. The fire does not change.\""
 tm_bae3.0001.a:0 "Behind closed doors, then."
 tm_bae3.0001.a.tt:0 "What is done where no one sees it is safe, for now."
 tm_bae3.0001.b:0 "In the hall, where they have always been."
 tm_bae3.0001.c:0 "I will go where the six faiths keep court."
 tm_bae3.0001.c.tt:0 "I leave this realm for a court of the six faiths beyond it, if one will have me; otherwise the road."
 tm_bae3_open_rites_opinion:0 "Keeps the old rites openly"

 tm_bae3.0010.t:0 "The Bishop's Letter"
 tm_bae3.0010.desc:0 "[tm_bae3_bishop.GetShortUINameNotMe|U] came with a letter under the bishop's seal and read it out in my hall. No one in the diocese is to bring offerings to the House at [tm_bae3_house_county.GetNameNoTier], or go there on pilgrimage, or fast or pray there. \"What is done in that house,\" he read, \"is pagan illusion and sin.\"\n\nThe letter names no one and summons no one. It does not need to."
 tm_bae3.0010.a:0 "Obey the letter."
 tm_bae3.0010.a.tt:0 "The pilgrims stop coming. The House must manage with fewer hands and less bread."
 tm_bae3.0010.b:0 "Close the doors, and keep the rites inside."
 tm_bae3.0010.c:0 "Answer the bishop."
 tm_bae3.0010.c.success:0 "My answer is copied and read in other halls. The bishop lets the matter rest."
 tm_bae3.0010.c.failure:0 "The bishop takes my answer as an insult, and the pilgrims are afraid to come."
 tm_bae3_answered_bishop_opinion:0 "Answered the bishop's letter"

 tm_bae3.0020.t:0 "Word from the Islands"
 tm_bae3.0020.desc.1343:0 "A ship in from the west brought the news along with the dried fish: in Iceland a woman has been burned on the bishop's sentence for sorcery.\n\nThe sailors had nothing more to tell. No one on the quay asked them for more, and no one looked at me while they said it."
 tm_bae3.0020.desc.1407:0 "Another ship, another year. Word has come from the far islands in the west that a man was burned there on the bishop's sentence for sorcery.\n\nThat is all the sailors knew. It is enough to make the whole coast quiet for a season."
 tm_bae3.0020.a:0 "Keep my head down."
 tm_bae3.0020.b:0 "Light a lamp for the dead."
 tm_bae3_islands_fear_modifier:0 "Word from the Islands"
 tm_bae3_islands_fear_modifier_desc:0 "News has come of a burning on the bishop's sentence. This character is careful who she speaks to."

 tm_bae3.0100.t:0 "They Say He Keeps Seiðmenn"
 tm_bae3.0100.desc:0 "[tm_bae3_rival.GetShortUINameNotMe|U] has been telling every hall that will listen that I keep seiðmenn at my court. \"Unmanly men at his elbow, doing a woman's sorcery,\" he says, \"and a lord grown soft listening to them.\" He names [tm_bae3_seidr_one.GetFirstName] when he says it, and he names me.\n\nWhether there is anything in it does not matter to him. It is enough that it is said, and the lords who do not share my faith are already repeating it."
 tm_bae3.0100.a:0 "Deny it, and make him look a liar."
 tm_bae3.0100.a.success:0 "The story falls apart in his own mouth, and the halls laugh at him instead."
 tm_bae3.0100.a.failure:0 "The more I deny it, the better the story sounds."
 tm_bae3.0100.b:0 "Answer him with steel."
 tm_bae3.0100.b.tt:0 "I challenge him to a bout before witnesses. Whoever loses it loses the argument."
 tm_bae3.0100.b.success:0 "The bout goes to me. No one repeats the story where I can hear it."
 tm_bae3.0100.b.failure:0 "The bout goes to him, and the story travels further for it."
 tm_bae3.0100.c:0 "Let him say it. Seiðr is ours."
 tm_bae3.0100.c.tt:0 "He meant it as an insult, so I count it as a wrong and enter it in the Account between our houses. The Christian lords will think less of me for it."
 tm_bae3_seidmenn_rumour_opinion:0 "Said to keep seiðmenn"
 tm_bae3_owned_seidr_opinion:0 "Owned the old art"
 house_relation_reason_tm_bae3_seidr_slander_desc:0 "[char.GetShortUINameNotMe|U] slandered [target_char.GetShortUINameNotMe] as a keeper of seiðmenn"

 tm_bae3_warding_shirt_interaction:0 "Weave the Warding Shirt"
 tm_bae3_warding_shirt_interaction_desc:0 "Weave [recipient.GetFirstName] a shirt at the loom, with the warding songs sung into the cloth. No blade will bite it. Ask a woman, not a smith."
 tm_bae3_warding_shirt_modifier:0 "Warding Shirt"
 tm_bae3_warding_shirt_modifier_desc:0 "Woven at the loom with the warding songs sung into the cloth. Women wove the shirts while men made the swords."
 tm_bae3_warding_shirt_opinion:0 "Wove me a warding shirt"

 tm_bae3.0200.t:0 "The Hall of the Eighty"
 tm_bae3.0200.desc:0 "The skalds still tell how Eiríkr, before he was king here at York, burned his own brother and eighty men he called seiðmenn, and how he was much praised for the deed. He was a king who sacrificed to the old gods when he did it. His queen, they say, learned sorcery herself, and cursed a poet so that he would never know peace in Iceland. And when the York host fell at Tettenhall, a man the English chronicle calls Osferð hlytte, the seer, fell with it.\n\nThe faith counts the Eighty as its kin. York is mine now, and the faith holds it as a debt."
 tm_bae3.0200.a:0 "We remember the Eighty."
 tm_bae3_site_york_modifier:0 "The Hall of the Eighty"
 tm_bae3_site_york_modifier_desc:0 "A ruler of the faith holds York, and remembers the Eighty."

 tm_bae3.0201.t:0 "Hǫlgabrúðr's Hail"
 tm_bae3.0201.desc:0 "Here in Þrándheimr the old jarls kept the hooded image of Þorgerðr Hǫlgabrúðr. At Hjǫrungavágr, when the battle was going against him, the jarl called on her, and a storm of hail came out of the north into his enemies' faces. The men who were there said an arrow flew from every finger of her, and each one killed a man.\n\nShe gave prophecy as a völva does. The priests who came after had other things to say about her, and we do not repeat them."
 tm_bae3.0201.a:0 "Hail from the north."
 tm_bae3_site_trondheim_modifier:0 "Hǫlgabrúðr's Hail"
 tm_bae3_site_trondheim_modifier_desc:0 "A ruler of the faith holds Þrándheimr, where the jarls kept Þorgerðr's hooded image."

 tm_bae3.0202.t:0 "The Women at Dorostolon"
 tm_bae3.0202.desc:0 "When the Rus' of Kyiv were beaten by the Greeks at Dorostolon, the Greeks went over the field afterwards and found women in armour among the dead. Their chroniclers wrote it down as a marvel, and went on to other things.\n\n\"The Greeks did not know what they were,\" the faith says here. The road south has remembered them since."
 tm_bae3.0202.a:0 "The road south remembers them."
 tm_bae3_site_kyiv_modifier:0 "The Women at Dorostolon"
 tm_bae3_site_kyiv_modifier_desc:0 "A ruler of the faith holds Kyiv, and the road south remembers the women in armour."

 tm_bae3.0203.t:0 "The Bells of Uppsala"
 tm_bae3.0203.desc:0 "The Danes have an old story of a champion who served the kings at Uppsala for seven years and then left in disgust. At the sacrifices he could not bear the effeminate gestures of the mimes on the stage, or what he called the unmanly clatter of the bells.\n\nThe great hall at Uppsala is mine now. When the feast comes round, we ring the bells."
 tm_bae3.0203.a:0 "And louder than before."
 tm_bae3_site_uppsala_modifier:0 "The Bells of Uppsala"
 tm_bae3_site_uppsala_modifier_desc:0 "A ruler of the faith holds Uppsala, and the bells ring at the feasts."

 tm_bae3.0204.t:0 "The Stones at Lärbro"
 tm_bae3.0204.desc:0 "On the picture stones at Lärbro there are bearded figures in women's gowns, holding the horn. Nobody alive knows who carved them, or who they were meant to be. The farmers walk past them without looking.\n\nThe faith counts them as kin, and its women keep the stones swept."
 tm_bae3.0204.a:0 "Keep the stones swept."
 tm_bae3_site_gotland_modifier:0 "The Stones at Lärbro"
 tm_bae3_site_gotland_modifier_desc:0 "A ruler of the faith holds Gotland, and its women keep the stones at Lärbro swept."

 tm_bae3.0300.t:0 "Calling Herself"
 tm_bae3.0300.desc:0 "[tm_bae3_broiderer.GetFirstName] keeps a bench of fine work near the market: purses, girdles, the borders of altar-cloths. She is old enough to have stopped caring what the street says, and she has taken me on."
 tm_bae3.0300.desc.tapster:0 " I draw ale at an inn by day, and in the evenings I sit at her bench and learn the stitches."
 tm_bae3.0300.desc.broiderer:0 " I work at her bench all day now, and my stitches are nearly as small as hers."
 tm_bae3.0300.desc.unnamed:0 "\n\nToday she looked up from the frame and said that a woman at her bench ought to have a woman's name. She asked whether I would let her give me one, or whether I had one of my own already."
 tm_bae3.0300.desc.named:0 "\n\nShe has never once called me anything but my own name. When a neighbour asked her who I was, she told her, and went on stitching."
 tm_bae3.0300.a:0 "Take the name she gives me."
 tm_bae3.0300.b:0 "I have my own."
 tm_bae3.0300.c:0 "Not yet."
 tm_bae3.0300.d:0 "Learn the trade at her bench."
 tm_bae3_broiderer_opinion:0 "Took me on at the bench"

 tm_bae3.0301.t:0 "The Town Court"
 tm_bae3.0301.desc:0 "The night watch stopped me on my way home late from work, and since nobody could decide what to do with me at that hour, they brought me before the court of [tm_bae3_town_lord.GetShortUINameNotMe] in the morning.\n\nThe clerk had his pen ready. \"Your name,\" he said, and waited."
 tm_bae3.0301.a:0 "Give my own name."
 tm_bae3.0301.a.tt:0 "I gave my name, and the clerk wrote it down. Whatever else they wrote beside it, that stands."
 tm_bae3.0301.b:0 "Say nothing."
 tm_bae3.0301.b.tt:0 "They let me go at noon. What the clerk wrote, he wrote without my help."
