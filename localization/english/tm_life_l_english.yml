l_english:
 tm_life.0001.t:0 "The House Grows Respectable"
 tm_life.0001.desc:0 "The House at [tm_house_county.GetName] has stood for a generation. Women of good family live in it now. [tm_life_patron.GetFirstName], who gives to the House, has come with [tm_life_highborn.GetFirstName] to ask a favour. The street daughters, they say, give the House a name it does not need. Let them find another door.\n\nThe faith has its answer, and it is no. The door that let the high-born in is the same door."
 tm_life.0001.a:0 "The door stays open."
 tm_life.0001.b:0 "Shut it to the street, as they ask."
 tm_life.0010.t:0 "Owed Grandchildren"
 tm_life.0010.desc:0 "[tm_life_kin.GetFirstName] has come to see me, and not to talk about the weather. Love whom I like, she says, and live as I like. But she is owed grandchildren, and she means to have them.\n\nThe faith holds that a woman who bears no child has failed at nothing. It also holds that kinship is made as well as born."
 tm_life.0010.a:0 "Then I will take [tm_life_candidate.GetFirstName] as my daughter."
 tm_life.0010.b:0 "I will foster [tm_life_candidate.GetFirstName]."
 tm_life.0010.c:0 "I owe no one a child."
 tm_life.0011.t:0 "Mourning the One Who Is Here"
 tm_life.0011.desc:0 "[tm_life_kin.GetFirstName] has been weeping again, a sister tells me, for the son [tm_life_kin.GetSheHe] lost. No one was lost. I am here, at the same table, and I answer when I am called. But [tm_life_kin.GetFirstName] grieves all the same, and that is not mine to forbid."
 tm_life.0011.a:0 "Let [tm_life_kin.GetHerHim] grieve, and stay near."
 tm_life.0011.b:0 "Ask the House to speak with [tm_life_kin.GetHerHim]."
 tm_life.0011.b.heard:0 "[tm_life_kin.GetFirstName] listened"
 tm_life.0011.b.not_yet:0 "Not yet"
 tm_life.0011.c:0 "Keep my distance a while."
 tm_life.0012.t:0 "Under Her Own Name"
 tm_life.0012.desc:0 "[tm_dead_daughter.GetFirstName] is dead. [tm_life_kin.GetFirstName], her blood kin, has come for her body, and means to bury her under the name she was given at birth. The sisters would bury her under her own name. They ask whether I will stand between them."
 tm_life.0012.a:0 "Pay the kin. The House buries her under her own name."
 tm_life.0012.b:0 "Let a sister speak with [tm_life_kin.GetFirstName]."
 tm_life.0012.b.heard:0 "The kin let the House bury her"
 tm_life.0012.b.taken:0 "The kin took her home"
 tm_life.0012.c:0 "The House buries her, whatever her kin say."
 tm_life.0012.d:0 "Let her blood kin take her."
 tm_life.0020.t:0 "Kin, People or Sisters?"
 tm_life.0020.desc:0 "[tm_life_lord.GetFirstName]'s court is kind to me, in its way. But at table [tm_life_asker.GetFirstName] asks again, as someone always does. To whom do I really belong? To my kin, to my people, or to the women I call sisters?"
 tm_life.0020.a:0 "To my kin."
 tm_life.0020.b:0 "To my people."
 tm_life.0020.c:0 "I am no one's to claim. I am hers who calls me sister."
 tm_life.0020.d:0 "To this court, which has kept me."
 tm_life.0030.t:0 "The Novice Years"
 tm_life.0030.desc_shoes:0 "[tm_life_novice.GetFirstName] has been with the House a while now. This week a sister borrowed [tm_life_novice.GetFirstName]'s shoes for the market and brought them back muddy. That was the week."
 tm_life.0030.desc_late:0 "The priestess who teaches the novices is late again. [tm_life_novice.GetFirstName] sits on the bench with the others and waits. In the end the lesson is put off until tomorrow."
 tm_life.0030.desc_spring:0 "Spring has come and gone, and nothing happened. [tm_life_novice.GetFirstName] swept the yard, ate with the sisters and slept. The rite is still a long way off."
 tm_life.0030.a:0 "There is nothing to do but wait."
 tm_life.0030.b:0 "Send a little something to the novices' table."
 tm_life.0031.t:0 "Not Yet"
 tm_life.0031.desc_hem:0 "My rite is not yet. I wake, I work, I eat with the others. A sister let out the hem of my good dress, and it hangs better now."
 tm_life.0031.desc_asked:0 "I asked again when my turn will come. The answer was the same as before: not this season. So I wait, as the women before me waited."
 tm_life.0031.desc_nothing:0 "Nothing has happened this year. Most of the road, it turns out, is like this."
 tm_life.0031.a:0 "And so I wait."
 tm_life.0032.t:0 "Lady"
 tm_life.0032.desc:0 "At the market a woman selling thread called me lady, gave me my change, and turned to the next buyer. That was all. She did not look twice. Nobody at home has said a word about it, because there was nothing to say."
 tm_life.0032.a:0 "Lady. Yes."
 tm_life.0033.t:0 "The Old Likeness"
 tm_life.0033.desc:0 "A box has come from the house I grew up in. Inside, wrapped in cloth, is a likeness made of me before my rite. It shows what the painter saw. The sisters say what the women before them said: it is yours, and either way is honoured. Keep it sealed, or give it to the fire."
 tm_life.0033.a:0 "Seal it, and keep it with the House's things."
 tm_life.0033.b:0 "Burn it, with my sisters beside me."
 tm_life.0034.t:0 "A Name of Her Own"
 tm_life.0034.desc:0 "I have a good name, and I answer to it. But a sister tells me that the women of her family take another as well, one that carries something of their own: a foremother's name, or the name of a woman who stood by them. It is mine to choose, or not."
 tm_life.0034.a:0 "My mother's name: [tm_life_foremother.GetFirstName]."
 tm_life.0034.b:0 "My grandmother's name: [tm_life_grandmother.GetFirstName]."
 tm_life.0034.c:0 "[tm_life_friend.GetFirstName]'s name. She stood by me."
 tm_life.0034.d:0 "I keep the name I carry."
 tm_life.0040.t:0 "The Midwife Could Not Say"
 tm_life.0040.desc:0 "[tm_life_mother.GetFirstName] has given birth. The midwife could not say whether the child is a boy or a girl, and a physician has come with a knife and with bindings, to settle it for the child.\n\nThe faith will not allow it. No one cuts or binds a child to make a body fit a word. The clerks have written something in the register, because they must, and the faith calls it a guess. The child will choose when grown."
 tm_life.0040.a:0 "Cover the cradle. The child will choose."
 tm_life.0040.b:0 "Cover the cradle, and send away whoever came to stare."
 tm_life.0041.t:0 "The Choice Kept for Me"
 tm_life.0041.desc:0 "When I was born the midwife could not say what I was, and the House would let no one cut me to decide it. The clerks wrote down a guess. Now I am sixteen, and the women who kept the choice for me ask what I am."
 tm_life.0041.a:0 "What they wrote is right."
 tm_life.0041.b:0 "I am a woman."
 tm_life.0041.b.tt:0 "The House's roads are open to her, as to any sister: she may declare before witnesses."
 tm_life.0041.c:0 "I am a man."
 tm_life.0050.t:0 "Respect Your Elder"
 tm_life.0050.desc:0 "[tm_life_junior.GetFirstName] worked the whole season, at the feasts and in the fields, and [tm_life_senior.GetFirstName] has taken what she earned. "Respect your elder," [tm_life_senior.GetFirstName] says, and it is not the first time.\n\nThe faith keeps its elders, and it keeps the young as well. Seniority is a place in the line. It is not a licence to take."
 tm_life.0050.a:0 "What [tm_life_junior.GetFirstName] earned is hers. Give it back."
 tm_life.0050.b:0 "Let the women of the compound settle it."
 tm_life.0050.b.settled:0 "The women gave it back to her"
 tm_life.0050.b.not_settled:0 "The women would not cross an elder"
 tm_life.0050.c:0 "An elder's word stands."
 tm_life.0051.t:0 "What the Dancer Earned"
 tm_life.0051.desc:0 "The naming feast is over. The guests pressed gifts on the dancers, as guests do, and some were pressed on me. The women of the compound count them out, and one of the elders holds out her hand.\n\nThe faith is plain about it. What a daughter earns serving at a feast is hers. She serves to learn the feast, not to pay for her place."
 tm_life.0051.a:0 "Keep what I earned."
 tm_life.0051.b:0 "Give the elder a share, as a gift. It was never owed."
 tm_life.0060.t:0 "We Woke Each Other First"
 tm_life.0060.desc:0 "The women I kept the vow with come to my door before dawn, as we once came to each other's. A priest of the temple tells our vow as a wedding: the god took a bride. My companions tell it another way. We woke each other first, they say, and the god after. The faith holds with them. The god is our devotion, not our completion."
 tm_life.0060.a:0 "Go out with them before dawn."
 tm_life.0060.b:0 "Sing at the temple with them."
 tm_life.0061.t:0 "Outside the Wall"
 tm_life.0061.desc:0 "[tm_life_seeker.GetFirstName] has come to ask to keep the pāvai vow with the girls of the street. Her people may not walk the temple street. The temple has kept them outside its walls for as long as anyone remembers. The singers tell of Nantanar, who stood outside a temple of Śiva and was let in only after the fire made him a Brahman.\n\nThe temple street is not free of the temple's rules, and it has never pretended to be. She asks whether the circle will take her."
 tm_life.0061.a:0 "The circle takes her, and walks the temple street with her."
 tm_life.0061.b:0 "The circle takes her, and keeps the vow with her outside the wall."
 tm_life.0061.c:0 "The temple's rule stands. Send her home with food."
 tm_life.0070.t:0 "The Palace Step"
 tm_life.0070.desc:0 "Among the palace women, bound feet have become the mark of a lady. The ladies of the household press me to bind mine before I come to them again.\n\nThe Way says the court's beauty is a cage, and the woman inside it is still a sister. It punishes neither the one who binds to pass the palace gate nor the one who refuses."
 tm_life.0070.a:0 "Bind, to pass the palace gate."
 tm_life.0070.b:0 "Refuse."
 tm_life.0080.t:0 "They Have Gone Too Far"
 tm_life.0080.desc:0 "[tm_life_preacher.GetTitledFirstName] has preached against us. Let them keep their few Houses, [tm_life_preacher.GetSheHe] said, but now they take whole duchies. They have gone too far, and the faithful must not let them go further.\n\nThe sisters say what they have always said. There was never a size at which we would have been small enough."
 tm_life.0080.a:0 "Let them preach."
 tm_life.0080.b:0 "Answer from our own pulpits."
 tm_life_door_kept_open_opinion:0 "Kept the House Open to the Street"
 tm_life_door_shut_for_me_opinion:0 "Shut the House to the Street"
 tm_life_door_shut_opinion:0 "Shut the Door on Women Like Me"
 tm_life_kept_from_kin_opinion:0 "Kept Our Kinswoman from Us"
 tm_life_rebuked_senior_opinion:0 "Rebuked Me Before the Young"
 tm_life_gone_too_far_opinion:0 "Gone Too Far"
 tm_life_open_door_modifier:0 "The Open Door"
 tm_life_open_door_modifier_desc:0 "This character kept the House's door open to the street daughters, when the high-born asked it shut."
 tm_life_own_earnings_modifier:0 "What She Earned"
 tm_life_own_earnings_modifier_desc:0 "This character kept what she earned serving at a naming feast. It is hers."
