l_english:
 tm_ml4.0002.t:0 "The Tai Bath"
 tm_ml4.0002.desc:0 "Markali is over, and the girls who bathed together at dawn have gone back to their houses. The old poems keep a second bath, in Tai, and that one is kept alone. Before first light she draws the kolam on the street in front of her door, goes down to the water before the sun, and eats once a day. The girls of the old songs asked for rain and for a husband. The bath is addressed to Kama, who makes people love, and what she asks of him at the end of the month is hers to say."
 tm_ml4.0002.a:0 "Keep it alone, for the month."
 tm_ml4.0002.b:0 "Not this Tai. Markali was enough."
 tm_ml4.0003.t:0 "What She Asks of Kama"
 tm_ml4.0003.desc:0 "The month is done. Every morning there has been a new kolam at her door, and every morning the feet of the street have worn it away by noon. She has bathed before the sun thirty times. Now she asks."
 tm_ml4.0003.a:0 "Rain for the country, as the girls of the old songs asked."
 tm_ml4.0003.b:0 "A love of my own. Kama knows whom."
 tm_ml4.0003.c:0 "Nothing. The bath was the asking."
 tm_ml4_tai_decision:0 "Keep the Tai Bath"
 tm_ml4_tai_decision_desc:0 "In Tai, the month after Markali, a daughter of the Garland may keep the old second bath alone: a kolam at her door before dawn, a bath before the sun, one meal a day, for a month, addressed to Kama."
 tm_ml4_tai_decision_tooltip:0 "Keep the Tai bath for a month. At its end, ask Kama for rain, for love, or for nothing."
 tm_ml4_tai_decision_confirm:0 "Go down to the water"
 tm_ml4.0010.t:0 "Those Who Always Accompany Us"
 tm_ml4.0010.desc:0 "The merchants of [tm_ml4_lord.GetTitledFirstName]'s market town have watched [ROOT.Char.GetFirstName]'s band bring their caravans to the coast and back. Now their headmen come to the camp with their lord's leave. They do not want another contract. They want an oath: that the band will be among \"those who always accompany us\", and that the merchants will keep faith with the band in turn. It is not kinship. It is a road kept by both ends."
 tm_ml4.0010.a:0 "We swear. Where your carts go, we go."
 tm_ml4.0010.b:0 "We are hired, not sworn."
 tm_ml4.0011.t:0 "The Band Has Sworn"
 tm_ml4.0011.desc:0 "The merchants of my market town have sworn with [tm_ml4_band.GetFirstName]'s band, and the band with them. My roads will be kept by people who mean to keep them."
 tm_ml4.0011.a:0 "Good."
 tm_ml4.0012.t:0 "A Third Temple"
 tm_ml4.0012.desc:0 "[tm_ml4_king.GetTitledFirstName] keeps a temple of the Buddha's relics, and wants soldiers at its gates who are not his own lords' men. Soldiers from the mainland have kept such gates in this island. He offers it to [ROOT.Char.GetFirstName]'s band, and has invited the merchants of the port to witness. The women of the Garland served two temples on their street, Shiva's and Vishnu's. The band can guard a third."
 tm_ml4.0012.desc.sworn:0 " The merchants the band is sworn with come to stand beside it at the gate."
 tm_ml4.0012.a:0 "We will keep the gate."
 tm_ml4.0012.b:0 "The road is the band's temple."
 tm_ml4.0020.t:0 "A Hall in the Name of the Guild"
 tm_ml4.0020.desc:0 "Merchants' regiments in the Chola country paid for halls before the temples of the towns they guarded, and cut the guild's name over the door. [ROOT.Char.GetFirstName]'s band has gold enough to do the same in [tm_ml4_hall_lord.GetTitledFirstName]'s capital: a pillared hall before the temple, in the name of the merchants the band keeps the road for. The temple street would have the band's hall at its end."
 tm_ml4.0020.a:0 "Raise the hall, and cut the guild's name over the door."
 tm_ml4.0020.b:0 "The gold stays with the band."
 tm_ml4.0030.t:0 "The Road to Kanchi"
 tm_ml4.0030.desc:0 "The road to Kanchipuram passes Virincipuram, and at the rest house the merchants tell a story they say is cut in the temple there: a pepper merchant afraid of robbers on this road vowed ten bags of pepper to the god of the place if he came to Kanchi safe. He came safe, and forgot, and in the market every bag he opened was full of green gram until he paid. The road ahead is long and the scrub is thick."
 tm_ml4.0030.a:0 "Vow the pepper. Ten bags, if I come safe."
 tm_ml4.0030.b:0 "I trust my guards, not a story."
 tm_ml4.0031.t:0 "Safe at Kanchi"
 tm_ml4.0031.desc:0 "[ROOT.Char.GetFirstName] has come to Kanchipuram without a robber in sight. Somewhere behind on the road is the god of Virincipuram, and ten bags of pepper."
 tm_ml4.0031.a:0 "Send the pepper back down the road."
 tm_ml4.0031.b:0 "Safe is safe. The god has the story; let him keep it."
 tm_ml4_pay_vow_decision:0 "Pay the Pepper Vow"
 tm_ml4_pay_vow_decision_desc:0 "In the market, every bag opened is full of green gram. The god of Virincipuram is still waiting for his pepper."
 tm_ml4_pay_vow_decision_tooltip:0 "Send the ten bags of pepper you vowed on the road to Kanchi."
 tm_ml4_pay_vow_decision_confirm:0 "Send the pepper"
 tm_ml4_swear_decision:0 "Swear with the Merchants"
 tm_ml4_swear_decision_desc:0 "The band has kept the road for these merchants' caravans. It may swear to be among those who always accompany them, and they to keep faith with the band."
 tm_ml4_swear_decision_tooltip:0 "Swear with the merchants of the lord whose caravans you last guarded. Their caravans will pay more, and their lord's capital will be easier to keep."
 tm_ml4_swear_decision_confirm:0 "Swear"
 tm_ml4_tai_keeping_modifier:0 "Keeping the Tai Bath"
 tm_ml4_tai_keeping_modifier_desc:0 "A kolam at her door before dawn, a bath before the sun, one meal a day."
 tm_ml4_kama_modifier:0 "Asked Kama"
 tm_ml4_kama_modifier_desc:0 "At the end of the Tai bath she asked for a love of her own."
 tm_ml4_tai_rain_county_modifier:0 "Rain Asked for at the Tai Bath"
 tm_ml4_tai_rain_county_modifier_desc:0 "A daughter of the Worn Garland kept the Tai bath and asked for rain for the country."
 tm_ml4_accompanied_county_modifier:0 "Those Who Always Accompany Us"
 tm_ml4_accompanied_county_modifier_desc:0 "A band sworn with this town's merchants keeps its roads."
 tm_ml4_relic_guard_modifier:0 "Guards of the Third Temple"
 tm_ml4_relic_guard_modifier_desc:0 "The band keeps the gate of a temple of the Buddha's relics, for its king."
 tm_ml4_green_gram_modifier:0 "Green Gram in the Bags"
 tm_ml4_green_gram_modifier_desc:0 "A vow made on the road to Kanchi is still unpaid, and the market knows it."
 tm_ml4_accompany_opinion:0 "Always Accompanies Us"
 tm_ml4_hall_opinion:0 "Raised a Hall in My Capital"
 tm_ml4_band_and_street_opinion:0 "Raised a Hall on My Street"
 tm_ml4_relic_guard_opinion:0 "Guards My Relic Temple"
 tm_ml4_is_tai_custom:0 "It is Tai (January or February)"
 tm_ml4_tai_keeper_custom:0 "Not keeping the pavai vow, and no Tai bath in the last three years"
 tm_ml4_could_swear_custom:0 "Has guarded caravans for a landed lord who is alive, and is not sworn already"
