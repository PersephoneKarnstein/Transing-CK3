l_english:
 tm_rx.0001.t:0 "The Bishop's Court"
 tm_rx.0001.desc:0 "A will is before the court of [tm_rx_court.GetTitledFirstName]'s bishop, and [ROOT.Char.GetFirstName] was a witness to it. A church court weighs a woman's witness by its own rules, so the bishop's canonist must first write down which she is. His books have one rule for a person of whose sex a court is in doubt. It was not written for her, but it is the only rule he has, and he reaches for it."
 tm_rx.0001.desc_huguccio:0 " It is Huguccio's, and it counts only what anyone can see and what the person says: whose company she keeps, and whose work she does. He asks to see nothing. The canonists never did. \"If she keeps the company of women and does women's work,\" he says, \"the woman prevails. Tell me, and I will write it.\""
 tm_rx.0001.desc_hostiensis:0 " It is from the Summa of Hostiensis: such a person should swear before the bishop to keep to one sex, and never change afterwards. He asks to see nothing. The oath is all his canons want. \"Swear it before me, and keep to it,\" he says. \"The canons fear only a turning back.\""
 tm_rx.0001.a:0 "My company is women, and my work is women's work. Write it."
 tm_rx.0001.b:0 "I will not be weighed by my spindle. Write what your book likes."
 tm_rx.0001.c:0 "I swear it. It was my word before it was your oath."
 tm_rx.0001.c.tt:0 "The oath is her own word, written down. The bishop grants her nothing she did not have."
 tm_rx.0001.d:0 "I will swear that I am a woman. No woman is made to swear for the rest of her life."
 tm_rx.0001.e:0 "Not today. The will can wait for its witness."
 tm_rx.0001.e.tt:0 "Nothing is written. The court may ask again another year."

 tm_rx.0002.t:0 "A Master from Paris"
 tm_rx.0002.desc:0 "A master of theology from Paris, of the school of the Chanter of Notre-Dame, is a guest at [tm_rx_court.GetTitledFirstName]'s court, and he has seen [ROOT.Char.GetFirstName] in the hall. Tonight he preaches before it. \"God made them male and female,\" he says, \"not both in one. Whoever stands in doubt must choose one, and keep it.\" He does not look at her while he says it. Everyone else does."
 tm_rx.0002.desc_inquest:0 " Since the council at the Lateran, the bishops name three men of good repute in every parish to report whoever lives otherwise than Christians live. The master makes sure the hall remembers it."
 tm_rx.0002.a:0 "God made them male and female. I am the second."
 tm_rx.0002.b:0 "Your Chanter's own rule lets a name take its woman's form at confirmation. If his Church can do that, so can mine."
 tm_rx.0002.c:0 "Your Chanter's own word-book says the weaker sex overcame the world, the flesh and the devil. What is your excuse, Master?"
 tm_rx.0002.d:0 "Let him preach. I will eat in my own rooms tonight."

 tm_rx.0003.t:0 "A Consilium from Perugia"
 tm_rx.0003.desc_kin:0 "[tm_rx_kin.GetFirstName], a kinsman of [ROOT.Char.GetFirstName]'s, has asked [tm_rx_court.GetTitledFirstName]'s judges to hold her inheritance void. She took her lands as a son, the petition says, and the law knows no heir who was a son and is now a daughter."
 tm_rx.0003.desc_clerk:0 "A clerk of [tm_rx_court.GetTitledFirstName]'s chancery has asked whether [ROOT.Char.GetFirstName]'s inheritance still stands. She took her lands as a son, he writes, and the law knows no heir who was a son and is now a daughter."
 tm_rx.0003.desc:0 " The judges have sent for a consilium of Baldus de Ubaldis, the doctor of Perugia. Baldus was once asked whether Giovanni Malaspina, who lived as a man and whom the doctors called of mixed sex, might succeed to his father's fief. Baldus let him succeed, because the choice he had settled on after childhood was plain, and he had kept it. Baldus measured it by riding, arms and counsel: that is the jurist's test, and has nothing to do with her. The judges read the consilium for its rule. A settled will, kept, decides, and hers has been settled for years."
 tm_rx.0003.a:0 "Let the court read the consilium. I will pay the doctor's fee."
 tm_rx.0003.b:0 "My life is no news to anyone here. I need no doctor to say it."
 tm_rx.0003.c:0 "Tell the doctor his test is his own. I ride, I give counsel, and I am a woman."

 tm_rx.0010.t:0 "Within Our Borders"
 tm_rx.0010.desc:0 "A jurist at [tm_rx_court.GetTitledFirstName]'s court has read Ibn Hazm of Cordoba. Ibn Hazm wrote that the emir al-Hakam cut the sons of his own subjects who stood out for their beauty, took them into his palace as servants, and named mosques after them, and he called it the height of a ruler's cruelty. Every school of law forbids the knife within the lands of Islam, the jurist says, though none forbids buying those who were cut beyond them. He turns to [ROOT.Char.GetFirstName] and asks where she was cut, and by whose hand."
 tm_rx.0010.desc_grandmother:0 " He has heard how Grandmother's House makes its daughters: captives, cut without their asking."
 tm_rx.0010.desc_gift_alone:0 " He has heard that the Gift Alone cuts no one who does not ask for it. \"The schools forbid it whatever was asked,\" he says."
 tm_rx.0010.desc_other:0 " He does not much care which House it was. \"Within our borders, or beyond them,\" he says. \"Tell me which.\""
 tm_rx.0010.a:0 "Not here. No knife has been raised within your borders, and none of ours will be."
 tm_rx.0010.b:0 "The first judge of grievances in Cordoba was a cut man, Masarra. Your emirs gave him the seat. Give me a hearing."
 tm_rx.0010.c:0 "Al-Hakam's sin is ours too. Our House will answer for it before God."
 tm_rx.0010.d:0 "I asked for the knife. If your schools call that a sin, it is mine, and I am a woman still."

 tm_rx.0020.t:0 "The Forbidden Made Permitted"
 tm_rx.0020.desc:0 "A qadi of [tm_rx_court.GetTitledFirstName]'s court has spoken to the court's Muslims about [ROOT.Char.GetFirstName]. Whoever calls her life lawful, he says, declares the forbidden permitted, and the law reads that as leaving Islam."
 tm_rx.0020.desc_baqaqi_charged:0 " He names the jurist Ibn al-Baqaqi, who stands charged with it in Cairo."
 tm_rx.0020.desc_baqaqi_dead:0 " He reminds them of the jurist Ibn al-Baqaqi, whom the sultan's court put to death for it in 1302."
 tm_rx.0020.desc_plain:0 ""
 tm_rx.0020.desc_end:0 " Since then no one at court has said a word against her. No one will say one for her, either."
 tm_rx.0020.a:0 "Then let no one speak for me. I am not of your law, and I ask no one to break it for my sake."
 tm_rx.0020.b:0 "What my faith teaches, it teaches among its own. Not in your streets."
 tm_rx.0020.c:0 "Tell [tm_rx_friend.GetFirstName] to say nothing for me. I will not be the reason a friend stands before a qadi."

 tm_rx.0030.t1:0 "The Confessor's Questions"
 tm_rx.0030.t2:0 "The Dry Fast"
 tm_rx.0030.t3:0 "Barred from the Chalice"
 tm_rx.0030.desc1:0 "The bishop of [tm_rx_court.GetTitledFirstName]'s lands has sent a confessor to [ROOT.Char.GetFirstName]. He asks in the form his book gives him, one question at a time. Did you not keep a House of cut women in your lands? Did you not take their rite? [tm_rx_court.GetFirstName] has sent word only that it is the bishop's business, and that there is a war."
 tm_rx.0030.desc1_gift_alone:0 " For whoever takes a knife to their own flesh, his book sets three years on bread and water, and the newer canons count it graver than anything else in it."
 tm_rx.0030.desc1_grandmother:0 " For whoever cuts a boy to sell him, his book sets three years. The boy carries no sin, he adds: one cut as a child may even be ordained. The sin is the cutter's."
 tm_rx.0030.desc1_aunt_bea:0 " For whoever cuts another man, his book sets three years, on the one who held the knife."
 tm_rx.0030.desc2:0 "The confessor's penance has come: a dry fast on Mondays, Wednesdays and Fridays, with the prostrations counted at every prayer, as the Slavic books set it, lighter than the Greek. The same books say how a penance may be commuted: by alms, ninety nogaty for a year; by hearing the liturgy; or by vows."
 tm_rx.0030.desc3:0 "The bishop has barred [ROOT.Char.GetFirstName] from the chalice. If that is not enough, he writes, the next step is to put her out of the Church, and the parish will keep from her table."
 tm_rx.0030.a:0 "Pay the alms. The books allow it."
 tm_rx.0030.b:0 "Bear it."
 tm_rx.0030.c:0 "Tell the bishop our House keeps a rule, as any convent does. Let its vows count."
 tm_rx.0030.c.accepted:0 "The bishop counts the House's rule as vows."
 tm_rx.0030.c.refused:0 "The bishop will not count a House he does not know."
 tm_rx.0030.d:0 "I confess to my own Mothers."
 tm_rx.0030.e:0 "Then I will eat at my own table."

 tm_rx_counted_among_women_modifier:0 "Counted Among the Women"
 tm_rx_counted_among_women_modifier_desc:0 "The bishop's canonist wrote her down as a woman by Huguccio's rule: her company and her work."
 tm_rx_sworn_before_bishop_modifier:0 "Sworn Before the Bishop"
 tm_rx_sworn_before_bishop_modifier_desc:0 "She swore before the bishop to what she already was. The oath is her word, written down."
 tm_rx_settled_will_modifier:0 "A Settled Will"
 tm_rx_settled_will_modifier_desc:0 "The judges read the doctor of Perugia's consilium for its rule: a settled will, kept, decides."
 tm_rx_barred_from_chalice_modifier:0 "Barred from the Chalice"
 tm_rx_barred_from_chalice_modifier_desc:0 "A Slavic bishop has barred her from communion, and the parish keeps from her table."

 tm_rx_canonist_opinion:0 "Answered the Canonist"
 tm_rx_sworn_opinion:0 "Swore Before the Bishop"
 tm_rx_refused_oath_opinion:0 "Would Not Swear for Her Life"
 tm_rx_valley_gate_opinion:0 "Quoted the Chanter Against Us"
 tm_rx_consilium_opinion:0 "Settled by Consilium"
 tm_rx_no_knife_here_opinion:0 "No Knife Within Our Borders"
 tm_rx_spared_friend_opinion:0 "Would Not Let Me Speak for Her"
 tm_rx_slav_cutter_opinion:0 "The Cutter's Sin"
 tm_rx_slav_sponsor_opinion:0 "Keeps a House That Cuts"
 tm_rx_slav_cut_by_another_opinion:0 "Cut by Another"
 tm_rx_slav_own_knife_opinion:0 "Took the Knife Herself"
 tm_rx_slav_refused_opinion:0 "Refused the Bishop's Penance"
