 Berakha:0 "Berakha"
 Banina:0 "Banina"
 # The physician as protector (Stillman pp. 46, 183-187; Hirschberg pp. 112-113, 122; Kraemer ch. 5; Bennison p. 167).
 tm_hn3.physician_desc:0 "[tm_fisica.GetFirstName] of my court has learned the physician's art, and the women of the household already send for her. Rulers keep Jewish physicians near them, as the amirs of the Maghreb do, and a physician who rides with her lord can speak for her people. She heals with medicine alone: the Jewish physicians' oath forbids them charms."
 tm_hn3.physician_nagid_now:0 " In Qayrawan the Jews call the emir's physician their nagid: he rides with his lord to war, and speaks for them at court."
 tm_hn3.physician_nagid_then:0 " The Jews of Qayrawan once called the emir's physician their nagid: he rode with his lord to war, and spoke for them at court."
 tm_hn3.physician_vizier:0 " An amir may give his Jewish physician the title of vizier."
 tm_hn3.physician_a:0 "Take her into my service as my physician."
 tm_hn3.physician_b:0 "Take her into my service, with the title of vizier."
 tm_hn3.physician_c:0 "I have physicians enough."
 # Decisions.
 tm_hn3_two_parties_decision:0 "Decree of the Two Parties"
 tm_hn3_two_parties_decision_desc:0 "Here the street's ban is its own, and no lord licenses it. But a ruler may keep the parties of the Jews apart: neither to ban the other, each to keep the customs of its own schools."
 tm_hn3_two_parties_decision_tooltip:0 "Decree that neither party of the Jews in your realm may ban the other."
 tm_hn3_two_parties_decision_confirm:0 "Decree it"
 tm_hn3_two_parties_decision_needs_jews:0 "There are Jews of another party at your court or among your vassals"
 tm_hn3_two_parties_decision_effect_tt:0 "While you live, no daughter of the Turning in your realm can be shunned by a Jewish court, and the bans already laid are lifted. Jews of both parties at your court are pleased; their zealots are not."
 tm_hn3_refuge_decision:0 "They Shall Not Be Turned Away"
 tm_hn3_refuge_decision_desc:0 "Households are coming out of the Almohad lands, looking for a place where they can live openly as Jews."
 tm_hn3_refuge_decision_tooltip:0 "Receive a household of Rabbanite Jews at your court."
 tm_hn3_refuge_decision_confirm:0 "Open the gate"
 tm_hn3_refuge_decision_effect_tt:0 "A Rabbanite household finds shelter at your court. They keep their own faith; some may come to the kahal in time."
 tm_hn3_hush_decision:0 "The Decorous Hush"
 tm_hn3_hush_decision_desc:0 "Rule that no one at your court speaks a daughter's old name."
 tm_hn3_hush_decision_tooltip:0 "Rule that no one at your court speaks a daughter's old name."
 tm_hn3_hush_decision_confirm:0 "Rule it"
 tm_hn3_hush_decision_effect_tt:0 "Daughters of the Turning at your court are glad of it, and less troubled. Jews of other parties are less sure."
 # Modifiers.
 tm_hn3_physician_modifier:0 "Physician to the Lord"
 tm_hn3_physician_modifier_desc:0 "This character serves a ruler as physician, and speaks for her people at his court."
 tm_hn3_vizier_modifier:0 "Physician and Vizier"
 tm_hn3_vizier_modifier_desc:0 "This character serves a ruler as physician, with the title of vizier, and speaks for her people at his court."
 tm_hn3_lent_court_modifier:0 "The Ban Enforced"
 tm_hn3_lent_court_modifier_desc:0 "The ruler has lent his court to the street's ban on this character."
 tm_hn3_hush_modifier:0 "The Decorous Hush"
 tm_hn3_hush_modifier_desc:0 "At this court no one speaks this character's old name."
