l_english:
 # Ha-Nehpakhot in the Maghreb and the Sahel, wave 3 (events/tm_hn3_events.txt; docs/wave3/ha-nehpakhot-maghreb.md).
 # The Muslim lord and the street's ban (Hirschberg pp. 221, 233-237; Krakowski ch. 6; Goitein p. 212; Rustow ch. 8; Cohen p. 74).
 tm_hn3.0010.t:0 "The Street's Ban"
 tm_hn3.0010.desc:0 "The judges of the Jews in my lands have shunned [tm_hn3_banned.GetFirstName], a daughter of the Turning, for going about in a woman's dress after their feast. Their ban is their own affair and needs no leave of mine. But their judges have no officers, and after thirty days they ask whether my court will enforce it."
 tm_hn3.0010.desc_petition:0 " For her part, she has petitioned me, through those who serve me, to forbid it."
 tm_hn3.0010.desc_plain:0 " No one at my court has spoken for her."
 tm_hn3.0010.a:0 "Our law does not judge between them. Let a judge of their own hear it again, by their own law."
 tm_hn3.0010.b:0 "Lend them my court."
 tm_hn3.0010.c:0 "Forbid this ban."
 tm_hn3.0010.d:0 "We do not interfere in their affairs."
 # The rehearing: the trustworthy women (Goitein p. 212; Krakowski ch. 6).
 tm_hn3.0011.t:0 "The Trustworthy Women"
 tm_hn3.0011.desc:0 "[tm_hn3_lord.GetTitledFirstName] has sent my case back to be heard again, by our own law, before a new judge. The judge will not make me stand before the street. He has sent trustworthy women to my house, to hear me and to ask whether I hold to what I said."
 tm_hn3.0011.desc_witness:0 " A woman of my own people will sit with me when they come."
 tm_hn3.0011.desc_alone:0 " I will meet them alone."
 tm_hn3.0011.a:0 "Tell them what I told the judges."
 tm_hn3.0011.a.win:0 "The women tell the judge that I hold to every word. He lifts the ban."
 tm_hn3.0011.a.lose:0 "The judge hears the women, and lets the ban stand."
 tm_hn3.0011.b:0 "I will not be heard twice."
 # The Decree of the Two Parties (al-Zahir, 1030: Rustow ch. 8; Stillman p. 198).
 tm_hn3.0020.t:0 "The Two Parties"
 tm_hn3.0020.desc:0 "The judges of the street have shunned [tm_hn2_shunned.GetFirstName], a daughter of the Turning. In this country no lord licenses a ban: it is the street's own. But a ruler may forbid a ban when one party asks it, and she has asked."
 tm_hn3.0020.desc_decree:0 " In Egypt the caliph once decreed that neither party of the Jews should interfere with the other, each keeping the customs of its own schools."
 tm_hn3.0020.desc_early:0 " A ruler could decree that neither party of the Jews may ban the other, each keeping its own customs."
 tm_hn3.0020.a:0 "Decree it: neither party shall ban the other."
 tm_hn3.0020.b:0 "Forbid this ban, and only this one."
 tm_hn3.0020.c:0 "The judges of the street have ruled."
 tm_hn3_niddui_decree_toast:0 "The ruler's decree forbids the ban, and the sentence fell"
 # The story with no ending (Nissim of Qayrawan, trans. Brinner, pp. 6, 175-176).
 tm_hn3.0030.t:0 "The Story with No Ending"
 tm_hn3.0030.desc:0 "When the lamps are lit I tell the women a story from the book of Nissim of Qayrawan. An uncle leaves his orphaned niece in the Street of the Perfumers, in a city over the sea, to see whether God will provide for her. She waits until sunset and weeps into her sleeve. The elders of the city offer her a night's shelter with their own women, and she says she cannot, for she is a Jewish woman. So the qadi and the market inspectors send for a Jew of the market.\n\nThere the book breaks off. Nissim asked whoever found a gap in his book to fill it. The women are waiting for me to fill this one."
 tm_hn3.0030.a:0 "The Jew of the market was a woman of the lamp, and she took her home."
 tm_hn3.0030.b:0 "Her uncle came back ashamed, and she forgave him."
 tm_hn3.0030.c:0 "She kept her father's fields, and married whom she chose."
 # Robes from the Lady (Gil p. 188; Goitein p. 357).
 tm_hn3.0040.t:0 "Robes of Honour"
 tm_hn3.0040.desc:0 "[tm_hn3_scholar.GetFirstName] of my court has read before my household from the books of her people, and the learned of the city speak of her. A court that honours learning is honoured for it."
 tm_hn3.0040.a:0 "Send her robes of honour and a saddled mule."
 tm_hn3.0040.b:0 "Have her read before my household again."
 tm_hn3.0040.c:0 "Not this year."
 # They shall not be turned away (Hirschberg p. 195).
 tm_hn3.0050.t:0 "They Shall Not Be Turned Away"
 tm_hn3.0050.desc:0 "A household has come to my gate out of the lands of the Almohads: a man and his wife, Jews of the Rabbanite party, with little more than they could carry. They ask to live under my protection, openly as Jews."
 tm_hn3.0050.desc_epistle:0 " The women of the lamp quote the son of Maimon: those who come out shall be received, and not turned away."
 tm_hn3.0050.desc_early:0 " The women of the lamp say that no one who comes to our gate is turned away."
 tm_hn3.0050.a:0 "They shall not be turned away. Take them into my household."
 # The decorous hush (Stroumsa p. 59).
 tm_hn3.0060.t:0 "The Decorous Hush"
 tm_hn3.0060.desc:0 "Among the women of the lamp, a daughter's old name belongs to her past, and it is hers to tell or to keep. At court it is still spoken, sometimes in jest and sometimes in a quarrel. I could rule that no one at my court speaks it."
 tm_hn3.0060.desc_west:0 " The Jews of the west kept a like silence about the past of those who had come back to their people. To break it in a quarrel was thought to shame the one who spoke."
 tm_hn3.0060.a:0 "Let no one at my court speak it."
 tm_hn3.0060.b:0 "Not now."
 # Qayrawanese attire, the Maghreb version of the adornment (Goitein p. 167).
 tm_hn3.attire_end_qayrawan:0 " The merchants could send to Qayrawan for a complete attire: a Qayrawanese robe, cap, veil and mantle."
 tm_hn3.attire_end_fashion:0 " The merchants could send for a complete attire in the Qayrawan fashion: a robe, a cap, a veil and a mantle."
 tm_hn3.attire_option:0 "Send for the robe, cap, veil and mantle."
 tm_hn3.attire_worn:0 "[tm_hn2_giver.GetFirstName] has sent for a complete attire for me: a robe, a cap, a veil and a mantle in the Qayrawan fashion. The women of the lamp call such a gift the adornment."
 tm_hn3_attire_name:0 "The Qayrawanese Attire"
 tm_hn3_attire_desc:0 "A robe, a cap, a veil and a mantle, sent for at a wedding. The women of the lamp call it the adornment."
 tm_hn3_attire_modifier:0 "The Qayrawanese Attire"
 tm_hn3_attire_modifier_desc:0 "A complete attire in the Qayrawan fashion, given at a wedding."
 # The rope from heaven (Maimon b. Joseph, Epistle of Consolation, Fez 1159/60; Kraemer ch. 6). The elder's voice.
 tm_hn3.rope_from_heaven:0 " She says it as the old letter from Fez says it: the commandments are a rope let down from heaven. Hold on, even by the fingertips. That is more hope than letting go."
 # The stirrup of Purim (Nissim, in Hirschberg p. 170).
 tm_hn3.purim_fire_qayrawan:0 " Last night was Purim eve. In Qayrawan and the towns that keep its customs, the young people light great fires and leap over them. They call it the stirrup of Purim. I leapt with them, in the dress."
 tm_hn3.purim_fire_gate:0 " Last night was Purim eve. The women of the lamp lit the fire of Qayrawan behind the gate of the quarter and leapt it, the stirrup of Purim. I leapt with them, in the dress."
 tm_hn3.purim_fire_after:0 " Last night was Purim eve. The families who came from Qayrawan light great fires for it and leap over them, the stirrup of Purim, and the women of the lamp keep the custom with them. I leapt with them, in the dress."
 tm_hn3.purim_fire_option:0 "Remember the fire: I leapt it in the dress, and no one laughed."
 # Maghrebi names (Goitein pp. 314-319; Gil; India Traders pp. 57, 70).
 tm_hn3.maghreb_name_option:0 "A name of the street, as the Jewish women of the Maghreb are called."
 Sitt_al_Kull:0 "Sitt al-Kull"
 Sitt_al_Ahl:0 "Sitt al-Ahl"
 Sitt_al_Dar:0 "Sitt al-Dar"
 Sittuna:0 "Sittuna"
 Sittat:0 "Sittat"
 Mawlat:0 "Mawlat"
