l_english:
 # Bædling: the níð-pole, the cup and the Wolf's Sermon (events/tm_bae5_events.txt)
 tm_bae5.0001.t:0 "The Níð-Pole"
 tm_bae5.0001.desc:0 "Men of [tm_nid_raiser.GetShortUINameNotMe] came by night and set up a pole on the headland, turned toward my hall. On it are carved two men, one bent before the other, and the one in front wears a blue hat. The runes on the pole say who it is meant for.\n\nThe whole coast has seen it by now. They say the man who carved it was paid well, and that no one who saw it thought either figure stood well."
 tm_bae5.0001.a:0 "Burn it."
 tm_bae5.0001.b:0 "The hat is Óðinn's, and so am I."
 tm_bae5.0001.b.tt:0 "I leave the pole standing and let the coast read it as I do."
 tm_bae5.0001.c:0 "Carry it to the thing."
 tm_bae5.0001.c.tt:0 "Carved #italic níð#! is a wrong at law, whoever it names. It goes into the Account between our houses, and the thing will think less of the man who paid for it."
 tm_bae5_nid_raised_modifier:0 "Raised a Níð-Pole"
 tm_bae5_nid_raised_modifier_desc:0 "This character raised a níð-pole. The pole shames the one who raises it as well as the one it names."
 tm_bae5_nid_pole_opinion:0 "Raised a níð-pole against me"
 house_relation_reason_tm_nid_pole_desc:0 "[char.GetShortUINameNotMe|U] raised a níð-pole against [target_char.GetShortUINameNotMe]"

 tm_bae5.0010.t:0 "The First Cup"
 tm_bae5.0010.desc:0 "The benches were full and the fire high when [tm_cup_lady.GetFirstName] rose with the cup. The cupbearer pours for the hall, but the first cup is hers to give, and she brought it to me herself.\n\n\"The old rule,\" she said, so that the benches could hear, \"is that the lady gives the first cup to the one who holds the seat, and her counsel with it.\" Then, more quietly, she told me what she thought I should do."
 tm_bae5.0010.a:0 "Take the cup, and her counsel."
 tm_bae5.0010.b:0 "Drink, and keep my own counsel."
 tm_bae5_first_cup_opinion:0 "The first cup"

 tm_bae5.0020.t:0 "The Bragarfull"
 tm_bae5.0020.desc:0 "The seat of [previous_holder.GetShortUINameNotMe] stands empty, and the hall is waiting to see who will fill it. By the old custom the heir does not sit down until she has stood before the benches, spoken her vow over the bragarfull, and drunk it to the bottom. Only then does she take the high seat, and only then is the inheritance hers."
 tm_bae5.0020.desc.born:0 ""
 tm_bae5.0020.desc.chosen:0 "\n\nI was not born to the one who sat here before me. There are men on the benches who would say that this makes me no heir at all. The cup answers them: whoever drinks it before witnesses and takes the seat is the heir, whatever her birth."
 tm_bae5.0020.desc.bearer:0 "\n\n[tm_cup_bearer.GetFirstName] has the cup. She will hand it to me."
 tm_bae5.0020.desc.alone:0 "\n\nNo one is left to hand me the cup, so I will lift it myself."
 tm_bae5.0020.a:0 "Drain the cup and take the high seat."
 tm_bae5_bragarfull_opinion:0 "Handed me the bragarfull"

 tm_bae5.0030.t:0 "The Wolf's Sermon"
 tm_bae5.0030.desc:0 "[tm_wolf_reader.GetShortUINameNotMe|U] has been reading from Archbishop Wulfstan's sermon to the English, the one that was preached when the Danes were in the land. He reads it slowly, and he looks at me while he does. \"Here are witches and #italic wælcyrian#!,\" he reads, and he names them along with harlots and robbers as the ruin of the English.\n\nThey call us #italic wælcyrian#! here. They mean it as a curse."
 tm_bae5.0030.a:0 "And we take it as a rank."
 tm_bae5.0030.b:0 "Let it pass."
 tm_bae5_wolf_sermon_opinion:0 "Answered the Wolf's Sermon"
