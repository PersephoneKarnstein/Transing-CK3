l_english:
 # The Account (common/scripted_effects/tm_feud_effects.txt)
 house_relation_reason_tm_nid_desc:0 "[char.GetShortUINameNotMe|U] said one of the three words of [target_char.GetShortUINameNotMe] before witnesses"
 house_relation_reason_tm_cell_desc:0 "[char.GetShortUINameNotMe|U] emptied [target_char.GetShortUINameNotMe]'s prison"
 house_relation_reason_tm_house_raided_desc:0 "[char.GetShortUINameNotMe|U] raided a Sisters' House of [target_char.GetShortUINameNotMe]'s"
 house_relation_reason_tm_bot_desc:0 "[char.GetShortUINameNotMe|U] paid bót to [target_char.GetShortUINameNotMe]"
 tm_feud_gift_owed_toast:0 "A Gift Unpaid"
 tm_feud_gift_given_toast:0 "A Gift Given"

 tm_feud_offer_bot_interaction:0 "Offer Bót"
 tm_feud_offer_bot_interaction_desc:0 "Pay what my house owes [recipient.GetShortUIName]'s for the wrongs it has not answered, and close the Account between us. Arbitration, not the law, ends most feuds, and only arbitration pays."
 tm_feud_offer_bot_interaction_tt:0 "The Account between the two houses is closed, and neither may wrong the other for ten years without being called a truce-breaker."
 tm_feud_bot_taken_toast:0 "Bót Taken"
 tm_feud_bot_refused_toast:0 "Bót Refused"
 tm_feud_ai_greedy:0 "Greedy"
 tm_feud_ai_forgiving:0 "Forgiving"
 tm_feud_ai_vengeful:0 "Vengeful"
 tm_feud_ai_wrathful:0 "Wrathful"
 tm_feud_ai_at_war:0 "Needs peace at home"

 tm_feud_settled_opinion:0 "Settled the Account"
 tm_feud_truce_broken_opinion:0 "Broke the Settlement"
 tm_feud_nid_dismissed_opinion:0 "Would Not Hear My Suit"
 tm_feud_nid_arbitrated_opinion:0 "Paid for His Words"

 tm_feud.0010.t:0 "Bót"
 tm_feud.0010.desc:0 "[actor.GetName] sends word that [actor.GetHerHis] house will pay [tm_feud_price|0] gold for the wrongs it has done mine and not answered, and asks that the Account be closed.\n\nThe old men say gold received for a death only pays for the next one. The young ones say the dead were worth more than this."
 tm_feud.0010.a:0 "We take it, and the Account is closed."
 tm_feud.0010.b:0 "The dead are worth more than silver."

 tm_feud.0020.t:0 "The Three Words"
 tm_feud.0020.desc:0 "[tm_flyter.GetName] said it before witnesses: #italic ragr#!, one of the three words the law lets the one named answer with steel. Under the law of the þing the one who says it is the one outlawed, with no fine to buy it off, and the one he named may answer it with steel until the next Assembly."
 tm_feud.0020.desc.court_sisters:0 "\n\n[tm_feud_lord.GetName] keeps the hall where it was said, and can hear a suit. [tm_feud_lord.GetSheHe|U] keeps one of the six faiths, and before such a lord the Sisters speak their own suits."
 tm_feud.0020.desc.court_bearer:0 "\n\n[tm_feud_lord.GetName] keeps the hall where it was said, and can hear a suit. The þing has heard I am a woman. So a man must speak for me now: [tm_feud_bearer.GetName] will carry it, and I will stand beside him and hear my own words in his mouth.\n\nIt is the first time the law has agreed with me about anything."
 tm_feud.0020.desc.court_nobearer:0 "\n\n[tm_feud_lord.GetName] keeps the hall where it was said, and could hear a suit. The þing has heard I am a woman, and a woman's suit is carried by a man. No man would carry it. It stands in the Account between our houses."
 tm_feud.0020.desc.nocourt:0 "\n\nThere is no court here that could hear a suit against him. It stands in the Account between our houses."
 tm_feud.0020.a:0 "Bring the suit."
 tm_feud.0020.a.tt:0 "[tm_feud_lord.GetName] will decide whether [tm_flyter.GetName] is outlawed."
 tm_feud.0020.a.bearer_tt:0 "[tm_feud_bearer.GetName] carries the suit. How well he speaks weighs with the lord."
 tm_feud.0020.a.hired_tt:0 "He is no kin of mine. He takes the suit for a fee, and I pay what I have, up to 15 gold."
 tm_feud_bearer_custom_trigger:0 "A man at my court or the lord's to carry the suit: my husband, a close kinsman, a friend of a House, a brother of the six faiths, a man who thinks well of me, or, for a fee, any man who bears me no ill will"
 tm_feud.0020.desc.court_farkin:0 "\n\n[tm_feud_lord.GetName] keeps the hall where it was said, and could hear a suit. The þing has heard I am a woman, and a woman's suit is carried by a man. No man here will carry it. [tm_feud_far_kin.GetName] could, if I send for him and he will make the journey."
 tm_feud.0020.c:0 "Send for [tm_feud_far_kin.GetFirstName]."
 tm_feud.0020.c.tt:0 "In two to five months, [tm_feud_far_kin.GetName] comes to the þing and carries the suit, or sends word that he will not. He is likelier to come if he thinks well of you."
 tm_feud_kin_came_toast:0 "He Came to the Þing"
 tm_feud_kin_came_toast.tt:0 "[tm_feud_bearer.GetName] has made the journey and will carry the suit."
 tm_feud_kin_refused_toast:0 "He Will Not Come"
 tm_feud_kin_refused_toast.tt:0 "[ROOT.Char.GetName] sent word that he will not make the journey. The words stand in the Account."
 tm_feud.0020.b:0 "Let it stand in the Account."
 tm_feud.0020.b.tt:0 "His house owes mine for the words."

 tm_feud.0021.t:0 "A Suit for Words"
 tm_feud.0021.desc:0 "[tm_feud_plaintiff.GetName] brings a suit against [tm_flyter.GetName] for the three words, and asks that every word be taken as it was spoken. Under the law he is outlawed for them."
 tm_feud.0021.desc.self:0 "[tm_flyter.GetName] said the word of me in my own hall. The law says he is the one outlawed for it, and it is my court that hears it."
 tm_feud.0021.desc.thing:0 "\n\nIt was said at the þing in June, where words weigh double."
 tm_feud.0021.desc.hall:0 "\n\nIt was said in the hall, before witnesses."
 tm_feud.0021.desc.bearer:0 "\n\n[tm_feud_bearer.GetName] carries the suit for her, as the law asks of a woman's. She stands at his side, and twice she corrects him."
 tm_feud.0021.a:0 "Every word is to be as it is spoken."
 tm_feud.0021.a.tt:0 "[tm_flyter.GetName] is fully outlawed. Anyone may kill him without starting a feud."
 tm_feud.0021.b:0 "Better he pays her for them."
 tm_feud.0021.b.tt:0 "[tm_flyter.GetName] pays [tm_feud_plaintiff.GetName] [tm_feud_nid_price|0] gold, and the words are taken off the Account."
 tm_feud.0021.c:0 "I will not hear it."

 tm_feud.0030.t:0 "Named at the Þing"
 tm_feud.0030.desc:0 "The killing was named to five neighbours, and at the þing it was announced for me: one outlaw's death against my own sentence."
 tm_feud.0030.desc.passage:0 "\n\nI am an outlaw who may be given passage. Whoever takes me in now owes my accuser nothing."
 tm_feud.0030.desc.lesser:0 "\n\nMy sentence is the lesser one now: three winters, and then I am free of it."
 tm_feud.0030.desc.free:0 "\n\nI am free of the sentence."
 tm_feud.0030.a:0 "So it is spoken."

 # Wave 7: escalation, self-judgment, the refused Account, fostering, the sister's revenge, the suit-bearer
 tm_feud_bot_spent_on_spears_modifier:0 "Bót Spent on Spears"
 tm_feud_bot_spent_on_spears_modifier_desc:0 "The settlement was broken. The silver taken for the last death now pays for the answer to this one."
 tm_feud_overbalance_toast:0 "It Overbalances"
 tm_feud_unworthy_toast:0 "Not a Worthy Object"
 tm_feud_admitted_toast:0 "Admitted to the Field"
 tm_feud_refused_toast:0 "No Account with Women"
 tm_feud_refused_toast_tt:0 "[tm_feud_wrongdoer.GetName]: "I do not keep an account with women."\nNothing is written between our houses. The next wrong my house does his will be answered with honour."
 tm_feud_answered_toast:0 "Answered with Honour"
 tm_feud_answered_toast_tt:0 "[tm_feud_wrongdoer.GetName] has answered the man who would keep no Account with a woman, and the North has seen it."
 tm_feud_sj_modest_toast:0 "A Measured Award"
 tm_feud_sj_modest_toast_tt:0 "[recipient.GetName] named the price the law would set: [tm_feud_price|0] gold."
 tm_feud_sj_heavy_toast:0 "An Uneven Award"
 tm_feud_sj_heavy_toast_tt:0 "[recipient.GetName] named [tm_feud_price|0] gold. The North calls it uneven."
 tm_feud_sj_remit_toast:0 "The Award Remitted"
 tm_feud_sj_remit_toast_tt:0 "[recipient.GetName] named a price and remitted all of it. My house owes nothing now but the honour."

 tm_feud_fair_judgment_opinion:0 "Judged Me Fairly"
 tm_feud_uneven_opinion:0 "Uneven"
 tm_feud_humbled_opinion:0 "Remitted What I Owed"
 tm_feud_answered_with_honour_opinion:0 "Answered with Honour"
 tm_feud_foster_seal_opinion:0 "Fostered to Seal a Settlement"
 tm_feud_avenge_her_opinion:0 "Killed One of Ours"

 tm_feud_grant_self_judgment_interaction:0 "Grant Self-Judgment"
 tm_feud_grant_self_judgment_interaction_desc:0 "Let [recipient.GetShortUIName] name the price of the wrongs my house owes [recipient.GetHerHis], and pay whatever is named. The grant itself costs honour. What is named may cost more."
 tm_feud_grant_self_judgment_interaction_tt:0 "[recipient.GetShortUIName|U] names the price: what the law would set, twice that, or nothing at all. Whatever is named closes the Account."
 tm_feud_foster_option:0 "And foster a child of their hall"
 tm_feud_foster_option_desc:0 "A child of [recipient.GetShortUIName]'s house comes to my court as my ward, and the truce runs fifteen years. The one who fosters is the lesser. The hall is glad to be lesser."
 tm_feud_offer_bot_foster_tt:0 "The Account between the two houses is closed, and neither may wrong the other for fifteen years without being called a truce-breaker. [tm_feud_ward.GetName] becomes my ward."
 tm_feud_ai_foster:0 "A child of our hall fostered"

 tm_feud.0040.t:0 "Self-Judgment"
 tm_feud.0040.desc:0 "[actor.GetName] has given me self-judgment. I am to name the price of every wrong [actor.GetHerHis] house owes mine, and [actor.GetSheHe] has promised to pay it.\n\nThe law would set [tm_feud_modest_price|0] gold. Some would name a sum so high that no one will have been dearer than our dead, and be called uneven for the rest of their lives."
 tm_feud.0040.a:0 "[tm_feud_modest_price|0] gold, what the law would set."
 tm_feud.0040.b:0 "[tm_feud_heavy_price|0] gold. No one will have been dearer."
 tm_feud.0040.b.tt:0 "Rulers of my faith or of the North's old faiths who know of it will call me uneven."
 tm_feud.0040.c:0 "Nothing. Let [actor.GetHerHim] owe me the honour."
 tm_feud.0040.c.tt:0 "No gold is paid. The Account is closed, and [actor.GetName] is the lesser for it."

 tm_feud.0060.t:0 "Avenge Her"
 tm_feud.0060.desc:0 "[tm_feud_dead.GetName] is dead, and [tm_feud_killer.GetName] killed her. She was an outlaw. The law counts no wrong in her death, and no þing will hear a suit for her."
 tm_feud.0060.desc.sister:0 "\n\nShe was my sworn sister. Whatever stood between us, the sentence did not undo that."
 tm_feud.0060.desc.fostered:0 "\n\nShe took me into her hall and raised me there."
 tm_feud.0060.desc.house:0 "\n\nShe died in the county of my House, and the House keeps the memory of its own."
 tm_feud.0060.desc.end:0 "\n\nThe law will not count it. I can."
 tm_feud.0060.a:0 "Her Account is mine now."
 tm_feud.0060.a.tt:0 "[tm_feud_killer.GetName]'s house owes mine one wrong. The law does not count it: no truce is broken by it, and no þing will hear of it."
 tm_feud.0060.b:0 "Let it rest."
